<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>从文化想象到智能工作流 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"从文化想象到智能工作流","children":[{"content":"从想象到现实","children":[{"content":"文化想象：自主机器、现实控制与人的边界","children":[]},{"content":"现实入口：AI 是工作流中的能力节点","children":[]}]},{"content":"理解 AI","children":[{"content":"四种视角：像人或理性地思考与行动","children":[]},{"content":"图灵测试：从行为表现判断","children":[]},{"content":"多学科基础：八个学科共同解释智能","children":[]}]},{"content":"人工智能如何发展","children":[{"content":"分析框架：能力、条件与边界","children":[]},{"content":"历史循环：浪潮、寒冬与路线转换","children":[]},{"content":"三大流派：符号、连接与行动","children":[]},{"content":"技术演化：规则、数据、模型与反馈","children":[]}]},{"content":"大模型与智能体","children":[{"content":"模型能力：参数、上下文与外部工具","children":[]},{"content":"自然语言接口：提示词表达目标与约束","children":[]},{"content":"工具调用：把模型输出连接到行动","children":[]},{"content":"智能体：围绕目标形成反馈循环","children":[]}]},{"content":"工作流与协作分工","children":[{"content":"五种对象：输入、步骤、中间产物、检查点、输出","children":[]},{"content":"三类角色：AI 探索、脚本执行、人作判断","children":[]},{"content":"复核强度：可验证性、错误代价、责任归属","children":[]},{"content":"三类边界：事实、行动与责任","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
