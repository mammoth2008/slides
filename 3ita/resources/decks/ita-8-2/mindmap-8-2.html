<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程知识与简答复习 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"课程知识与简答复习","children":[{"content":"主题 01：人工智能、机器学习与生成式 AI","children":[{"content":"先说明要完成的任务，再判断需要何种能力；评价输出是否符合目的，而不是由“用了 AI”推断先进或正确","children":[]}]},{"content":"主题 02：研究路线与学习方式","children":[{"content":"区分训练阶段与使用阶段","children":[]}]},{"content":"主题 03：大语言模型、生成与幻觉","children":[{"content":"把关键主张拆成题名、对象、数字、范围等可核对项目；保留原文定位","children":[]}]},{"content":"主题 04：模型、应用、工具、插件与调用","children":[{"content":"安装前核对来源、版本、作用与影响范围；安装后检查启用状态并完成一次功能调用；知道怎样禁用或卸载","children":[]}]},{"content":"主题 05：任务目标与完成标准","children":[{"content":"先写一个阅读问题，再给输出栏目；规定只能根据提供材料回答、区分作者主张与个人判断，并以学生能解释一个结论作为学习检查","children":[]}]},{"content":"主题 06：提示、上下文与多轮对话","children":[{"content":"每次追问指出原回答具体哪里不懂或缺依据；要求结合一个例子解释，再由学生复述并对照原文","children":[]}]},{"content":"主题 07：搜索、检索增强与来源定位","children":[{"content":"先用线索检索，要求候选及匹配理由；打开来源后核对身份；记录 DOI、版本、下载入口和日期","children":[]}]},{"content":"主题 08：文件读取、格式转换与结构化笔记","children":[{"content":"先选择正文和关键图表等代表页，用同一输入比较工具；记下工具、处理方式、输入输出与抽查位置","children":[]}]},{"content":"主题 09：研究问题、方法、证据与结论","children":[{"content":"读摘要建立全貌，回到第 2–4 节查数据、方法和结果，再读讨论与限制","children":[]}]},{"content":"主题 10：核验、检查点与验收","children":[{"content":"挑选重要或高风险主张逐项回查；记录通过、需修改、证据不足","children":[]}]},{"content":"主题 11：人机分工与学习收益","children":[{"content":"先写自己的问题和初步判断，再让 AI 帮助；关闭生成答案后解释一项结论，指出原文依据和一个限制；有不懂的地方如实保留","children":[]}]},{"content":"主题 12：工具选择、成本与信息边界","children":[{"content":"画清输入去向和输出位置；只提供当前任务需要的材料；确认账号、接口与费用","children":[]}]},{"content":"主题 13：工作流与异常处理","children":[{"content":"画出每步输入和输出；为关键依赖设检查点；规定一次失败后的处理和停止条件","children":[]}]},{"content":"主题 14：智能体、Harness 与受控执行","children":[{"content":"第一次只指定一个目录、一个输入和一个输出；查看实际调用与文件；明确不覆盖原件、缺证据时停止","children":[]}]},{"content":"主题 15：模板、Skill 与测试","children":[{"content":"先写适用与不适用情况，再写输入、步骤、输出和失败处理；确认加载与调用；用正常、缺失或错误输入测试","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
