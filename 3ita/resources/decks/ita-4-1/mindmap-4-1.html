<!doctype html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="../../theme/fonts.css">

  <script>
    const tree = {"content":"AI 输出的核验与改进","children":[{"content":"发现草稿中的问题","children":[{"content":"原句、来源与支持程度","children":[]},{"content":"对象、比较方式与适用范围","children":[]}]},{"content":"规定检查与验收","children":[{"content":"内容、含义、缺口与保存","children":[]},{"content":"检查点和错误传播","children":[]}]},{"content":"补充请求并检查新稿","children":[{"content":"对象、依据与输出标准","children":[]},{"content":"指标口径和来源限制","children":[]},{"content":"参考稿与实际输出","children":[]}]},{"content":"定位问题与记录改进","children":[{"content":"材料、解释和来源不足","children":[]},{"content":"同条件比较与未测范围","children":[]},{"content":"继续、结束与交接","children":[]}]},{"content":"迁移到会议纪要","children":[{"content":"计划、批准与完成状态","children":[]},{"content":"新请求与验收条件","children":[]},{"content":"AI 整理与人的采用判断","children":[]}]}]};
