<body>
  <svg id="mindmap"></svg>

  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"模型、工具、工具调用与上下文","children":[{"content":"从任务出发","children":[{"content":"主案例：两条课程通知 → 最新日历草稿","children":[]},{"content":"五种操作：获取、理解、处理、行动与判断","children":[]},{"content":"任务性质：语境、时效、重复规则、错误影响与可验证性","children":[]}]},{"content":"模型能做什么","children":[{"content":"候选：理解“本周”“周五”和“不变”","children":[]},{"content":"限制：不能自动取得更新，也不能直接完成真实行动","children":[]}]},{"content":"工具怎样工作","children":[{"content":"契约：输入、输出、权限、证据与失败状态","children":[]},{"content":"确定执行：字段错误会被稳定执行","children":[]}]},{"content":"模型与工具怎样配合","children":[{"content":"模型：解释材料并提出字段","children":[]},{"content":"宿主：检查参数与权限","children":[]},{"content":"工具：生成草稿并返回状态","children":[]},{"content":"人：核对并决定是否写入","children":[]}]},{"content":"工具边界表","children":[{"content":"日历草稿：只生成，不写入","children":[]},{"content":"公开搜索：只读来源，保留日期与位置","children":[]},{"content":"接管点：缺信息、扩大权限或产生后果前确认","children":[]}]},{"content":"工具调用怎样发生","children":[{"content":"五步往返：提供、请求、预检、执行与继续","children":[]},{"content":"角色分工：用户、模型、宿主应用与外部工具","children":[]},{"content":"调用记录：参数、草稿编号与 <code>needs_confirmation<\/code>","children":[]}]},{"content":"上下文与结构化结果","children":[{"content":"最小够用：任务、两条通知、时区、规则与工具说明","children":[]},{"content":"两种结构：调用参数与任务结果","children":[]},{"content":"三层验证：格式、内容与判断","children":[]}]},{"content":"安全边界与综合练习","children":[{"content":"外部材料：通知正文不能扩大行动权限","children":[]},{"content":"分层防线：角色分离、最小权限、行动确认与调用记录","children":[]},{"content":"迁移案例：公开来源能否支持“客户环境部署”","children":[]},{"content":"课程递进：一次调用进入第三周的节点与工作流","children":[]}]}]};
