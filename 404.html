<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面未找到｜课程课件</title>
  <link rel="icon" data-root-asset="hustlogo72.png">
  <style>
    :root {
      --paper: #f1efe7;
      --paper-bright: #fbfaf6;
      --ink: #182126;
      --muted: #687278;
      --blue: #244d63;
      --blue-soft: #dbe5e8;
      --terracotta: #b95d3b;
      --line: #9aa6aa;
      --serif: "Source Han Serif CN", "Source Han Serif SC", "Songti SC", STSong, SimSun, serif;
      --sans: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background:
        repeating-linear-gradient(0deg, transparent 0 39px, rgba(36, 77, 99, .08) 39px 40px),
        repeating-linear-gradient(90deg, transparent 0 39px, rgba(36, 77, 99, .08) 39px 40px),
        var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .page {
      display: grid;
      width: min(1160px, calc(100% - 48px));
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      grid-template-rows: auto 1fr auto auto;
      border-inline: 1px solid var(--line);
      background: rgba(251, 250, 246, .94);
    }

    .masthead {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr) auto;
      align-items: stretch;
      border-bottom: 4px solid var(--ink);
      background: var(--paper-bright);
    }

    .system-code,
    .system-state,
    .system-title {
      min-height: 68px;
      padding: 18px 22px;
    }

    .system-code {
      display: grid;
      background: var(--blue);
      color: #fff;
      font: 800 14px/1 var(--mono);
      letter-spacing: .16em;
      place-items: center;
    }

    .system-title {
      display: flex;
      align-items: center;
      border-right: 1px solid var(--line);
      font: 700 14px/1.3 var(--sans);
      letter-spacing: .12em;
    }

    .system-state {
      display: grid;
      align-content: center;
      color: var(--terracotta);
      font: 800 12px/1.4 var(--mono);
      letter-spacing: .08em;
      text-align: right;
      text-transform: uppercase;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: clamp(42px, 7vw, 92px);
      align-items: center;
      padding: clamp(56px, 9vw, 112px) clamp(28px, 7vw, 86px);
    }

    .error-copy { max-width: 650px; }

    .eyebrow {
      display: inline-block;
      margin: 0 0 22px;
      padding-bottom: 7px;
      border-bottom: 3px solid var(--terracotta);
      color: var(--blue);
      font: 800 13px/1 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font: 900 clamp(62px, 10vw, 126px)/.82 var(--serif);
      letter-spacing: -.08em;
    }

    .message {
      max-width: 560px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .action {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      gap: 16px;
      padding: 12px 17px;
      border: 2px solid var(--ink);
      background: var(--ink);
      color: #fff;
      font: 800 13px/1.2 var(--sans);
      letter-spacing: .05em;
      text-decoration: none;
      cursor: pointer;
    }

    .action.secondary {
      background: transparent;
      color: var(--ink);
    }

    .action span {
      color: #f2b49c;
      font: 900 19px/1 var(--mono);
    }

    .action.secondary span { color: var(--terracotta); }

    .action:hover { background: var(--terracotta); border-color: var(--terracotta); }
    .action.secondary:hover { color: #fff; }
    .action:focus-visible { outline: 4px solid var(--terracotta); outline-offset: 4px; }

    .diagram {
      position: relative;
      display: grid;
      aspect-ratio: 1;
      border: 4px solid var(--ink);
      background: var(--blue-soft);
      place-items: center;
    }

    .diagram::before,
    .diagram::after {
      content: "";
      position: absolute;
      background: var(--ink);
    }

    .diagram::before { width: 100%; height: 2px; }
    .diagram::after { width: 2px; height: 100%; }

    .diagram-code {
      position: relative;
      z-index: 1;
      display: grid;
      width: 58%;
      aspect-ratio: 1;
      border: 18px solid var(--terracotta);
      background: var(--paper-bright);
      color: var(--blue);
      font: 900 clamp(44px, 7vw, 76px)/1 var(--mono);
      place-items: center;
      transform: rotate(-4deg);
    }

    .diagram-label {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 2;
      padding: 7px 9px;
      background: var(--ink);
      color: #fff;
      font: 700 10px/1 var(--mono);
      letter-spacing: .1em;
    }

    .course-links {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      background: var(--paper-bright);
    }

    .course-link {
      display: grid;
      min-height: 82px;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px 28px;
      text-decoration: none;
    }

    .course-link + .course-link { border-left: 1px solid var(--line); }

    .course-link b {
      color: var(--terracotta);
      font: 800 12px/1 var(--mono);
      letter-spacing: .08em;
    }

    .course-link strong { font: 800 16px/1.35 var(--serif); }
    .course-link span { color: var(--blue); font: 900 21px/1 var(--mono); }
    .course-link:hover { background: var(--blue-soft); }
    .course-link:focus-visible { outline: 4px solid var(--terracotta); outline-offset: -4px; }

    .registration {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 20px;
      padding: 12px 28px;
      border-top: 1px solid var(--line);
      background: var(--ink);
      color: #dce2e4;
      font: 700 10px/1.5 var(--mono);
      letter-spacing: .04em;
    }

    .registration a { text-underline-offset: 3px; }

    @media (max-width: 820px) {
      .page { width: 100%; border: 0; }
      .masthead { grid-template-columns: 108px 1fr; }
      .system-state { display: none; }
      .system-title { border: 0; }
      main { grid-template-columns: 1fr; }
      .diagram { width: min(320px, 82vw); }
      .course-links { grid-template-columns: 1fr; }
      .course-link + .course-link { border-top: 1px solid var(--line); border-left: 0; }
    }

    @media (max-width: 560px) {
      .system-title { font-size: 12px; }
      main { padding-inline: 22px; }
      .registration { justify-content: flex-start; padding-inline: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="system-code">SLIDES</div>
      <div class="system-title">课程课件发布系统</div>
      <div class="system-state">Route status<br>Page not found</div>
    </header>

    <main>
      <section class="error-copy" aria-labelledby="error-title">
        <p class="eyebrow">Navigation Exception / 404</p>
        <h1 id="error-title">页面<br>未找到</h1>
        <p class="message">这个地址没有对应的课件。它可能已经移动、尚未发布，或链接中存在错误。你可以回到课程入口，或直接打开三门课程的全景页。</p>
        <div class="actions">
          <a class="action" data-route="index.html" href="/index.html"><span aria-hidden="true">←</span>返回课程入口</a>
          <button class="action secondary" id="history-back" type="button"><span aria-hidden="true">↶</span>返回上一页</button>
        </div>
      </section>

      <div class="diagram" aria-hidden="true">
        <div class="diagram-code">404</div>
        <div class="diagram-label">ROUTE / UNAVAILABLE</div>
      </div>
    </main>

    <nav class="course-links" aria-label="课程全景">
      <a class="course-link" data-route="1dbpa/dbpa-0.html" href="/1dbpa/dbpa-0.html">
        <b>DBPA</b><strong>数据库原理与应用</strong><span aria-hidden="true">→</span>
      </a>
      <a class="course-link" data-route="2cciot/cciot-0.html" href="/2cciot/cciot-0.html">
        <b>CCIOT</b><strong>云计算与物联网</strong><span aria-hidden="true">→</span>
      </a>
      <a class="course-link" data-route="3ita/ita-0.html" href="/3ita/ita-0.html">
        <b>ITA</b><strong>智能技术及应用</strong><span aria-hidden="true">→</span>
      </a>
    </nav>

    <footer class="registration">
      <a href="https://beian.mps.gov.cn/" target="_blank" rel="noopener">黑公网安备23010302001726号</a>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">黑ICP备2024033110号-1</a>
    </footer>
  </div>

  <script>
    (function () {
      var base = window.location.pathname.indexOf('/slides/') !== -1 ? '/slides/' : '/';
      document.querySelectorAll('[data-route]').forEach(function (link) {
        link.href = base + link.getAttribute('data-route');
      });
      var icon = document.querySelector('[data-root-asset]');
      if (icon) icon.href = base + icon.getAttribute('data-root-asset');
      document.getElementById('history-back').addEventListener('click', function () {
        if (window.history.length > 1) window.history.back();
        else window.location.href = base + 'index.html';
      });
    }());
  </script>
</body>
</html>
