<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf5"/>
      <stop offset="100%" stop-color="#f7f0e6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#8a5e2f"/>
    </marker>
    <style>
      .title { font: 700 42px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #4a3217; }
      .subtitle { font: 500 22px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #6f5f4a; }
      .label { font: 700 26px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #452f16; }
      .desc { font: 500 18px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #6c5d48; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="86" class="title" text-anchor="middle">宣传图片生成 Workflow</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">先定义目标和约束, 再批量生成, 最后通过筛选与修订形成定稿</text>

  <g transform="translate(80 300)">
    <rect width="240" height="250" rx="28" fill="#ffffff" stroke="#d4b489" stroke-width="4"/>
    <text x="120" y="60" class="label" text-anchor="middle">活动信息</text>
    <text x="120" y="114" class="desc" text-anchor="middle">主题</text>
    <text x="120" y="148" class="desc" text-anchor="middle">时间地点</text>
    <text x="120" y="182" class="desc" text-anchor="middle">文案要点</text>
    <text x="120" y="216" class="desc" text-anchor="middle">参考风格</text>
  </g>
  <g transform="translate(380 300)">
    <rect width="240" height="250" rx="28" fill="#ffffff" stroke="#d4b489" stroke-width="4"/>
    <text x="120" y="60" class="label" text-anchor="middle">整理约束</text>
    <text x="120" y="114" class="desc" text-anchor="middle">尺寸</text>
    <text x="120" y="148" class="desc" text-anchor="middle">色调</text>
    <text x="120" y="182" class="desc" text-anchor="middle">品牌一致性</text>
    <text x="120" y="216" class="desc" text-anchor="middle">适用场景</text>
  </g>
  <g transform="translate(680 300)">
    <rect width="240" height="250" rx="28" fill="#ffffff" stroke="#d4b489" stroke-width="4"/>
    <text x="120" y="60" class="label" text-anchor="middle">批量生成</text>
    <text x="120" y="114" class="desc" text-anchor="middle">多种风格</text>
    <text x="120" y="148" class="desc" text-anchor="middle">多种版式</text>
    <text x="120" y="182" class="desc" text-anchor="middle">多种尺寸</text>
    <text x="120" y="216" class="desc" text-anchor="middle">文案草稿</text>
  </g>
  <g transform="translate(980 300)">
    <rect width="240" height="250" rx="28" fill="#ffffff" stroke="#d4b489" stroke-width="4"/>
    <text x="120" y="60" class="label" text-anchor="middle">筛选与修订</text>
    <text x="120" y="114" class="desc" text-anchor="middle">删掉不合格结果</text>
    <text x="120" y="148" class="desc" text-anchor="middle">补字与微调</text>
    <text x="120" y="182" class="desc" text-anchor="middle">统一视觉风格</text>
    <text x="120" y="216" class="desc" text-anchor="middle">重跑变体</text>
  </g>
  <g transform="translate(1280 300)">
    <rect width="240" height="250" rx="28" fill="#ffffff" stroke="#d4b489" stroke-width="4"/>
    <text x="120" y="60" class="label" text-anchor="middle">定稿与归档</text>
    <text x="120" y="114" class="desc" text-anchor="middle">最终海报</text>
    <text x="120" y="148" class="desc" text-anchor="middle">不同尺寸版本</text>
    <text x="120" y="182" class="desc" text-anchor="middle">选用理由</text>
    <text x="120" y="216" class="desc" text-anchor="middle">可复用素材</text>
  </g>

  <line x1="320" y1="425" x2="380" y2="425" stroke="#8a5e2f" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="620" y1="425" x2="680" y2="425" stroke="#8a5e2f" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="920" y1="425" x2="980" y2="425" stroke="#8a5e2f" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="1220" y1="425" x2="1280" y2="425" stroke="#8a5e2f" stroke-width="10" marker-end="url(#arrow)"/>
</svg>
