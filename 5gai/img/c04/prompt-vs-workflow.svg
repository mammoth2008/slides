<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbfd"/>
      <stop offset="100%" stop-color="#eef3f6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#2c5c71"/>
    </marker>
    <style>
      .title { font: 700 42px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #153744; }
      .subtitle { font: 500 22px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #5a6a73; }
      .label { font: 700 28px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #163846; }
      .desc { font: 500 18px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #61717a; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="86" class="title" text-anchor="middle">从单次 Prompt 到 Workflow</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">一次表达可以得到初稿, 但稳定结果往往需要多步协作</text>

  <g transform="translate(140 240)">
    <rect width="520" height="430" rx="28" fill="#ffffff" stroke="#91bccd" stroke-width="5"/>
    <text x="260" y="70" class="label" text-anchor="middle">单次 Prompt</text>
    <rect x="60" y="140" width="160" height="84" rx="18" fill="#e6f2f8"/>
    <text x="140" y="190" class="desc" text-anchor="middle">输入需求</text>
    <line x1="230" y1="182" x2="330" y2="182" stroke="#2c5c71" stroke-width="10" marker-end="url(#arrow)"/>
    <rect x="340" y="140" width="120" height="84" rx="18" fill="#f9ebd7"/>
    <text x="400" y="190" class="desc" text-anchor="middle">输出结果</text>
    <text x="260" y="300" class="desc" text-anchor="middle">快, 但通常只有一个初稿</text>
    <text x="260" y="338" class="desc" text-anchor="middle">缺少检查点与修正回路</text>
    <text x="260" y="376" class="desc" text-anchor="middle">结果好坏高度依赖当次提问</text>
  </g>

  <g transform="translate(940 240)">
    <rect width="520" height="430" rx="28" fill="#ffffff" stroke="#91bccd" stroke-width="5"/>
    <text x="260" y="70" class="label" text-anchor="middle">Workflow</text>
    <rect x="52" y="132" width="112" height="70" rx="18" fill="#e6f2f8"/>
    <text x="108" y="174" class="desc" text-anchor="middle">目标</text>
    <rect x="206" y="132" width="112" height="70" rx="18" fill="#e8f5e8"/>
    <text x="262" y="174" class="desc" text-anchor="middle">执行</text>
    <rect x="360" y="132" width="112" height="70" rx="18" fill="#f9ebd7"/>
    <text x="416" y="174" class="desc" text-anchor="middle">检查</text>
    <line x1="164" y1="167" x2="206" y2="167" stroke="#2c5c71" stroke-width="8" marker-end="url(#arrow)"/>
    <line x1="318" y1="167" x2="360" y2="167" stroke="#2c5c71" stroke-width="8" marker-end="url(#arrow)"/>
    <path d="M416 212 C486 290, 486 360, 262 360 C110 360, 76 260, 108 202" fill="none" stroke="#2c5c71" stroke-width="8" marker-end="url(#arrow)"/>
    <text x="260" y="430" class="desc" text-anchor="middle">有步骤, 有检查点, 可反复修正</text>
    <text x="260" y="468" class="desc" text-anchor="middle">更适合复杂任务和批量任务</text>
    <text x="260" y="506" class="desc" text-anchor="middle">结果更稳定, 更容易复现</text>
  </g>
</svg>
