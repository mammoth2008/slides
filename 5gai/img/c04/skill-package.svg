<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fcf9fd"/>
      <stop offset="100%" stop-color="#f1eef8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#694b87"/>
    </marker>
    <style>
      .title { font: 700 42px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #3d2a53; }
      .subtitle { font: 500 22px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #645b71; }
      .label { font: 700 28px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #352246; }
      .desc { font: 500 18px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #69607a; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="86" class="title" text-anchor="middle">Skill 的基本组成</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">Skill 不是单个提示词, 而是说明文档, 脚本和参考材料组成的小型方法包</text>

  <g transform="translate(610 300)">
    <rect width="380" height="250" rx="30" fill="#ffffff" stroke="#c2b2da" stroke-width="5"/>
    <text x="190" y="94" class="label" text-anchor="middle">Skill Package</text>
    <text x="190" y="154" class="subtitle" text-anchor="middle">可复用的局部稳定能力</text>
  </g>

  <g transform="translate(110 340)">
    <rect width="320" height="170" rx="26" fill="#ffffff" stroke="#c2b2da" stroke-width="4"/>
    <text x="160" y="58" class="label" text-anchor="middle">SKILL.md</text>
    <text x="160" y="102" class="desc" text-anchor="middle">目标</text>
    <text x="160" y="132" class="desc" text-anchor="middle">边界 / 步骤 / 输出</text>
  </g>

  <g transform="translate(1170 190)">
    <rect width="320" height="170" rx="26" fill="#ffffff" stroke="#c2b2da" stroke-width="4"/>
    <text x="160" y="58" class="label" text-anchor="middle">scripts /</text>
    <text x="160" y="102" class="desc" text-anchor="middle">固定动作</text>
    <text x="160" y="132" class="desc" text-anchor="middle">检查与自动化</text>
  </g>

  <g transform="translate(1170 520)">
    <rect width="320" height="170" rx="26" fill="#ffffff" stroke="#c2b2da" stroke-width="4"/>
    <text x="160" y="58" class="label" text-anchor="middle">references /</text>
    <text x="160" y="102" class="desc" text-anchor="middle">模板与规范</text>
    <text x="160" y="132" class="desc" text-anchor="middle">稳定知识依据</text>
  </g>

  <line x1="430" y1="425" x2="610" y2="425" stroke="#694b87" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="1170" y1="275" x2="990" y2="380" stroke="#694b87" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="1170" y1="605" x2="990" y2="470" stroke="#694b87" stroke-width="10" marker-end="url(#arrow)"/>
</svg>
