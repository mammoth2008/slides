<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf4"/>
      <stop offset="100%" stop-color="#f5eee2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#8b5e2f"/>
    </marker>
    <style>
      .title { font: 700 42px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #4b3217; }
      .subtitle { font: 500 22px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #6d5e49; }
      .label { font: 700 26px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #452f16; }
      .desc { font: 500 18px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #6c5d48; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="86" class="title" text-anchor="middle">从 Workflow 中抽出 Skill</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">不是把整条流程做成一个大 Skill, 而是识别其中重复且稳定的环节</text>

  <g transform="translate(90 300)">
    <rect width="220" height="250" rx="28" fill="#ffffff" stroke="#d4b488" stroke-width="4"/>
    <text x="110" y="62" class="label" text-anchor="middle">活动信息</text>
    <text x="110" y="118" class="desc" text-anchor="middle">主题</text>
    <text x="110" y="152" class="desc" text-anchor="middle">时间地点</text>
    <text x="110" y="186" class="desc" text-anchor="middle">文案要点</text>
  </g>
  <g transform="translate(390 300)">
    <rect width="260" height="250" rx="28" fill="#fff7ef" stroke="#d4b488" stroke-width="4"/>
    <text x="130" y="62" class="label" text-anchor="middle">可抽出的 Skill</text>
    <text x="130" y="118" class="desc" text-anchor="middle">Brief 规范化</text>
    <text x="130" y="152" class="desc" text-anchor="middle">命名与归档</text>
    <text x="130" y="186" class="desc" text-anchor="middle">定稿检查清单</text>
  </g>
  <g transform="translate(730 300)">
    <rect width="220" height="250" rx="28" fill="#ffffff" stroke="#d4b488" stroke-width="4"/>
    <text x="110" y="62" class="label" text-anchor="middle">批量出图</text>
    <text x="110" y="118" class="desc" text-anchor="middle">多种风格</text>
    <text x="110" y="152" class="desc" text-anchor="middle">多种尺寸</text>
    <text x="110" y="186" class="desc" text-anchor="middle">文案草稿</text>
  </g>
  <g transform="translate(1030 300)">
    <rect width="220" height="250" rx="28" fill="#ffffff" stroke="#d4b488" stroke-width="4"/>
    <text x="110" y="62" class="label" text-anchor="middle">筛选与修订</text>
    <text x="110" y="118" class="desc" text-anchor="middle">删掉不合格结果</text>
    <text x="110" y="152" class="desc" text-anchor="middle">补字与微调</text>
    <text x="110" y="186" class="desc" text-anchor="middle">统一风格</text>
  </g>
  <g transform="translate(1330 300)">
    <rect width="180" height="250" rx="28" fill="#ffffff" stroke="#d4b488" stroke-width="4"/>
    <text x="90" y="62" class="label" text-anchor="middle">定稿</text>
    <text x="90" y="118" class="desc" text-anchor="middle">输出</text>
    <text x="90" y="152" class="desc" text-anchor="middle">归档</text>
    <text x="90" y="186" class="desc" text-anchor="middle">复用</text>
  </g>

  <line x1="310" y1="425" x2="390" y2="425" stroke="#8b5e2f" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="650" y1="425" x2="730" y2="425" stroke="#8b5e2f" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="950" y1="425" x2="1030" y2="425" stroke="#8b5e2f" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="1250" y1="425" x2="1330" y2="425" stroke="#8b5e2f" stroke-width="10" marker-end="url(#arrow)"/>
</svg>
