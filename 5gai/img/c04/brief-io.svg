<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8faf8"/>
      <stop offset="100%" stop-color="#eef4ef"/>
    </linearGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#3d6b56"/>
    </marker>
    <style>
      .title { font: 700 42px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #1a3c2f; }
      .subtitle { font: 500 22px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #5d6b62; }
      .label { font: 700 28px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #173327; }
      .desc { font: 500 18px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #617067; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="86" class="title" text-anchor="middle">宣传图片 Brief 规范化 Skill</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">它的作用不是直接出图, 而是把输入整理成后续流程可稳定复用的 Brief</text>

  <g transform="translate(120 240)">
    <rect width="420" height="420" rx="32" fill="#ffffff" stroke="#9cc4af" stroke-width="5"/>
    <text x="210" y="74" class="label" text-anchor="middle">输入</text>
    <text x="210" y="150" class="desc" text-anchor="middle">主题</text>
    <text x="210" y="198" class="desc" text-anchor="middle">时间地点</text>
    <text x="210" y="246" class="desc" text-anchor="middle">文案要点</text>
    <text x="210" y="294" class="desc" text-anchor="middle">参考风格</text>
    <text x="210" y="342" class="desc" text-anchor="middle">使用场景</text>
  </g>

  <g transform="translate(610 300)">
    <rect width="380" height="300" rx="32" fill="#ffffff" stroke="#9cc4af" stroke-width="5"/>
    <text x="190" y="82" class="label" text-anchor="middle">Brief 规范化 Skill</text>
    <text x="190" y="148" class="desc" text-anchor="middle">检查完整性</text>
    <text x="190" y="192" class="desc" text-anchor="middle">映射到结构化字段</text>
    <text x="190" y="236" class="desc" text-anchor="middle">输出统一格式</text>
  </g>

  <g transform="translate(1060 240)">
    <rect width="420" height="420" rx="32" fill="#ffffff" stroke="#9cc4af" stroke-width="5"/>
    <text x="210" y="74" class="label" text-anchor="middle">输出 Brief</text>
    <text x="210" y="150" class="desc" text-anchor="middle">title / subtitle</text>
    <text x="210" y="198" class="desc" text-anchor="middle">style / palette</text>
    <text x="210" y="246" class="desc" text-anchor="middle">size / scene</text>
    <text x="210" y="294" class="desc" text-anchor="middle">must_include</text>
    <text x="210" y="342" class="desc" text-anchor="middle">must_avoid</text>
  </g>

  <line x1="540" y1="450" x2="610" y2="450" stroke="#3d6b56" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="990" y1="450" x2="1060" y2="450" stroke="#3d6b56" stroke-width="10" marker-end="url(#arrow)"/>
</svg>
