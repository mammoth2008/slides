<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8faf8"/>
      <stop offset="100%" stop-color="#edf4ef"/>
    </linearGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#3d6a55"/>
    </marker>
    <style>
      .title { font: 700 42px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #1a3b2f; }
      .subtitle { font: 500 22px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #5c6a61; }
      .label { font: 700 28px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #173327; }
      .desc { font: 500 18px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #606f66; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="86" class="title" text-anchor="middle">Workflow 的基本闭环</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">把复杂任务拆成步骤, 再用检查点和反馈回路保证结果可用</text>

  <g transform="translate(650 310)">
    <circle cx="150" cy="150" r="128" fill="#ffffff" stroke="#9bc4ae" stroke-width="6"/>
    <text x="150" y="146" class="label" text-anchor="middle">Workflow</text>
    <text x="150" y="184" class="subtitle" text-anchor="middle">不是直线, 而是闭环</text>
  </g>

  <g transform="translate(200 190)">
    <rect width="250" height="96" rx="22" fill="#dbeee5" stroke="#7db298" stroke-width="4"/>
    <text x="125" y="58" class="label" text-anchor="middle">明确目标</text>
  </g>
  <g transform="translate(1148 190)">
    <rect width="250" height="96" rx="22" fill="#dcecf3" stroke="#80b5c5" stroke-width="4"/>
    <text x="125" y="58" class="label" text-anchor="middle">执行任务</text>
  </g>
  <g transform="translate(1148 620)">
    <rect width="250" height="96" rx="22" fill="#fbe8d2" stroke="#d4a46d" stroke-width="4"/>
    <text x="125" y="58" class="label" text-anchor="middle">检查结果</text>
  </g>
  <g transform="translate(200 620)">
    <rect width="250" height="96" rx="22" fill="#f3dfeb" stroke="#c28faf" stroke-width="4"/>
    <text x="125" y="58" class="label" text-anchor="middle">修正与重跑</text>
  </g>

  <path d="M450 238 C620 126, 980 126, 1148 238" fill="none" stroke="#3d6a55" stroke-width="10" marker-end="url(#arrow)"/>
  <path d="M1272 286 C1420 396, 1420 508, 1272 620" fill="none" stroke="#3d6a55" stroke-width="10" marker-end="url(#arrow)"/>
  <path d="M1148 668 C980 780, 620 780, 450 668" fill="none" stroke="#3d6a55" stroke-width="10" marker-end="url(#arrow)"/>
  <path d="M326 620 C178 508, 178 396, 326 286" fill="none" stroke="#3d6a55" stroke-width="10" marker-end="url(#arrow)"/>
</svg>
