<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fcf9fd"/>
      <stop offset="100%" stop-color="#f0eef7"/>
    </linearGradient>
    <style>
      .title { font: 700 42px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #3c2a4f; }
      .subtitle { font: 500 22px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #645b70; }
      .label { font: 700 30px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #342245; }
      .desc { font: 500 18px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #6a6178; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="86" class="title" text-anchor="middle">人在 Workflow 中的位置</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">AI 擅长批量生成与变体扩展, 人负责目标定义, 质量判断和最终责任</text>

  <g transform="translate(140 220)">
    <rect width="540" height="470" rx="32" fill="#ffffff" stroke="#c2b1da" stroke-width="5"/>
    <text x="270" y="72" class="label" text-anchor="middle">AI 更适合</text>
    <text x="270" y="156" class="desc" text-anchor="middle">批量生成图片草稿</text>
    <text x="270" y="216" class="desc" text-anchor="middle">尝试多种风格与版式</text>
    <text x="270" y="276" class="desc" text-anchor="middle">扩展不同尺寸和不同版本</text>
    <text x="270" y="336" class="desc" text-anchor="middle">起草配套文案</text>
    <text x="270" y="396" class="desc" text-anchor="middle">整理中间结果与候选集</text>
  </g>

  <g transform="translate(920 220)">
    <rect width="540" height="470" rx="32" fill="#ffffff" stroke="#c2b1da" stroke-width="5"/>
    <text x="270" y="72" class="label" text-anchor="middle">人必须负责</text>
    <text x="270" y="156" class="desc" text-anchor="middle">定义目标与使用场景</text>
    <text x="270" y="216" class="desc" text-anchor="middle">判断风格是否合适</text>
    <text x="270" y="276" class="desc" text-anchor="middle">确认图片与文案是否匹配</text>
    <text x="270" y="336" class="desc" text-anchor="middle">识别版权, 误导和审美风险</text>
    <text x="270" y="396" class="desc" text-anchor="middle">决定最终采用哪一版结果</text>
  </g>
</svg>
