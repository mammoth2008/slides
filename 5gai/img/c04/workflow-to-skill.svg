<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbfd"/>
      <stop offset="100%" stop-color="#eef3f6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#2d6075"/>
    </marker>
    <style>
      .title { font: 700 42px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #143746; }
      .subtitle { font: 500 22px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #5a6b73; }
      .label { font: 700 28px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #173847; }
      .desc { font: 500 18px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #61727a; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="86" class="title" text-anchor="middle">为什么 Workflow 之后还需要 Skill</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">Workflow 管整条流程, Skill 管反复出现的局部稳定环节</text>

  <g transform="translate(140 230)">
    <rect width="560" height="420" rx="32" fill="#ffffff" stroke="#95bfd0" stroke-width="5"/>
    <text x="280" y="74" class="label" text-anchor="middle">Workflow</text>
    <rect x="70" y="150" width="120" height="70" rx="16" fill="#e7f2f8"/>
    <text x="130" y="192" class="desc" text-anchor="middle">目标</text>
    <rect x="220" y="150" width="120" height="70" rx="16" fill="#e8f5e8"/>
    <text x="280" y="192" class="desc" text-anchor="middle">执行</text>
    <rect x="370" y="150" width="120" height="70" rx="16" fill="#f9ebd7"/>
    <text x="430" y="192" class="desc" text-anchor="middle">检查</text>
    <line x1="190" y1="185" x2="220" y2="185" stroke="#2d6075" stroke-width="8" marker-end="url(#arrow)"/>
    <line x1="340" y1="185" x2="370" y2="185" stroke="#2d6075" stroke-width="8" marker-end="url(#arrow)"/>
    <text x="280" y="300" class="desc" text-anchor="middle">组织完整任务</text>
    <text x="280" y="338" class="desc" text-anchor="middle">决定步骤顺序和检查点</text>
    <text x="280" y="376" class="desc" text-anchor="middle">让流程可以重复执行</text>
  </g>

  <g transform="translate(900 230)">
    <rect width="560" height="420" rx="32" fill="#ffffff" stroke="#95bfd0" stroke-width="5"/>
    <text x="280" y="74" class="label" text-anchor="middle">Skill</text>
    <rect x="190" y="150" width="180" height="80" rx="18" fill="#f3eef9"/>
    <text x="280" y="198" class="desc" text-anchor="middle">局部稳定环节</text>
    <text x="280" y="300" class="desc" text-anchor="middle">沉淀可复用经验</text>
    <text x="280" y="338" class="desc" text-anchor="middle">减少每次重新描述</text>
    <text x="280" y="376" class="desc" text-anchor="middle">提高一致性和协作效率</text>
  </g>

  <line x1="700" y1="440" x2="900" y2="440" stroke="#2d6075" stroke-width="10" marker-end="url(#arrow)"/>
</svg>
