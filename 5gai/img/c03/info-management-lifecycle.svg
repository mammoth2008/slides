<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f8fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#2c5f73"/>
    </marker>
    <style>
      .title { font: 700 44px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #163744; }
      .subtitle { font: 500 24px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #48616a; }
      .label { font: 700 30px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #173642; }
      .desc { font: 500 20px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #4c646c; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="92" class="title" text-anchor="middle">信息管理的基本链条</text>
  <text x="800" y="132" class="subtitle" text-anchor="middle">AI 影响的不只是写作和编程, 而是整个信息流转过程</text>

  <line x1="245" y1="420" x2="425" y2="420" stroke="#2c5f73" stroke-width="12" marker-end="url(#arrow)"/>
  <line x1="525" y1="420" x2="705" y2="420" stroke="#2c5f73" stroke-width="12" marker-end="url(#arrow)"/>
  <line x1="805" y1="420" x2="985" y2="420" stroke="#2c5f73" stroke-width="12" marker-end="url(#arrow)"/>
  <line x1="1085" y1="420" x2="1265" y2="420" stroke="#2c5f73" stroke-width="12" marker-end="url(#arrow)"/>

  <g transform="translate(80 300)">
    <rect width="180" height="240" rx="28" fill="url(#card)" stroke="#7ab6c5" stroke-width="4"/>
    <circle cx="90" cy="72" r="34" fill="#d6edf4"/>
    <text x="90" y="80" class="label" text-anchor="middle">取</text>
    <text x="90" y="142" class="label" text-anchor="middle">获取</text>
    <text x="90" y="184" class="desc" text-anchor="middle">搜索</text>
    <text x="90" y="214" class="desc" text-anchor="middle">采集</text>
    <text x="90" y="244" class="desc" text-anchor="middle">汇总</text>
  </g>

  <g transform="translate(360 300)">
    <rect width="180" height="240" rx="28" fill="url(#card)" stroke="#7ab6c5" stroke-width="4"/>
    <circle cx="90" cy="72" r="34" fill="#dff2e5"/>
    <text x="90" y="80" class="label" text-anchor="middle">判</text>
    <text x="90" y="142" class="label" text-anchor="middle">识别</text>
    <text x="90" y="184" class="desc" text-anchor="middle">筛选</text>
    <text x="90" y="214" class="desc" text-anchor="middle">分类</text>
    <text x="90" y="244" class="desc" text-anchor="middle">估值</text>
  </g>

  <g transform="translate(640 300)">
    <rect width="180" height="240" rx="28" fill="url(#card)" stroke="#7ab6c5" stroke-width="4"/>
    <circle cx="90" cy="72" r="34" fill="#fbe8d2"/>
    <text x="90" y="80" class="label" text-anchor="middle">构</text>
    <text x="90" y="142" class="label" text-anchor="middle">整理</text>
    <text x="90" y="184" class="desc" text-anchor="middle">清洗</text>
    <text x="90" y="214" class="desc" text-anchor="middle">结构化</text>
    <text x="90" y="244" class="desc" text-anchor="middle">关联</text>
  </g>

  <g transform="translate(920 300)">
    <rect width="180" height="240" rx="28" fill="url(#card)" stroke="#7ab6c5" stroke-width="4"/>
    <circle cx="90" cy="72" r="34" fill="#f4dfe8"/>
    <text x="90" y="80" class="label" text-anchor="middle">用</text>
    <text x="90" y="142" class="label" text-anchor="middle">使用</text>
    <text x="90" y="184" class="desc" text-anchor="middle">报告</text>
    <text x="90" y="214" class="desc" text-anchor="middle">页面</text>
    <text x="90" y="244" class="desc" text-anchor="middle">决策</text>
  </g>

  <g transform="translate(1200 300)">
    <rect width="180" height="240" rx="28" fill="url(#card)" stroke="#7ab6c5" stroke-width="4"/>
    <circle cx="90" cy="72" r="34" fill="#e6e7fb"/>
    <text x="90" y="80" class="label" text-anchor="middle">弃</text>
    <text x="90" y="142" class="label" text-anchor="middle">抛弃</text>
    <text x="90" y="184" class="desc" text-anchor="middle">去重</text>
    <text x="90" y="214" class="desc" text-anchor="middle">淘汰</text>
    <text x="90" y="244" class="desc" text-anchor="middle">归档</text>
  </g>

  <text x="800" y="760" class="subtitle" text-anchor="middle">判断力决定信息是否真正有价值, AI 只是在不同环节放大速度和规模</text>
</svg>
