<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#faf8fc"/>
      <stop offset="100%" stop-color="#f1eef8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#6a4a86"/>
    </marker>
    <style>
      .title { font: 700 44px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #3e2a53; }
      .subtitle { font: 500 24px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #5f5370; }
      .label { font: 700 30px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #352247; }
      .desc { font: 500 18px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #6a6178; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="86" class="title" text-anchor="middle">Skill 的基本组成</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">稳定能力不是一句更长的 Prompt, 而是文档, 脚本和参考材料的组合</text>

  <g transform="translate(610 300)">
    <rect width="380" height="240" rx="28" fill="#ffffff" stroke="#a891c6" stroke-width="5"/>
    <text x="190" y="92" class="label" text-anchor="middle">Skill</text>
    <text x="190" y="148" class="subtitle" text-anchor="middle">把一次成功变成</text>
    <text x="190" y="184" class="subtitle" text-anchor="middle">可复用的稳定能力</text>
  </g>

  <g transform="translate(130 330)">
    <rect width="300" height="180" rx="26" fill="#ffffff" stroke="#c3b3db" stroke-width="4"/>
    <text x="150" y="58" class="label" text-anchor="middle">SKILL.md</text>
    <text x="150" y="100" class="desc" text-anchor="middle">目标</text>
    <text x="150" y="130" class="desc" text-anchor="middle">边界</text>
    <text x="150" y="160" class="desc" text-anchor="middle">步骤与输出要求</text>
  </g>

  <g transform="translate(1170 180)">
    <rect width="300" height="180" rx="26" fill="#ffffff" stroke="#c3b3db" stroke-width="4"/>
    <text x="150" y="58" class="label" text-anchor="middle">scripts /</text>
    <text x="150" y="100" class="desc" text-anchor="middle">可重复动作</text>
    <text x="150" y="130" class="desc" text-anchor="middle">命令与检查</text>
    <text x="150" y="160" class="desc" text-anchor="middle">固定流程自动化</text>
  </g>

  <g transform="translate(1170 480)">
    <rect width="300" height="180" rx="26" fill="#ffffff" stroke="#c3b3db" stroke-width="4"/>
    <text x="150" y="58" class="label" text-anchor="middle">references /</text>
    <text x="150" y="100" class="desc" text-anchor="middle">术语</text>
    <text x="150" y="130" class="desc" text-anchor="middle">模板与规范</text>
    <text x="150" y="160" class="desc" text-anchor="middle">稳定知识依据</text>
  </g>

  <line x1="430" y1="420" x2="610" y2="420" stroke="#6a4a86" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="1170" y1="270" x2="990" y2="370" stroke="#6a4a86" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="1170" y1="570" x2="990" y2="470" stroke="#6a4a86" stroke-width="10" marker-end="url(#arrow)"/>

  <text x="800" y="790" class="subtitle" text-anchor="middle">Agent 组织任务, Skill 提供局部稳定能力, Workflow 再把多个能力串起来</text>
</svg>
