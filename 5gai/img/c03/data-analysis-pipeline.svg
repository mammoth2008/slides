<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fefcf7"/>
      <stop offset="100%" stop-color="#f7f2e7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#7d5d2a"/>
    </marker>
    <style>
      .title { font: 700 44px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #4a3417; }
      .subtitle { font: 500 24px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #6d5c44; }
      .label { font: 700 28px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #463116; }
      .desc { font: 500 18px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #6a5941; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="86" class="title" text-anchor="middle">从数据获取到分析摘要</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">Agent 擅长推动流程, 但结论是否可用仍需要人工判断</text>

  <g transform="translate(80 250)">
    <rect width="220" height="320" rx="28" fill="#ffffff" stroke="#d3b788" stroke-width="4"/>
    <text x="110" y="64" class="label" text-anchor="middle">数据来源</text>
    <rect x="35" y="95" width="150" height="42" rx="16" fill="#e9f0f7"/>
    <text x="110" y="123" class="desc" text-anchor="middle">网页</text>
    <rect x="35" y="150" width="150" height="42" rx="16" fill="#e6f5e9"/>
    <text x="110" y="178" class="desc" text-anchor="middle">CSV</text>
    <rect x="35" y="205" width="150" height="42" rx="16" fill="#fcecd7"/>
    <text x="110" y="233" class="desc" text-anchor="middle">Excel</text>
    <rect x="35" y="260" width="150" height="42" rx="16" fill="#f2e5f2"/>
    <text x="110" y="288" class="desc" text-anchor="middle">文本材料</text>
  </g>

  <g transform="translate(380 250)">
    <rect width="220" height="320" rx="28" fill="#ffffff" stroke="#d3b788" stroke-width="4"/>
    <text x="110" y="72" class="label" text-anchor="middle">采集与清洗</text>
    <text x="110" y="138" class="desc" text-anchor="middle">统一格式</text>
    <text x="110" y="178" class="desc" text-anchor="middle">去重</text>
    <text x="110" y="218" class="desc" text-anchor="middle">缺失值检查</text>
    <text x="110" y="258" class="desc" text-anchor="middle">字段映射</text>
  </g>

  <g transform="translate(680 250)">
    <rect width="220" height="320" rx="28" fill="#ffffff" stroke="#d3b788" stroke-width="4"/>
    <text x="110" y="72" class="label" text-anchor="middle">汇总与分析</text>
    <text x="110" y="138" class="desc" text-anchor="middle">分组统计</text>
    <text x="110" y="178" class="desc" text-anchor="middle">指标计算</text>
    <text x="110" y="218" class="desc" text-anchor="middle">趋势识别</text>
    <text x="110" y="258" class="desc" text-anchor="middle">异常提示</text>
  </g>

  <g transform="translate(980 250)">
    <rect width="220" height="320" rx="28" fill="#ffffff" stroke="#d3b788" stroke-width="4"/>
    <text x="110" y="72" class="label" text-anchor="middle">结果产出</text>
    <text x="110" y="138" class="desc" text-anchor="middle">清洗后数据表</text>
    <text x="110" y="178" class="desc" text-anchor="middle">图表摘要</text>
    <text x="110" y="218" class="desc" text-anchor="middle">结论草稿</text>
    <text x="110" y="258" class="desc" text-anchor="middle">可复核中间结果</text>
  </g>

  <g transform="translate(1280 250)">
    <rect width="240" height="320" rx="28" fill="#fff7ef" stroke="#d3b788" stroke-width="4"/>
    <text x="120" y="72" class="label" text-anchor="middle">人工判断点</text>
    <text x="120" y="138" class="desc" text-anchor="middle">来源可信度</text>
    <text x="120" y="178" class="desc" text-anchor="middle">字段语义</text>
    <text x="120" y="218" class="desc" text-anchor="middle">异常值处理</text>
    <text x="120" y="258" class="desc" text-anchor="middle">结论能否支持决策</text>
  </g>

  <line x1="300" y1="410" x2="380" y2="410" stroke="#7d5d2a" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="600" y1="410" x2="680" y2="410" stroke="#7d5d2a" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="900" y1="410" x2="980" y2="410" stroke="#7d5d2a" stroke-width="10" marker-end="url(#arrow)"/>
  <line x1="1200" y1="410" x2="1280" y2="410" stroke="#7d5d2a" stroke-width="10" marker-end="url(#arrow)"/>
</svg>
