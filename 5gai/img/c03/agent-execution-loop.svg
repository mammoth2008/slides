<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8faf8"/>
      <stop offset="100%" stop-color="#eef4ef"/>
    </linearGradient>
    <marker id="arrow" markerWidth="4" markerHeight="4" refX="3.5" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#375f4f"/>
    </marker>
    <style>
      .title { font: 700 44px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #1d3c31; }
      .subtitle { font: 500 24px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #4e6458; }
      .label { font: 700 28px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #173126; }
      .desc { font: 500 18px 'PingFang SC', 'Noto Sans CJK SC', sans-serif; fill: #587064; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="86" class="title" text-anchor="middle">Agent 的执行闭环</text>
  <text x="800" y="126" class="subtitle" text-anchor="middle">不是一次回答, 而是围绕目标不断读取, 执行, 验证和修正</text>

  <g transform="translate(670 315)">
    <circle cx="130" cy="130" r="124" fill="#ffffff" stroke="#95c1ac" stroke-width="6"/>
    <text x="130" y="120" class="label" text-anchor="middle">目标</text>
    <text x="130" y="160" class="label" text-anchor="middle">与约束</text>
  </g>

  <g transform="translate(200 180)">
    <rect width="260" height="110" rx="24" fill="#dbeee5" stroke="#7fb59a" stroke-width="4"/>
    <text x="130" y="50" class="label" text-anchor="middle">拆解步骤</text>
    <text x="130" y="82" class="desc" text-anchor="middle">先做什么, 后做什么</text>
  </g>

  <g transform="translate(1140 180)">
    <rect width="260" height="110" rx="24" fill="#dcecf3" stroke="#82b5c7" stroke-width="4"/>
    <text x="130" y="50" class="label" text-anchor="middle">读取上下文</text>
    <text x="130" y="82" class="desc" text-anchor="middle">代码, 文档, 日志, 文件</text>
  </g>

  <g transform="translate(1140 600)">
    <rect width="260" height="110" rx="24" fill="#fbe8d2" stroke="#d1a56a" stroke-width="4"/>
    <text x="130" y="50" class="label" text-anchor="middle">执行修改</text>
    <text x="130" y="82" class="desc" text-anchor="middle">写文件, 跑命令, 生成结果</text>
  </g>

  <g transform="translate(200 600)">
    <rect width="260" height="110" rx="24" fill="#f3dfeb" stroke="#c48dad" stroke-width="4"/>
    <text x="130" y="50" class="label" text-anchor="middle">验证结果</text>
    <text x="130" y="82" class="desc" text-anchor="middle">检查是否真的完成</text>
  </g>

  <path d="M460 235 C620 130, 980 130, 1140 235" fill="none" stroke="#375f4f" stroke-width="10" marker-end="url(#arrow)"/>
  <path d="M1270 290 C1410 400, 1410 500, 1270 600" fill="none" stroke="#375f4f" stroke-width="10" marker-end="url(#arrow)"/>
  <path d="M1140 655 C980 770, 620 770, 460 655" fill="none" stroke="#375f4f" stroke-width="10" marker-end="url(#arrow)"/>
  <path d="M330 600 C190 500, 190 400, 330 290" fill="none" stroke="#375f4f" stroke-width="10" marker-end="url(#arrow)"/>

  <text x="800" y="810" class="subtitle" text-anchor="middle">一旦验证失败, Agent 就会回到读取上下文和修正步骤, 重新组织执行</text>
</svg>
