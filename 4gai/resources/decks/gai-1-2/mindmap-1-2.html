<!doctype html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }

</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"把业务请求改成可检查的问题","children":[{"content":"目标与条件","children":[{"content":"服务对象、输入、产物、用途","children":[]},{"content":"当前起草范围与后续动作条件","children":[]},{"content":"事实可追溯、交接有边界","children":[]}]},{"content":"澄清与交接","children":[{"content":"已有答案先定位","children":[]},{"content":"关键缺口改变下一步","children":[]},{"content":"资料核查、动作权限与责任角色","children":[]}]},{"content":"比较与复查","children":[{"content":"同证据、同约束下的可行方案","children":[]},{"content":"服务要求、资料可得性与负责人选择","children":[]},{"content":"新记录的支持范围与改判条件","children":[]}]}]};

    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
