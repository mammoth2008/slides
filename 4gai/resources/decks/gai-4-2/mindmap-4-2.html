<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生成设置与可追溯样张 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"生成设置与可追溯样张","children":[{"content":"判断采用用途","children":[{"content":"简报要求转为样张检查","children":[]},{"content":"初判、用途与有限决定","children":[]}]},{"content":"读取可见设置","children":[{"content":"文生图以文本为条件","children":[]},{"content":"原图作为编辑目标","children":[]},{"content":"种子、随机状态与环境","children":[]},{"content":"未暴露字段保持未知","children":[]}]},{"content":"对照样张与记录","children":[{"content":"完整原图与编辑图","children":[]},{"content":"所见、未查与输出身份","children":[]},{"content":"单对样张限制结论","children":[]}]},{"content":"设计可执行比较","children":[{"content":"一个因素的两种条件","children":[]},{"content":"固定项与观察规则","children":[]},{"content":"不可控条件与未运行","children":[]}]},{"content":"提交与修订","children":[{"content":"三动作与四部分","children":[]},{"content":"四项各一分与缺交分开","children":[]},{"content":"新用途下修订或保留","children":[]}]}]};
