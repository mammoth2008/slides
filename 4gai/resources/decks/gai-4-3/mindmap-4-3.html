<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参考与局部修改的保留约束 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"参考与局部修改的保留约束","children":[{"content":"从请求确定范围","children":[{"content":"参考用途与待修改原件","children":[]},{"content":"目标日期与非目标保留","children":[]},{"content":"固定文件与版本","children":[]}]},{"content":"解释修改机制","children":[{"content":"SVG 文字修改","children":[]},{"content":"局部重绘、蒙版与去噪强度为背景","children":[]},{"content":"意图、输出与证据边界","children":[]}]},{"content":"完成并核查副本","children":[{"content":"原件、复制、替换、保存","children":[]},{"content":"SHA 与完整差异","children":[]},{"content":"目标与文字颜色画幅书杯","children":[]},{"content":"源码采用和视觉待看","children":[]}]},{"content":"比较失败与取舍","children":[{"content":"局部成功与额外变化","children":[]},{"content":"退回修订或暂停补查","children":[]}]},{"content":"独立完成与反馈","children":[{"content":"三动作、四部分与实际产物","children":[]},{"content":"四项 0 或 1 形成性自查","children":[]}]},{"content":"在新条件下重判","children":[{"content":"新日期条件下修订或保留","children":[]},{"content":"对应请求版本和未测范围","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
