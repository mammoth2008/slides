<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026 年中国研究生企业管理创新大赛数字技术应用专项培训入口。">
  <title>数字技术应用专项培训</title>
  <link id="course-fonts" rel="stylesheet" href="resources/theme/fonts.css">
  <style>
    :root {
      color-scheme: light;
      --paper: #fffefa;
      --paper-muted: #f1f0eb;
      --ink: #1b1b1b;
      --ink-soft: #41413e;
      --proof: #ad241b;
      --line: #787873;
      --line-soft: #b4b4ad;
      --serif: "Course Source Han Serif", "Source Han Serif CN", "Source Han Serif SC", "Songti SC", STSong, SimSun, serif;
      --sans: "Course Source Han Sans", "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "Course Inconsolata", "Inconsolata", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: #dededb;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .page {
      width: min(1320px, calc(100% - 56px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 26px 0 28px;
    }

    .course-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 22px;
      align-items: baseline;
      min-height: 52px;
      padding: 0 2px 14px;
      border-bottom: 3px solid var(--ink);
    }

    .course-code,
    .course-status,
    .hero-kicker,
    .catalog-count,
    .training-no,
    .training-date,
    footer {
      font-family: var(--mono);
      font-weight: 700;
      letter-spacing: .055em;
    }

    .course-code {
      color: var(--proof);
      font-size: 21px;
    }

    .course-name {
      font: 700 25px/1.2 var(--serif);
    }

    .course-status {
      color: var(--ink-soft);
      font-size: 14px;
    }

    main {
      display: grid;
      gap: 28px;
      padding-top: 24px;
    }

    .hero {
      position: relative;
      min-height: clamp(430px, 56vw, 620px);
      overflow: hidden;
      border-bottom: 3px solid var(--ink);
      background: var(--paper);
      isolation: isolate;
    }

    .hero-art {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .hero::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(90deg, rgba(255, 254, 250, .98) 0%, rgba(255, 254, 250, .91) 42%, rgba(255, 254, 250, .08) 70%);
      content: "";
      pointer-events: none;
    }

    .hero-copy {
      display: grid;
      align-content: start;
      width: 70%;
      min-height: inherit;
      padding: clamp(46px, 7vw, 82px) 0 46px 4px;
    }

    .hero-kicker {
      margin: 0 0 22px;
      color: var(--ink-soft);
      font-size: 15px;
      text-transform: uppercase;
    }

    .hero-kicker::before {
      display: inline-block;
      width: 42px;
      height: 4px;
      margin: 0 12px 3px 0;
      background: var(--proof);
      content: "";
    }

    h1 {
      margin: 0;
      font: 750 clamp(48px, 6.4vw, 82px)/1.08 var(--serif);
      letter-spacing: -.045em;
    }

    .hero-summary {
      max-width: 560px;
      margin: 30px 0 0;
      padding-top: 20px;
      border-top: 2px solid var(--ink);
      color: var(--ink-soft);
      font-size: clamp(18px, 2vw, 22px);
      font-weight: 600;
      line-height: 1.65;
    }

    .catalog {
      display: grid;
      gap: 14px;
    }

    .catalog-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
    }

    .catalog-heading h2 {
      margin: 0;
      color: var(--proof);
      font: 700 27px/1.2 var(--serif);
    }

    .catalog-count {
      color: var(--ink-soft);
      font-size: 13px;
    }

    .training-link {
      display: grid;
      grid-template-columns: 94px 154px minmax(260px, .95fr) minmax(360px, 1.35fr) 48px;
      align-items: center;
      min-height: 126px;
      border-top: 2px solid var(--line);
      border-bottom: 2px solid var(--line);
      text-decoration: none;
      transition: background-color 140ms ease;
    }

    .training-link:hover,
    .training-link:focus-visible {
      background: var(--paper-muted);
    }

    .training-link:focus-visible {
      outline: 3px solid var(--proof);
      outline-offset: 4px;
    }

    .training-link > * {
      min-width: 0;
      padding: 16px 20px;
    }

    .training-link > * + * {
      border-left: 2px solid var(--line-soft);
    }

    .training-no {
      color: var(--proof);
      font-size: 40px;
      line-height: 1;
      letter-spacing: -.045em;
    }

    .training-date {
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.55;
    }

    .training-title {
      margin: 0;
      font: 700 clamp(25px, 2.5vw, 34px)/1.18 var(--serif);
      letter-spacing: -.02em;
    }

    .training-summary {
      margin: 0;
      color: var(--ink-soft);
      font-size: 16px;
      font-weight: 580;
      line-height: 1.6;
    }

    .training-arrow {
      display: grid;
      place-items: center;
      align-self: stretch;
      padding: 0;
      color: var(--ink);
      font-size: 30px;
      font-weight: 700;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 30px;
      padding-top: 13px;
      border-top: 1px solid var(--line-soft);
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 980px) {
      .training-link {
        grid-template-columns: 78px 130px minmax(220px, 1fr) 48px;
      }

      .training-summary {
        grid-column: 1 / -1;
        padding: 18px 20px;
        border-top: 2px solid var(--line-soft);
        border-left: 0;
      }

      .training-arrow { grid-column: 4; grid-row: 1; }
    }

    @media (max-width: 680px) {
      .page { width: min(100% - 24px, 1320px); padding-top: 16px; }

      .course-header {
        grid-template-columns: auto 1fr;
        gap: 8px 14px;
      }

      .course-status { grid-column: 1 / -1; }

      main { padding-top: 14px; }

      .hero { min-height: 530px; }

      .hero::after {
        background: linear-gradient(180deg, rgba(255, 254, 250, .98) 0%, rgba(255, 254, 250, .92) 58%, rgba(255, 254, 250, .18) 100%);
      }

      .hero-copy {
        width: 100%;
        padding: 44px 8px 38px;
      }

      .catalog-heading { align-items: flex-end; }

      .training-link {
        grid-template-columns: 76px 1fr 44px;
      }

      .training-date {
        grid-column: 2;
        grid-row: 1;
      }

      .training-title {
        grid-column: 1 / -1;
        padding-top: 20px;
        border-top: 2px solid var(--line-soft);
        border-left: 0;
      }

      .training-summary {
        grid-column: 1 / -1;
      }

      .training-arrow {
        grid-column: 3;
        grid-row: 1;
      }

      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      .training-link { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="course-header">
      <span class="course-code">DTA 2026</span>
      <span class="course-name">数字技术应用专项培训</span>
      <span class="course-status">当前 1 个课件</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="course-title">
        <img
          class="hero-art"
          src="resources/decks/dta-2026-1/assets/cover-selection-paths.png"
          data-local-src="../decks/training-1/assets/cover-selection-paths.png"
          alt="五条起始路径经过比较形成两个候选方向，并最终汇聚为一条通向山顶的路径"
        >
        <div class="hero-copy">
          <p class="hero-kicker">中国研究生企业管理创新大赛</p>
          <h1 id="course-title">数字技术应用专项培训</h1>
          <p class="hero-summary">完成选题、作品设计和赛前修改，直至形成完整方案</p>
        </div>
      </section>

      <section class="catalog" aria-labelledby="catalog-title">
        <div class="catalog-heading">
          <h2 id="catalog-title">目录</h2>
          <span class="catalog-count">DTA / 2026</span>
        </div>

        <a class="training-link" href="dta-2026-1.html" data-local-href="../../../_build/slides/competition-dta-training-1/dta-2026-1.html">
          <span class="training-no">01</span>
          <span class="training-date">2026.09.15<br>第一次培训</span>
          <h3 class="training-title">流程与选题方向</h3>
          <p class="training-summary">比较各命题的机会与约束，选择题目，列出待核实问题</p>
          <span class="training-arrow" aria-hidden="true">→</span>
        </a>
      </section>
    </main>

    <footer>
      <span>CHINESE GRADUATE BUSINESS ADMINISTRATION INNOVATION COMPETITION</span>
      <span>DTA · 2026</span>
    </footer>
  </div>

  <script>
    if (window.location.protocol === "file:" && window.location.pathname.includes("/courses/competition-dta/overview/")) {
      document.querySelector("#course-fonts").href = "../../../_build/slides/competition-dta-training-1/theme/fonts.css";
      document.querySelectorAll("[data-local-src]").forEach((image) => {
        image.src = image.dataset.localSrc;
      });
      document.querySelectorAll("[data-local-href]").forEach((link) => {
        link.href = link.dataset.localHref;
      });
    }
  </script>
</body>
</html>
