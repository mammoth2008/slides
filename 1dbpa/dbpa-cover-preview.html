<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DBPA Cover Preview</title>

    <link href="../css/impress-course.css" rel="stylesheet" />
    <link href="../css/impress-common.css" rel="stylesheet" />

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 0;
            margin: 0;
            overflow: hidden;
            background: #0b1720;
        }

        body {
            display: grid;
            place-items: center;
        }

        .cover-frame {
            position: relative;
            width: min(100vw, 133.333vh);
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background-image: url("img/c00/dbpa-cover-bg-2608-final.png");
            background-size: cover;
            background-position: center;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        }

        .title-zone {
            position: absolute;
            inset: 19.5% 7% auto 7%;
            height: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #003152;
            font-family: "Source Han Serif CN", "Songti SC", STSong, SimSun, "宋体", serif;
            text-shadow: 0 2px 6px rgba(255, 255, 255, 0.42);
        }

        .eyebrow {
            margin: 0 0 4.8%;
            font-size: min(2.85vw, 3.8vh);
            line-height: 1.2;
            font-weight: 700;
        }

        .course-title {
            margin: 0;
            font-size: min(8.9vw, 11.85vh);
            line-height: 1.06;
            font-weight: 800;
            white-space: nowrap;
        }

        .subtitle {
            margin: 4.6% 0 0;
            font-size: min(3.35vw, 4.45vh);
            line-height: 1.15;
            font-family: Georgia, "Times New Roman", "New York", serif;
            font-weight: 700;
            white-space: nowrap;
        }

        .footnote {
            position: absolute;
            left: 50%;
            bottom: 8.4%;
            transform: translateX(-50%);
            width: 32%;
            min-width: 260px;
            margin: 0;
            color: #003152;
            text-align: center;
            padding: 0.35% 1.15% 0.45%;
            border-radius: 999px;
            background: rgba(255, 248, 231, 0.42);
            backdrop-filter: blur(1.5px);
        }

        .footnote inlinecode {
            font-size: min(1.45vw, 1.95vh);
            line-height: 1.25;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.55);
        }

        .footnote a {
            color: #027cf7;
            text-shadow: none;
            text-decoration: none;
        }

        .icon {
            width: min(1.2vw, 1.6vh);
            height: min(1.2vw, 1.6vh);
            vertical-align: 0.34em;
        }
    </style>
</head>

<body>
    <main class="cover-frame" aria-label="DBPA cover preview">
        <section class="title-zone">
            <h5 class="eyebrow">数据存储和使用的最佳实践</h5>
            <h1 class="course-title">数据库原理与应用</h1>
            <h5 class="subtitle">Database Principles and Applications</h5>
        </section>

        <p class="footnote">
            <inlinecode>
                Powered by
                <a href="https://github.com/impress/impress.js/">impress.js</a>
                <span><img class="icon" src="../favicon.png" alt=""></span>
                <br />
                Ver. 2608
            </inlinecode>
        </p>
    </main>
</body>

</html>
