<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">意向锁相容矩阵</title>
  <desc id="desc">意向锁在祖先节点汇总后裔的加锁意图，S、X、IS、IX、SIX 的请求通过相容矩阵判断是否可以并发。</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #f7f9fc; stroke: #c8d3df; stroke-width: 2; rx: 16; }
      .head { fill: #e8f3ff; stroke: #7890a5; stroke-width: 2; }
      .yes { fill: #eef8ed; stroke: #7890a5; stroke-width: 2; }
      .no { fill: #fff1dc; stroke: #d49a61; stroke-width: 2; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; text-anchor: middle; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; text-anchor: middle; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="62">意向锁把后裔冲突先汇总到祖先节点</text>
  <rect class="panel" x="45" y="105" width="1110" height="460"/>
  <text class="text" x="640" y="145">T1 已持有的锁＼T2 请求的锁</text>
  <g transform="translate(230 175)">
    <rect class="head" x="0" y="0" width="135" height="52"/><text class="label" x="67" y="33">S</text>
    <rect class="head" x="135" y="0" width="135" height="52"/><text class="label" x="202" y="33">X</text>
    <rect class="head" x="270" y="0" width="135" height="52"/><text class="label" x="337" y="33">IS</text>
    <rect class="head" x="405" y="0" width="135" height="52"/><text class="label" x="472" y="33">IX</text>
    <rect class="head" x="540" y="0" width="135" height="52"/><text class="label" x="607" y="33">SIX</text>
    <rect class="head" x="-135" y="52" width="135" height="52"/><text class="label" x="-67" y="85">S</text>
    <rect class="head" x="-135" y="104" width="135" height="52"/><text class="label" x="-67" y="137">X</text>
    <rect class="head" x="-135" y="156" width="135" height="52"/><text class="label" x="-67" y="189">IS</text>
    <rect class="head" x="-135" y="208" width="135" height="52"/><text class="label" x="-67" y="241">IX</text>
    <rect class="head" x="-135" y="260" width="135" height="52"/><text class="label" x="-67" y="293">SIX</text>
    <g transform="translate(0 52)">
      <rect class="yes" x="0" y="0" width="135" height="52"/><text class="label" x="67" y="33">Y</text><rect class="no" x="135" y="0" width="135" height="52"/><text class="label" x="202" y="33">N</text><rect class="yes" x="270" y="0" width="135" height="52"/><text class="label" x="337" y="33">Y</text><rect class="no" x="405" y="0" width="135" height="52"/><text class="label" x="472" y="33">N</text><rect class="no" x="540" y="0" width="135" height="52"/><text class="label" x="607" y="33">N</text>
      <rect class="no" x="0" y="52" width="135" height="52"/><text class="label" x="67" y="85">N</text><rect class="no" x="135" y="52" width="135" height="52"/><text class="label" x="202" y="85">N</text><rect class="no" x="270" y="52" width="135" height="52"/><text class="label" x="337" y="85">N</text><rect class="no" x="405" y="52" width="135" height="52"/><text class="label" x="472" y="85">N</text><rect class="no" x="540" y="52" width="135" height="52"/><text class="label" x="607" y="85">N</text>
      <rect class="yes" x="0" y="104" width="135" height="52"/><text class="label" x="67" y="137">Y</text><rect class="no" x="135" y="104" width="135" height="52"/><text class="label" x="202" y="137">N</text><rect class="yes" x="270" y="104" width="135" height="52"/><text class="label" x="337" y="137">Y</text><rect class="yes" x="405" y="104" width="135" height="52"/><text class="label" x="472" y="137">Y</text><rect class="yes" x="540" y="104" width="135" height="52"/><text class="label" x="607" y="137">Y</text>
      <rect class="no" x="0" y="156" width="135" height="52"/><text class="label" x="67" y="189">N</text><rect class="no" x="135" y="156" width="135" height="52"/><text class="label" x="202" y="189">N</text><rect class="yes" x="270" y="156" width="135" height="52"/><text class="label" x="337" y="189">Y</text><rect class="yes" x="405" y="156" width="135" height="52"/><text class="label" x="472" y="189">Y</text><rect class="no" x="540" y="156" width="135" height="52"/><text class="label" x="607" y="189">N</text>
      <rect class="no" x="0" y="208" width="135" height="52"/><text class="label" x="67" y="241">N</text><rect class="no" x="135" y="208" width="135" height="52"/><text class="label" x="202" y="241">N</text><rect class="yes" x="270" y="208" width="135" height="52"/><text class="label" x="337" y="241">Y</text><rect class="no" x="405" y="208" width="135" height="52"/><text class="label" x="472" y="241">N</text><rect class="no" x="540" y="208" width="135" height="52"/><text class="label" x="607" y="241">N</text>
    </g>
  </g>
  <text class="small" x="95" y="620">IS：后裔将加 S 锁　IX：后裔将加 X 锁　SIX：本节点 S 锁 + 后裔 IX 意图</text>
</svg>
