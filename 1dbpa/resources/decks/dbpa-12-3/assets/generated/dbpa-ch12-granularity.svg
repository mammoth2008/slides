<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">封锁粒度的并发度与开销取舍</title>
  <desc id="desc">页级锁会让同页不同元组的更新互相等待，元组级锁可以并发但锁数量和管理开销更高。</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #f7f9fc; stroke: #c8d3df; stroke-width: 2; rx: 16; }
      .page { fill: #fff1dc; stroke: #d49a61; stroke-width: 2; rx: 12; }
      .tuple { fill: #e8f3ff; stroke: #7890a5; stroke-width: 2; rx: 9; }
      .safe { fill: #eef8ed; stroke: #7890a5; stroke-width: 2; rx: 9; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; text-anchor: middle; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; text-anchor: middle; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="62">锁对象越大，管理越省；锁对象越小，互相等待越少</text>
  <rect class="panel" x="45" y="105" width="530" height="465"/>
  <rect class="panel" x="625" y="105" width="530" height="465"/>
  <text class="label" x="310" y="155">页级锁：保护一整页</text>
  <text class="label" x="890" y="155">元组级锁：只保护目标记录</text>
  <rect class="page" x="145" y="215" width="330" height="240"/><text class="label" x="310" y="255">数据页 A</text>
  <rect class="page" x="180" y="290" width="120" height="70"/><text class="text" x="240" y="331">L1</text>
  <rect class="page" x="320" y="290" width="120" height="70"/><text class="text" x="380" y="331">L2</text>
  <text class="text" x="310" y="405">T1 改 L1 后锁住整页</text><text class="text" x="310" y="430">T2 改 L2 也必须等待</text>
  <rect class="safe" x="705" y="215" width="170" height="90"/><text class="label" x="790" y="255">L1</text><text class="text" x="790" y="280">T1 持有锁</text>
  <rect class="safe" x="925" y="215" width="170" height="90"/><text class="label" x="1010" y="255">L2</text><text class="text" x="1010" y="280">T2 持有锁</text>
  <line x1="790" y1="340" x2="1010" y2="340" stroke="#7890a5" stroke-width="2"/>
  <text class="text" x="900" y="385">不同元组可以并发修改</text><text class="text" x="900" y="410">但需要维护更多锁</text>
  <text class="small" x="80" y="525">并发度较低</text><text class="small" x="405" y="525">锁管理较简单</text>
  <text class="small" x="660" y="525">并发度较高</text><text class="small" x="985" y="525">锁管理较复杂</text>
  <text class="text" x="600" y="625">选择粒度要看事务访问范围：读大范围数据适合大粒度，改少量记录适合小粒度</text>
</svg>
