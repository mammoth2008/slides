<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">定长记录与变长记录在块中的组织</title>
  <desc id="desc">定长记录可以按固定位置排列，变长记录使用偏移量表并从块尾存放，中央保留空闲空间。</desc>
  <style>
    .bg { fill: #fbfcfe; }
    .panel { fill: #f7f9fc; stroke: #c8d3df; stroke-width: 2; rx: 18; }
    .cell { fill: #e8f3ff; stroke: #7890a5; stroke-width: 2; }
    .cell2 { fill: #eef8ed; stroke: #7890a5; stroke-width: 2; }
    .free { fill: #fff1dc; stroke: #d49a61; stroke-width: 2; stroke-dasharray: 8 7; }
    .title { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
    .label { font: 700 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
    .text { font: 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
    .center { text-anchor: middle; }
  </style>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="62">块内组织同时回答“记录在哪”和“空闲空间在哪”</text>

  <rect class="panel" x="45" y="115" width="1110" height="240"/>
  <text class="label" x="75" y="160">定长记录</text>
  <text class="text" x="75" y="190">每条记录占用相同大小，位置容易计算</text>
  <rect class="cell" x="110" y="235" width="290" height="70"/>
  <rect class="cell" x="400" y="235" width="290" height="70"/>
  <rect class="cell" x="690" y="235" width="290" height="70"/>
  <rect class="free" x="980" y="235" width="130" height="70"/>
  <text class="text center" x="255" y="277">记录 1</text>
  <text class="text center" x="545" y="277">记录 2</text>
  <text class="text center" x="835" y="277">记录 3</text>
  <text class="text center" x="1045" y="270">空闲</text>
  <text class="text center" x="1045" y="292">位置</text>

  <rect class="panel" x="45" y="390" width="1110" height="270"/>
  <text class="label" x="75" y="435">变长记录</text>
  <text class="text" x="75" y="465">块头维护偏移量，记录从块尾向前存放，空闲空间集中在中间</text>
  <rect class="cell2" x="110" y="505" width="150" height="95"/>
  <rect class="cell2" x="260" y="505" width="150" height="95"/>
  <rect class="cell2" x="410" y="505" width="150" height="95"/>
  <rect class="free" x="560" y="505" width="245" height="95"/>
  <rect class="cell2" x="805" y="505" width="115" height="95"/>
  <rect class="cell2" x="920" y="505" width="190" height="95"/>
  <text class="text center" x="185" y="545">偏移 1</text>
  <text class="text center" x="335" y="545">偏移 2</text>
  <text class="text center" x="485" y="545">偏移 3</text>
  <text class="text center" x="682" y="545">集中空闲空间</text>
  <text class="text center" x="862" y="545">记录 C</text>
  <text class="text center" x="1015" y="545">记录 B（更长）</text>
  <text class="text" x="110" y="630">记录变长后放不下：迁移记录，并同步修改偏移量或指针</text>
</svg>
