<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">稠密索引与直接扫描的块访问</title>
  <desc id="desc">教材示例中，稠密索引通过两个索引块和一个数据块找到目标记录，直接扫描需要依次读取六个数据块。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7890a5"/>
    </marker>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #f7f9fc; stroke: #c8d3df; stroke-width: 2; rx: 18; }
      .idx { fill: #e8f3ff; stroke: #7890a5; stroke-width: 2; rx: 12; }
      .data { fill: #eef8ed; stroke: #7890a5; stroke-width: 2; rx: 12; }
      .scan { fill: #fff1dc; stroke: #d49a61; stroke-width: 2; rx: 12; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; text-anchor: middle; }
      .text { font: 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; text-anchor: middle; }
      .caption { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .arrow { stroke: #7890a5; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="62">索引的收益来自“先读小入口，再读目标数据块”</text>

  <rect class="panel" x="45" y="105" width="1110" height="260"/>
  <text class="caption" x="75" y="150">教材示例：稠密索引查找 Sno = 20180012</text>
  <rect class="idx" x="100" y="210" width="190" height="85"/>
  <rect class="idx" x="370" y="210" width="190" height="85"/>
  <rect class="data" x="640" y="210" width="230" height="85"/>
  <text class="label" x="195" y="247">索引块 1</text>
  <text class="text" x="195" y="275">读取入口</text>
  <text class="label" x="465" y="247">索引块 2</text>
  <text class="text" x="465" y="275">找到指针</text>
  <text class="label" x="755" y="247">数据块</text>
  <text class="text" x="755" y="275">读取目标记录</text>
  <path class="arrow" d="M290 252 H365"/>
  <path class="arrow" d="M560 252 H635"/>
  <text class="text" x="1005" y="240">3 次 I/O</text>
  <text class="text" x="1005" y="270">索引块 2 次</text>
  <text class="text" x="1005" y="295">数据块 1 次</text>

  <rect class="panel" x="45" y="405" width="1110" height="220"/>
  <text class="caption" x="75" y="450">不使用索引：从表的第一个数据块开始顺序扫描</text>
  <rect class="scan" x="100" y="500" width="115" height="65"/>
  <rect class="scan" x="245" y="500" width="115" height="65"/>
  <rect class="scan" x="390" y="500" width="115" height="65"/>
  <rect class="scan" x="535" y="500" width="115" height="65"/>
  <rect class="scan" x="680" y="500" width="115" height="65"/>
  <rect class="data" x="825" y="500" width="115" height="65"/>
  <text class="text" x="157" y="538">块 1</text>
  <text class="text" x="302" y="538">块 2</text>
  <text class="text" x="447" y="538">块 3</text>
  <text class="text" x="592" y="538">块 4</text>
  <text class="text" x="737" y="538">块 5</text>
  <text class="text" x="882" y="538">块 6</text>
  <path class="arrow" d="M215 532 H240"/><path class="arrow" d="M360 532 H385"/><path class="arrow" d="M505 532 H530"/><path class="arrow" d="M650 532 H675"/><path class="arrow" d="M795 532 H820"/>
  <text class="text" x="1030" y="528">最多 6 次 I/O</text>
  <text class="text" x="1030" y="558">逐块判断</text>
</svg>
