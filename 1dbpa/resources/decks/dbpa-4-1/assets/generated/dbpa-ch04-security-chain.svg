<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">数据库安全控制链</title>
  <desc id="desc">用户先经过身份鉴别，再由数据库管理系统检查操作和对象权限，关键行为记录并配合存储传输保护。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60758a"/></marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e2d3b; }
      .title { font-size: 30px; font-weight: 700; }
      .note { font-size: 18px; fill: #536979; }
      .box { stroke: #7890a5; stroke-width: 2; }
      .blue { fill: #e8f3ff; } .green { fill: #eef8ed; } .orange { fill: #fff1dc; } .purple { fill: #f0eaff; } .gray { fill: #f3f5f7; }
      .box-title { font-size: 23px; font-weight: 700; }
      .small { font-size: 16px; fill: #536979; }
      .step { font-size: 16px; font-weight: 650; fill: #60758a; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#fbfcfe"/>
  <text class="label title" x="65" y="62">登录只是第一道门</text>
  <text class="label note" x="65" y="95">安全控制要继续检查对象、操作和策略，并留下可追踪的行为记录</text>

  <rect class="box blue" x="65" y="190" width="200" height="145" rx="20"/>
  <text class="label box-title" x="165" y="240" text-anchor="middle">待认证请求</text>
  <text class="label small" x="165" y="278" text-anchor="middle">凭证 + 操作 + 对象</text>
  <text class="label small" x="165" y="305" text-anchor="middle">请求访问 Student</text>
  <line x1="265" y1="262" x2="330" y2="262" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box green" x="330" y="165" width="205" height="195" rx="20"/>
  <text class="label box-title" x="432" y="215" text-anchor="middle">身份鉴别</text>
  <text class="label small" x="432" y="255" text-anchor="middle">口令、令牌或证书</text>
  <text class="label small" x="432" y="290" text-anchor="middle">确认“是谁”</text>
  <text class="label step" x="432" y="332" text-anchor="middle">事前控制</text>
  <line x1="535" y1="262" x2="600" y2="262" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box orange" x="600" y="145" width="230" height="235" rx="20"/>
  <text class="label box-title" x="715" y="195" text-anchor="middle">合法权限检查</text>
  <text class="label small" x="715" y="235" text-anchor="middle">查数据字典</text>
  <text class="label small" x="715" y="267" text-anchor="middle">检查对象与操作</text>
  <text class="label small" x="715" y="299" text-anchor="middle">DAC / MAC</text>
  <text class="label step" x="715" y="350" text-anchor="middle">事中控制</text>
  <line x1="830" y1="262" x2="895" y2="262" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box purple" x="895" y="165" width="240" height="195" rx="20"/>
  <text class="label box-title" x="1015" y="215" text-anchor="middle">允许或拒绝</text>
  <text class="label small" x="1015" y="255" text-anchor="middle">记录关键行为</text>
  <text class="label small" x="1015" y="287" text-anchor="middle">保护存储与传输</text>
  <text class="label step" x="1015" y="332" text-anchor="middle">事后与数据层</text>

  <rect class="box gray" x="170" y="475" width="860" height="100" rx="20"/>
  <text class="label box-title" x="600" y="518" text-anchor="middle">密码正确 ≠ 可以读取任意表</text>
  <text class="label small" x="600" y="553" text-anchor="middle">身份鉴别回答“你是谁”，授权检查回答“你能对什么做什么”</text>
</svg>
