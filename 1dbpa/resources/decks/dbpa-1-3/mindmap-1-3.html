<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据库系统的三级模式结构 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"数据库系统的三级模式结构","children":[{"content":"1.3.1 模式与实例","children":[{"content":"型和值：结构说明与具体赋值，可类比 Java 类与对象","children":[]},{"content":"模式与实例：结构描述与时刻状态","children":[]},{"content":"稳定与变化：模式相对稳定，实例随更新变化","children":[]}]},{"content":"1.3.2 三级模式","children":[{"content":"外模式：面向用户与应用的局部逻辑视图和应用入口","children":[]},{"content":"模式：全体数据的公共逻辑结构、联系和约束，不负责物理细节","children":[]},{"content":"内模式：记录、索引、物理页等数据的物理组织与存储方式","children":[]},{"content":"数量关系：多个外模式、一个模式、一个内模式","children":[]}]},{"content":"1.3.3 两级映像与数据独立性","children":[{"content":"两级对应：用户视图对应全局关系，全局关系再对应记录页和索引","children":[]},{"content":"模式变化：DBA 调整外模式/模式映像，原字段和原查询可保持不变","children":[]},{"content":"内模式变化：DBA 调整模式/内模式映像，原逻辑关系和查询可保持不变","children":[]},{"content":"独立性判断：加表或字段看逻辑独立性，换存储或索引看物理独立性","children":[]},{"content":"可保持不变：加表或换索引且原课表需求不变时，可只调整对应映像","children":[]},{"content":"必须修改应用：用户新增“售后处理”等操作时，需要修改外模式和程序","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
