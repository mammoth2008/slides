<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">递归 CTE 按层扩张课程先修关系</title>
  <desc id="desc">种子查询从数据库系统概论找到数据结构，递归查询继续找到程序设计基础与 C 语言，下一层为空时停止。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .title { font-size: 31px; font-weight: 700; }
      .note { font-size: 18px; fill: #60758a; }
      .box-title { font-size: 24px; font-weight: 700; }
      .small-title { font-size: 20px; font-weight: 650; }
      .small { font-size: 17px; fill: #60758a; }
      .layer { font-size: 18px; font-weight: 700; fill: #397447; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#fbfcfe"/>
  <text class="label title" x="64" y="62">WITH RECURSIVE 把先修关系一层一层扩张</text>
  <text class="label note" x="64" y="98">种子得到第一层，递归部分用上一层继续匹配，空层让递归结束</text>

  <rect x="62" y="174" width="1060" height="270" rx="24" fill="#eef8ed" stroke="#7890a5" stroke-width="2"/>
  <text class="label box-title" x="592" y="222" text-anchor="middle">课程关系的层次结果</text>

  <rect x="110" y="290" width="220" height="94" rx="20" fill="#e8f3ff" stroke="#7890a5" stroke-width="2"/>
  <text class="label layer" x="220" y="320" text-anchor="middle">种子 L1</text>
  <text class="label small-title" x="220" y="355" text-anchor="middle">数据结构</text>
  <text class="label small" x="220" y="379" text-anchor="middle">直接先修课</text>

  <line x1="334" y1="337" x2="430" y2="337" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label small" x="382" y="315" text-anchor="middle">递归匹配</text>

  <rect x="438" y="290" width="220" height="94" rx="20" fill="#fff1dc" stroke="#7890a5" stroke-width="2"/>
  <text class="label layer" x="548" y="320" text-anchor="middle">递归层 L2</text>
  <text class="label small-title" x="548" y="355" text-anchor="middle">程序设计基础与 C 语言</text>
  <text class="label small" x="548" y="379" text-anchor="middle">上一层的直接先修课</text>

  <line x1="662" y1="337" x2="758" y2="337" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label small" x="710" y="315" text-anchor="middle">继续匹配</text>

  <rect x="766" y="290" width="220" height="94" rx="20" fill="#f0eaff" stroke="#7890a5" stroke-width="2"/>
  <text class="label layer" x="876" y="320" text-anchor="middle">空层 L3</text>
  <text class="label small-title" x="876" y="355" text-anchor="middle">没有新的课程</text>
  <text class="label small" x="876" y="379" text-anchor="middle">递归停止</text>

  <rect x="156" y="500" width="888" height="130" rx="22" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text class="label box-title" x="600" y="545" text-anchor="middle">三段心智模型</text>
  <text class="label small" x="300" y="590" text-anchor="middle">种子：初始化结果集</text>
  <text class="label small" x="600" y="590" text-anchor="middle">递归：用上一层生成下一层</text>
  <text class="label small" x="900" y="590" text-anchor="middle">终止：新结果为空或达到边界</text>
</svg>
