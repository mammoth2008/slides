<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">业务任务选择 SQL 扩展路径</title>
  <desc id="desc">集合查询留在基本 SQL，层次关系使用递归查询，日期和字符串处理使用内置函数，界面交互交给高级语言接口。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .title { font-size: 31px; font-weight: 700; }
      .note { font-size: 18px; fill: #60758a; }
      .box-title { font-size: 23px; font-weight: 700; }
      .small { font-size: 17px; fill: #60758a; }
      .small-title { font-size: 19px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#fbfcfe"/>
  <text class="label title" x="64" y="62">先看任务的困难类型，再选择最小扩展路径</text>
  <text class="label note" x="64" y="98">同样是“处理数据”，集合变换、层次扩张、值计算和界面交互需要不同工具</text>

  <rect x="62" y="160" width="330" height="430" rx="24" fill="#eef8ed" stroke="#7890a5" stroke-width="2"/>
  <text class="label box-title" x="227" y="208" text-anchor="middle">任务困难</text>
  <rect x="96" y="246" width="262" height="62" rx="16" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small-title" x="227" y="284" text-anchor="middle">集合筛选、连接、聚合</text>
  <rect x="96" y="338" width="262" height="62" rx="16" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small-title" x="227" y="376" text-anchor="middle">层次关系、间接先修</text>
  <rect x="96" y="430" width="262" height="62" rx="16" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small-title" x="227" y="468" text-anchor="middle">日期、字符串、格式</text>
  <rect x="96" y="522" width="262" height="62" rx="16" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small-title" x="227" y="560" text-anchor="middle">界面输入、交互反馈</text>

  <line x1="400" y1="277" x2="554" y2="277" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="400" y1="369" x2="554" y2="369" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="400" y1="461" x2="554" y2="461" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="400" y1="553" x2="554" y2="553" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="548" y="160" width="590" height="430" rx="24" fill="#fff7e8" stroke="#7890a5" stroke-width="2"/>
  <text class="label box-title" x="843" y="208" text-anchor="middle">最小表达路径</text>
  <rect x="598" y="246" width="490" height="62" rx="16" fill="#ffffff" stroke="#d9a55a"/>
  <text class="label small-title" x="650" y="284">基本 SQL</text>
  <text class="label small" x="1060" y="284" text-anchor="end">描述集合结果</text>
  <rect x="598" y="338" width="490" height="62" rx="16" fill="#ffffff" stroke="#d9a55a"/>
  <text class="label small-title" x="650" y="376">WITH RECURSIVE</text>
  <text class="label small" x="1060" y="376" text-anchor="end">按层扩张结果</text>
  <rect x="598" y="430" width="490" height="62" rx="16" fill="#ffffff" stroke="#d9a55a"/>
  <text class="label small-title" x="650" y="468">内置函数</text>
  <text class="label small" x="1060" y="468" text-anchor="end">复用数据处理</text>
  <rect x="598" y="522" width="490" height="62" rx="16" fill="#ffffff" stroke="#d9a55a"/>
  <text class="label small-title" x="650" y="560">高级语言接口</text>
  <text class="label small" x="1060" y="560" text-anchor="end">处理界面和交互</text>

  <rect x="302" y="630" width="596" height="46" rx="14" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text class="label note" x="600" y="660" text-anchor="middle">不要为了展示复杂而把所有逻辑塞进一条 SQL</text>
</svg>
