<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">比较无损连接与产生伪元组的有损连接</title>
  <desc id="desc">当两个投影只共享属性 B 且 B 不能决定任一侧时，自然连接会产生伪元组；如果共享属性满足函数依赖 B 到一侧属性，则可以无损恢复。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#71849a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="#fbfcfe"/>
  <text x="72" y="78" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700">连接是否无损，要看公共属性能否约束另一侧</text>
  <text x="74" y="120" fill="#60758a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">共同属性只是连接入口；没有足够依赖时，连接会拼出原来不存在的元组</text>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="62" y="174" width="510" height="326" rx="24" fill="#fff1dc" stroke="#7890a5" stroke-width="2"/>
    <rect x="628" y="174" width="510" height="326" rx="24" fill="#eef8ed" stroke="#7890a5" stroke-width="2"/>
  </g>

  <g fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="317" y="222" text-anchor="middle" font-size="28" font-weight="700">有损：会产生伪元组</text>
    <text x="317" y="260" text-anchor="middle" font-size="19" fill="#60758a">原关系 R(A,B,C)：(a1,b,c1)、(a2,b,c2)</text>
    <text x="92" y="314" font-size="20">R1(A,B)：a1,b　　a2,b</text>
    <text x="92" y="356" font-size="20">R2(B,C)：b,c1　　b,c2</text>
    <path d="M286 376 H348" fill="none" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="370" y="382" font-size="19">⋈</text>
    <text x="92" y="432" font-size="19" fill="#9d5c20">多出 (a1,b,c2)、(a2,b,c1)</text>
    <text x="92" y="468" font-size="18" fill="#60758a">B 不能决定 A 或 C</text>

    <text x="883" y="222" text-anchor="middle" font-size="28" font-weight="700">无损：可以恢复</text>
    <text x="883" y="260" text-anchor="middle" font-size="19" fill="#60758a">若公共属性满足 B → C</text>
    <text x="658" y="314" font-size="20">R1(A,B)：a1,b1　a2,b2</text>
    <text x="658" y="356" font-size="20">R2(B,C)：b1,c1　b2,c2</text>
    <path d="M852 376 H914" fill="none" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="936" y="382" font-size="19">⋈</text>
    <text x="658" y="432" font-size="19" fill="#397447">只恢复原来的两行</text>
    <text x="658" y="468" font-size="18" fill="#60758a">公共属性决定一侧，连接不会乱配</text>
  </g>

  <rect x="178" y="560" width="844" height="70" rx="18" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text x="600" y="604" text-anchor="middle" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600">无损连接：投影后自然连接，仍然得到原关系，不增伪元组</text>
</svg>
