<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">区块结构与链式哈希</title>
  <desc id="desc">比特币式示例中，一个区块由区块头和交易区块体组成，区块头保存父哈希与 Merkle 根；Merkle 根承诺交易集合，当前区块哈希供后继区块作为父哈希。</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #f7f9fc; stroke: #c8d3df; stroke-width: 2; rx: 16; }
      .header { fill: #eeeafa; stroke: #b7a9d8; stroke-width: 2; rx: 14; }
      .body { fill: #eaf3fb; stroke: #a7c5df; stroke-width: 2; rx: 14; }
      .block { fill: #eaf4ef; stroke: #a9cbb9; stroke-width: 2; rx: 14; }
      .title { font: 700 29px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .arrow { stroke: #71869a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .line { stroke: #b7c7d8; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#71869a"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="60">区块头保存“如何接入链”，区块体保存“记录了什么”</text>

  <rect class="block" x="85" y="160" width="360" height="355"/>
  <text class="label" x="215" y="205">前一区块</text>
  <text class="text" x="154" y="240">区块哈希：a91f…</text>
  <path class="arrow" d="M445 337 H510"/>
  <text class="small" x="456" y="320">父哈希</text>

  <rect class="panel" x="535" y="115" width="580" height="455"/>
  <text class="label" x="760" y="155">当前区块</text>
  <rect class="header" x="575" y="180" width="500" height="155"/>
  <text class="label" x="605" y="220">区块头</text>
  <text class="text" x="605" y="255">父区块哈希：a91f…</text>
  <text class="text" x="605" y="285">Merkle 根：7c2e…</text>
  <text class="small" x="605" y="315">版本 · 时间戳 · Bits · Nonce</text>
  <rect class="body" x="575" y="365" width="500" height="150"/>
  <text class="label" x="605" y="405">交易区块体</text>
  <text class="text" x="605" y="440">交易 1　交易 2　交易 3　…</text>
  <text class="small" x="605" y="477">交易哈希逐层合并得到 Merkle 根</text>
  <path class="arrow" d="M825 337 V355"/>
  <text class="small" x="850" y="350">Merkle 根承诺交易集合</text>
  <path class="arrow" d="M1115 337 H1155"/>
  <text class="small" x="1090" y="320">供后继区块作父哈希</text>
  <rect class="block" x="1165" y="275" width="0" height="0"/>

  <rect class="panel" x="85" y="600" width="1030" height="58"/>
  <text class="label" x="120" y="638">验证直觉</text>
  <text class="text" x="290" y="638">交易改动 → Merkle 根改动；父哈希改动 → 后继区块的链接不再匹配</text>
</svg>
