<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">存储过程参数的输入输出方向</title>
  <desc id="desc">IN 只把初始值传入过程，OUT 从过程返回结果，INOUT 既传入初始值又返回修改后的值。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .title { font-size: 31px; font-weight: 700; }
      .note { font-size: 18px; fill: #60758a; }
      .box-title { font-size: 24px; font-weight: 700; }
      .small-title { font-size: 20px; font-weight: 650; }
      .small { font-size: 17px; fill: #60758a; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#fbfcfe"/>
  <text class="label title" x="64" y="62">参数模式决定调用者与存储过程之间的数据流向</text>
  <text class="label note" x="64" y="98">先画清输入和输出，再设计过程体内部的变量与游标</text>

  <rect x="62" y="176" width="270" height="370" rx="24" fill="#e8f3ff" stroke="#7890a5" stroke-width="2"/>
  <text class="label box-title" x="197" y="224" text-anchor="middle">调用者</text>
  <rect x="112" y="290" width="170" height="74" rx="18" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small-title" x="197" y="334" text-anchor="middle">学号、初始值</text>
  <rect x="112" y="414" width="170" height="74" rx="18" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small-title" x="197" y="458" text-anchor="middle">接收结果</text>

  <rect x="452" y="176" width="300" height="370" rx="24" fill="#fff1dc" stroke="#7890a5" stroke-width="2"/>
  <text class="label box-title" x="602" y="224" text-anchor="middle">存储过程</text>
  <rect x="500" y="290" width="204" height="74" rx="18" fill="#ffffff" stroke="#d9a55a"/>
  <text class="label small-title" x="602" y="334" text-anchor="middle">过程体计算</text>
  <text class="label small" x="602" y="391" text-anchor="middle">变量、游标、控制流</text>
  <rect x="500" y="414" width="204" height="74" rx="18" fill="#ffffff" stroke="#d9a55a"/>
  <text class="label small-title" x="602" y="458" text-anchor="middle">修改后的值</text>

  <rect x="870" y="176" width="268" height="370" rx="24" fill="#eef8ed" stroke="#7890a5" stroke-width="2"/>
  <text class="label box-title" x="1004" y="224" text-anchor="middle">方向判断</text>
  <text class="label small-title" x="1004" y="302" text-anchor="middle">IN：只传入</text>
  <text class="label small-title" x="1004" y="378" text-anchor="middle">OUT：只返回</text>
  <text class="label small-title" x="1004" y="454" text-anchor="middle">INOUT：传入并返回</text>

  <line x1="288" y1="327" x2="492" y2="327" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label small" x="390" y="305" text-anchor="middle">IN</text>
  <path d="M 500 451 C 420 400, 345 400, 288 451" fill="none" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label small" x="390" y="402" text-anchor="middle">OUT</text>
  <path d="M 492 464 C 420 520, 345 520, 288 464" fill="none" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label small" x="390" y="560" text-anchor="middle">INOUT</text>

  <rect x="278" y="630" width="644" height="46" rx="14" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text class="label note" x="600" y="660" text-anchor="middle">接口方向清楚，调用者才容易测试过程的输入与输出</text>
</svg>
