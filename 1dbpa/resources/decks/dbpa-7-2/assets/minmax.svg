<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" role="img"><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#242424;font-size:27px} .head{font-weight:700;font-size:32px} .small{font-size:24px} .accent{fill:#b92d35} .box{fill:#fff;stroke:#333;stroke-width:3} .line{stroke:#333;stroke-width:3;fill:none}</style><rect width="100%" height="100%" fill="#fff"/><rect class="box" x="40" y="70" width="250" height="110"/><text x="165.0" y="110" text-anchor="middle" class="head">学院</text><rect class="box" x="830" y="70" width="250" height="110"/><text x="955.0" y="110" text-anchor="middle" class="head">系</text><path class="line" d="M290,125 L475,125"/><path class="line" d="M645,125 L830,125"/><path class="box" d="M475,125 L560,70 L645,125 L560,180 Z"/><text x="560" y="134" text-anchor="middle" class="">设置</text><text x="340" y="100" text-anchor="middle" class="accent">1..1</text><text x="775" y="100" text-anchor="middle" class="accent">0..*</text><text x="560" y="255" text-anchor="middle" class="">从学院出发，读靠近“系”的 0..*：一个学院可有零到多个系</text><text x="560" y="310" text-anchor="middle" class="">从系出发，读靠近“学院”的 1..1：每个系必须属于一个学院</text></svg>