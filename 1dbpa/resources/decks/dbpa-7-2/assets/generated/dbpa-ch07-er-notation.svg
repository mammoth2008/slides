<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">E-R 图用实体型、联系和属性表达业务事实</title>
  <desc id="desc">学生和课程是实体型，选课是两者之间的联系，成绩和选课时间是联系属性；两端的 m 和 n 表示多对多语义。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#71849a" flood-opacity="0.13"/>
    </filter>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .title { font-size: 32px; font-weight: 700; }
      .note { font-size: 19px; fill: #60758a; }
      .node { stroke: #7890a5; stroke-width: 2.5; }
      .node-title { font-size: 29px; font-weight: 700; }
      .small { font-size: 19px; fill: #60758a; }
      .mark { font-size: 24px; font-weight: 700; fill: #397447; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#fbfcfe"/>
  <text class="label title" x="64" y="62">E-R 图把业务事实拆成三类语义对象</text>
  <text class="label note" x="64" y="98">实体型描述对象，联系描述对象之间的事实，属性补充需要保存的细节</text>

  <g filter="url(#shadow)">
    <rect class="node" x="90" y="250" width="260" height="154" rx="22" fill="#e8f3ff"/>
    <polygon class="node" points="600,216 734,327 600,438 466,327" fill="#fff1dc"/>
    <rect class="node" x="850" y="250" width="260" height="154" rx="22" fill="#eef8ed"/>
    <ellipse class="node" cx="600" cy="568" rx="188" ry="62" fill="#f0eaff"/>
  </g>

  <line x1="350" y1="327" x2="466" y2="327" stroke="#60758a" stroke-width="3"/>
  <line x1="734" y1="327" x2="850" y2="327" stroke="#60758a" stroke-width="3"/>
  <line x1="600" y1="438" x2="600" y2="506" stroke="#60758a" stroke-width="3"/>

  <text class="label node-title" x="220" y="310" text-anchor="middle">学生</text>
  <text class="label small" x="220" y="350" text-anchor="middle">学号、姓名</text>
  <text class="label small" x="220" y="382" text-anchor="middle">实体型</text>

  <text class="label node-title" x="600" y="319" text-anchor="middle">选课</text>
  <text class="label small" x="600" y="355" text-anchor="middle">联系</text>

  <text class="label node-title" x="980" y="310" text-anchor="middle">课程</text>
  <text class="label small" x="980" y="350" text-anchor="middle">课程号、课程名</text>
  <text class="label small" x="980" y="382" text-anchor="middle">实体型</text>

  <text class="label node-title" x="600" y="560" text-anchor="middle">成绩、选课时间</text>
  <text class="label small" x="600" y="596" text-anchor="middle">联系属性</text>

  <text class="label mark" x="405" y="306" text-anchor="middle">m</text>
  <text class="label mark" x="795" y="306" text-anchor="middle">n</text>

  <rect x="214" y="620" width="772" height="52" rx="16" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text class="label note" x="600" y="654" text-anchor="middle">联系属性属于一次“学生选修课程”的事实，不是学生或课程的固定属性</text>
</svg>
