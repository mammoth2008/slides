<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">局部 E-R 图经过冲突消解形成全局基本模型</title>
  <desc id="desc">选课管理和教师教学管理分别形成局部视图，合并时处理属性、命名和结构冲突，再得到统一的全局基本 E-R 图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .title { font-size: 31px; font-weight: 700; }
      .note { font-size: 18px; fill: #60758a; }
      .panel { stroke: #7890a5; stroke-width: 2; }
      .panel-title { font-size: 24px; font-weight: 700; }
      .small-title { font-size: 20px; font-weight: 650; }
      .small { font-size: 17px; fill: #60758a; }
      .chip { font-size: 17px; font-weight: 650; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#fbfcfe"/>
  <text class="label title" x="64" y="62">局部视图先表达各自业务，再合并成共同模型</text>
  <text class="label note" x="64" y="98">合并不是把图直接叠在一起，而是先处理不一致，再判断哪些事实重复</text>

  <rect class="panel" x="62" y="160" width="300" height="220" rx="24" fill="#e8f3ff"/>
  <text class="label panel-title" x="212" y="205" text-anchor="middle">选课管理局部图</text>
  <rect x="98" y="250" width="94" height="58" rx="12" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small-title" x="145" y="286" text-anchor="middle">学生</text>
  <polygon points="250,230 302,279 250,328 198,279" fill="#fff1dc" stroke="#8ca1b3" stroke-width="2"/>
  <text class="label small-title" x="250" y="286" text-anchor="middle">选课</text>
  <rect x="308" y="250" width="34" height="58" rx="8" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small" x="325" y="286" text-anchor="middle">班</text>
  <line x1="192" y1="279" x2="198" y2="279" stroke="#60758a" stroke-width="2"/>
  <line x1="302" y1="279" x2="308" y2="279" stroke="#60758a" stroke-width="2"/>
  <text class="label small" x="212" y="352" text-anchor="middle">学生、教学班、选课</text>

  <rect class="panel" x="62" y="420" width="300" height="220" rx="24" fill="#eef8ed"/>
  <text class="label panel-title" x="212" y="465" text-anchor="middle">教师教学局部图</text>
  <rect x="84" y="515" width="84" height="58" rx="12" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small-title" x="126" y="551" text-anchor="middle">教师</text>
  <polygon points="224,495 276,544 224,593 172,544" fill="#fff1dc" stroke="#8ca1b3" stroke-width="2"/>
  <text class="label small-title" x="224" y="551" text-anchor="middle">讲授</text>
  <rect x="282" y="515" width="56" height="58" rx="12" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small" x="310" y="551" text-anchor="middle">班</text>
  <line x1="168" y1="544" x2="172" y2="544" stroke="#60758a" stroke-width="2"/>
  <line x1="276" y1="544" x2="282" y2="544" stroke="#60758a" stroke-width="2"/>
  <text class="label small" x="212" y="617" text-anchor="middle">教师、教学班、讲授</text>

  <line x1="380" y1="280" x2="515" y2="350" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="380" y1="530" x2="515" y2="390" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="panel" x="500" y="240" width="250" height="270" rx="24" fill="#fff7e8"/>
  <text class="label panel-title" x="625" y="285" text-anchor="middle">合并与重构</text>
  <text class="label note" x="625" y="322" text-anchor="middle">先消解冲突</text>
  <rect x="548" y="350" width="154" height="38" rx="16" fill="#ffffff" stroke="#d9a55a"/>
  <text class="label chip" x="625" y="375" text-anchor="middle">属性冲突</text>
  <rect x="548" y="400" width="154" height="38" rx="16" fill="#ffffff" stroke="#d9a55a"/>
  <text class="label chip" x="625" y="425" text-anchor="middle">命名冲突</text>
  <rect x="548" y="450" width="154" height="38" rx="16" fill="#ffffff" stroke="#d9a55a"/>
  <text class="label chip" x="625" y="475" text-anchor="middle">结构冲突</text>

  <line x1="750" y1="375" x2="860" y2="375" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="panel" x="840" y="210" width="300" height="330" rx="24" fill="#f0eaff"/>
  <text class="label panel-title" x="990" y="258" text-anchor="middle">全局基本 E-R 图</text>
  <rect x="884" y="330" width="86" height="60" rx="12" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small-title" x="927" y="367" text-anchor="middle">学生</text>
  <polygon points="1004,305 1058,360 1004,415 950,360" fill="#fff1dc" stroke="#8ca1b3" stroke-width="2"/>
  <text class="label small-title" x="1004" y="367" text-anchor="middle">选课</text>
  <rect x="1068" y="330" width="56" height="60" rx="12" fill="#ffffff" stroke="#8ca1b3"/>
  <text class="label small" x="1096" y="367" text-anchor="middle">教学班</text>
  <line x1="970" y1="360" x2="950" y2="360" stroke="#60758a" stroke-width="2"/>
  <line x1="1058" y1="360" x2="1068" y2="360" stroke="#60758a" stroke-width="2"/>
  <text class="label small" x="990" y="458" text-anchor="middle">保留真实联系，删除可推导事实</text>
  <text class="label note" x="990" y="500" text-anchor="middle">统一名称、域、抽象与约束</text>

  <rect x="394" y="650" width="412" height="42" rx="14" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text class="label note" x="600" y="677" text-anchor="middle">数据字典和用户协商是共同语义的依据</text>
</svg>
