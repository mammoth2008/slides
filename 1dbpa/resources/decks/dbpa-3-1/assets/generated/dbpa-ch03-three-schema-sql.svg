<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SQL 与数据库三级模式</title>
  <desc id="desc">用户和应用通过 SQL 使用外模式与基本表，数据库管理系统把逻辑结构映射到内模式的存储文件和索引。</desc>
  <defs>
    <linearGradient id="external" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f3ff"/>
      <stop offset="1" stop-color="#d8ebff"/>
    </linearGradient>
    <linearGradient id="schema" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8ed"/>
      <stop offset="1" stop-color="#dcefd9"/>
    </linearGradient>
    <linearGradient id="internal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1dc"/>
      <stop offset="1" stop-color="#ffe4bc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60758a"/>
    </marker>
    <style>
      .layer { stroke: #7890a5; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #8ca1b3; stroke-width: 1.5; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e2d3b; }
      .layer-title { font-size: 28px; font-weight: 700; }
      .layer-note { font-size: 18px; fill: #536979; }
      .box-title { font-size: 22px; font-weight: 650; }
      .box-note { font-size: 16px; fill: #536979; }
      .map-label { font-size: 17px; font-weight: 650; fill: #536979; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="28" fill="#fbfcfe"/>

  <rect class="layer" x="80" y="55" width="1040" height="165" rx="22" fill="url(#external)"/>
  <text class="label layer-title" x="112" y="98">外模式</text>
  <text class="label layer-note" x="112" y="128">面向不同角色的局部逻辑结构</text>
  <rect class="box" x="390" y="76" width="190" height="112" rx="14"/>
  <text class="label box-title" x="485" y="121" text-anchor="middle">学生视图</text>
  <text class="label box-note" x="485" y="151" text-anchor="middle">姓名、课程、成绩</text>
  <rect class="box" x="605" y="76" width="190" height="112" rx="14"/>
  <text class="label box-title" x="700" y="121" text-anchor="middle">教师视图</text>
  <text class="label box-note" x="700" y="151" text-anchor="middle">课程与成绩统计</text>
  <rect class="box" x="820" y="76" width="250" height="112" rx="14"/>
  <text class="label box-title" x="945" y="121" text-anchor="middle">部分基本表</text>
  <text class="label box-note" x="945" y="151" text-anchor="middle">允许直接使用的逻辑对象</text>

  <line x1="600" y1="220" x2="600" y2="280" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label map-label" x="626" y="258">外模式映像</text>

  <rect class="layer" x="80" y="280" width="1040" height="165" rx="22" fill="url(#schema)"/>
  <text class="label layer-title" x="112" y="323">模式</text>
  <text class="label layer-note" x="112" y="353">数据库的全局逻辑结构</text>
  <rect class="box" x="390" y="301" width="190" height="112" rx="14"/>
  <text class="label box-title" x="485" y="346" text-anchor="middle">Student</text>
  <text class="label box-note" x="485" y="376" text-anchor="middle">基本表</text>
  <rect class="box" x="605" y="301" width="190" height="112" rx="14"/>
  <text class="label box-title" x="700" y="346" text-anchor="middle">Course</text>
  <text class="label box-note" x="700" y="376" text-anchor="middle">基本表</text>
  <rect class="box" x="820" y="301" width="250" height="112" rx="14"/>
  <text class="label box-title" x="945" y="346" text-anchor="middle">SC</text>
  <text class="label box-note" x="945" y="376" text-anchor="middle">基本表与完整性联系</text>

  <line x1="600" y1="445" x2="600" y2="505" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label map-label" x="626" y="483">内模式映像</text>

  <rect class="layer" x="80" y="505" width="1040" height="145" rx="22" fill="url(#internal)"/>
  <text class="label layer-title" x="112" y="548">内模式</text>
  <text class="label layer-note" x="112" y="578">DBMS 管理的逻辑与物理存储结构</text>
  <rect class="box" x="430" y="531" width="250" height="86" rx="14"/>
  <text class="label box-title" x="555" y="567" text-anchor="middle">存储文件</text>
  <text class="label box-note" x="555" y="594" text-anchor="middle">一个或多个表的内部组织</text>
  <rect class="box" x="710" y="531" width="250" height="86" rx="14"/>
  <text class="label box-title" x="835" y="567" text-anchor="middle">索引与物理结构</text>
  <text class="label box-note" x="835" y="594" text-anchor="middle">DBMS 管理；优化器选择路径</text>

  <rect x="95" y="8" width="220" height="34" rx="17" fill="#263c4d"/>
  <text class="label" x="205" y="31" text-anchor="middle" font-size="17" fill="#ffffff">用户 / 应用通过 SQL 使用</text>
</svg>
