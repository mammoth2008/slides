<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL 概述 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"SQL 概述","children":[{"content":"3.1.1 SQL 的产生与发展","children":[{"content":"早期来源：SEQUEL 在 System R 上实现，后来改名为 SQL","children":[]},{"content":"标准化：ANSI 与 ISO 形成共同语言基础","children":[]},{"content":"实现边界：标准子集与厂商扩展","children":[]}]},{"content":"3.1.2 SQL 的主要特点","children":[{"content":"功能综合：定义、查询、操纵与控制","children":[]},{"content":"非过程化：说明要什么，不指定怎么找","children":[]},{"content":"面向集合：一次处理一组元组","children":[]},{"content":"使用方式：交互式 SQL、API/驱动调用与嵌入式 SQL","children":[]},{"content":"简洁易学：CREATE、SELECT、INSERT 等核心动词","children":[]}]},{"content":"3.1.3 SQL 的基本概念","children":[{"content":"三级模式：外模式、模式与内模式对应关系","children":[]},{"content":"基本表：模式中的逻辑关系对象","children":[]},{"content":"普通视图：由基本表或其他视图导出的虚表，只保存定义","children":[]},{"content":"逻辑/物理边界：基本表是逻辑对象，存储文件和索引属于内模式","children":[]},{"content":"后续 SQL 功能路线","children":[{"content":"3.2 数据定义","children":[]},{"content":"3.3 数据查询","children":[]},{"content":"3.4 数据更新","children":[]},{"content":"3.5 空值","children":[]},{"content":"3.6 视图","children":[]}]}]}]};

    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>

</html>
