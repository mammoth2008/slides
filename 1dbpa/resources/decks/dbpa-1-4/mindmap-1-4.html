<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据库系统的组成 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"数据库系统的组成","children":[{"content":"1.4.1 组成与硬件平台","children":[{"content":"组成公式：DBS = DB + DBMS + APP + Platform + DBA + Users","children":[]},{"content":"Platform：硬件 + 软件，支撑数据库系统运行","children":[]},{"content":"硬件平台：处理器、内存与持久存储","children":[]},{"content":"硬件边界：硬件资源不等于数据库管理","children":[]}]},{"content":"1.4.2 软件平台与查询流程","children":[{"content":"操作系统：提供进程、文件、内存和设备等基础运行环境","children":[]},{"content":"DBMS：定义、组织、存储、操纵、控制和维护数据库","children":[]},{"content":"开发与应用：开发工具支持编写、调试和部署，应用系统实现业务功能","children":[]},{"content":"查询流程：用户 → 应用系统 → DBMS → 数据库，操作系统和硬件提供支撑","children":[]},{"content":"三级模式映像：外模式 → 映像 → 模式 → 映像 → 内模式","children":[]}]},{"content":"1.4.3 人员、职责与生命周期","children":[{"content":"DBA：设计定义、用户支持、运行控制、性能改进、转储恢复与系统重构","children":[]},{"content":"分析与设计：系统分析员澄清需求，数据库设计员参与各级模式设计","children":[]},{"content":"应用程序员：依据外模式开发应用程序","children":[]},{"content":"最终用户：使用系统、提出需求并反馈与检验","children":[]},{"content":"生命周期：需求分析 → 模式与运行方案 → 外模式与应用开发 → 上线运行与反馈 → 性能、恢复与重构","children":[]},{"content":"结构边界：1.3 讲模式与映像，1.4 讲组成与协作，1.5 讲部署与连接","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
