<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">E-R 图转换为关系模式</title>
  <desc id="desc">学生和教学班实体形成各自关系，多对多的选课联系形成独立关系，联系属性成绩进入选课关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#71849a" flood-opacity="0.13"/>
    </filter>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .title { font-size: 31px; font-weight: 700; }
      .note { font-size: 18px; fill: #60758a; }
      .box-title { font-size: 25px; font-weight: 700; }
      .small-title { font-size: 20px; font-weight: 650; }
      .small { font-size: 17px; fill: #60758a; }
      .code { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 18px; fill: #25364a; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#fbfcfe"/>
  <text class="label title" x="64" y="62">E-R 图转换为关系模式时，实体和联系要各有落点</text>
  <text class="label note" x="64" y="98">m:n 联系不能丢掉；联系属性随联系进入独立关系</text>

  <rect x="62" y="160" width="360" height="420" rx="24" fill="#eef8ed" stroke="#7890a5" stroke-width="2"/>
  <text class="label box-title" x="242" y="208" text-anchor="middle">基本 E-R 图</text>
  <rect x="92" y="280" width="130" height="100" rx="18" fill="#e8f3ff" stroke="#7890a5" stroke-width="2"/>
  <text class="label small-title" x="157" y="322" text-anchor="middle">学生</text>
  <text class="label small" x="157" y="355" text-anchor="middle">学号</text>
  <polygon points="286,270 348,330 286,390 224,330" fill="#fff1dc" stroke="#7890a5" stroke-width="2"/>
  <text class="label small-title" x="286" y="337" text-anchor="middle">选课</text>
  <rect x="350" y="280" width="52" height="100" rx="14" fill="#f0eaff" stroke="#7890a5" stroke-width="2"/>
  <text class="label small-title" x="376" y="337" text-anchor="middle">班</text>
  <line x1="222" y1="330" x2="224" y2="330" stroke="#60758a" stroke-width="2"/>
  <line x1="348" y1="330" x2="350" y2="330" stroke="#60758a" stroke-width="2"/>
  <ellipse cx="286" cy="472" rx="112" ry="46" fill="#ffffff" stroke="#7890a5" stroke-width="2"/>
  <text class="label small-title" x="286" y="480" text-anchor="middle">成绩</text>
  <line x1="286" y1="390" x2="286" y2="426" stroke="#60758a" stroke-width="2"/>
  <text class="label note" x="242" y="548" text-anchor="middle">m:n 联系带联系属性</text>

  <line x1="442" y1="290" x2="570" y2="290" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="442" y1="380" x2="570" y2="380" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="442" y1="472" x2="570" y2="472" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="590" y="150" width="548" height="128" rx="20" fill="#e8f3ff" stroke="#7890a5" stroke-width="2"/>
    <rect x="590" y="310" width="548" height="128" rx="20" fill="#eef8ed" stroke="#7890a5" stroke-width="2"/>
    <rect x="590" y="470" width="548" height="128" rx="20" fill="#fff1dc" stroke="#7890a5" stroke-width="2"/>
  </g>
  <text class="label box-title" x="630" y="198">Student</text>
  <text class="label code" x="630" y="239">学号, 姓名, 性别, 所在学院</text>
  <text class="label small" x="1088" y="198" text-anchor="end">实体型 → 关系</text>
  <text class="label box-title" x="630" y="358">TeachingClass</text>
  <text class="label code" x="630" y="399">教学班号, 课程号, 开课学期</text>
  <text class="label small" x="1088" y="358" text-anchor="end">实体型 → 关系</text>
  <text class="label box-title" x="630" y="518">Select</text>
  <text class="label code" x="630" y="559">学号, 教学班号, 成绩</text>
  <text class="label small" x="1088" y="518" text-anchor="end">m:n 联系 → 独立关系</text>

  <rect x="270" y="630" width="660" height="46" rx="14" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text class="label note" x="600" y="660" text-anchor="middle">1:n 联系常把 1 端主码并入 n 端作为外码，仍要检查参与约束</text>
</svg>
