<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据库系统的体系结构 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"数据库系统的体系结构","children":[{"content":"1.5.1 体系结构的观察角度","children":[{"content":"判断方法：看组件放在哪里、请求怎样走、一个任务是否拆开、数据是否跨节点、数据库是否按服务获得","children":[]},{"content":"1.3：数据库内部的三级模式与两级映像","children":[]},{"content":"1.4：数据库系统的组成、平台与人员","children":[]},{"content":"1.5：组件部署、通信与协作","children":[]}]},{"content":"1.5.2 集中式与客户—服务器","children":[{"content":"集中式：应用、DBMS 和数据库集中在一台计算机","children":[]},{"content":"C/S：客户端与服务器协作，客户端不等于浏览器","children":[]},{"content":"两层 C/S：客户端请求服务器上的 DBMS 与数据库","children":[]},{"content":"B/S：浏览器作为客户端，三层是常见部署","children":[]},{"content":"取舍：C/S 交互直接；B/S 便于统一部署但增加应用层和网络往返","children":[]}]},{"content":"1.5.3 并行数据库系统","children":[{"content":"一个任务由多个处理单元同时处理","children":[]},{"content":"共享内存、共享磁盘、非共享和混合结构","children":[]},{"content":"并行关注任务处理，不等于节点自治","children":[]}]},{"content":"1.5.4 分布式数据库系统","children":[{"content":"逻辑上一个数据库，物理上多个网络节点","children":[]},{"content":"场地自治、局部应用和全局应用","children":[]}]},{"content":"1.5.5 云数据库系统","children":[{"content":"在云环境部署或虚拟化，以网络服务提供存储、更新、查询和事务能力","children":[]},{"content":"考试周可增加资源，但数据、权限、安全、网络和成本仍需有人管理","children":[]},{"content":"判断方法：看组件位置、请求路径、任务是否并行、数据是否跨节点、数据库是否按服务获得","children":[]},{"content":"叠加关系：云数据库可以同时采用并行和分布式技术","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
