<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Student、Course 与 SC 的主码和外码联系</title>
  <desc id="desc">Student 和 Course 提供主码，SC 用 Sno 和 Cno 作为外码引用它们；SC 的组合主码同时保证一名学生不能重复选同一门课程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#71849a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="#fbfcfe"/>
  <text x="72" y="80" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700">主码识别对象，外码连接对象</text>
  <text x="74" y="122" fill="#60758a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">SC 中的一条选课记录，必须能找到真实的学生和课程</text>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="74" y="194" width="290" height="230" rx="22" fill="#e8f3ff" stroke="#7890a5" stroke-width="2"/>
    <rect x="836" y="194" width="290" height="230" rx="22" fill="#e8f3ff" stroke="#7890a5" stroke-width="2"/>
    <rect x="392" y="176" width="416" height="266" rx="24" fill="#fff1dc" stroke="#7890a5" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#60758a" stroke-width="4" marker-end="url(#arrow)">
    <path d="M364 292 C380 292 378 244 392 244"/>
    <path d="M836 292 C820 292 822 244 808 244"/>
  </g>

  <g fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="219" y="246" text-anchor="middle" font-size="30" font-weight="700">Student</text>
    <text x="104" y="294" font-size="21">PK  Sno</text>
    <text x="104" y="334" font-size="19">Sname　Ssex　Smajor</text>
    <text x="104" y="382" font-size="18" fill="#60758a">主码：唯一且非空</text>

    <text x="981" y="246" text-anchor="middle" font-size="30" font-weight="700">Course</text>
    <text x="866" y="294" font-size="21">PK  Cno</text>
    <text x="866" y="334" font-size="19">Cname　Credit</text>
    <text x="866" y="382" font-size="18" fill="#60758a">主码：唯一且非空</text>

    <text x="600" y="232" text-anchor="middle" font-size="30" font-weight="700">SC</text>
    <text x="432" y="282" font-size="21">PK  (Sno, Cno)</text>
    <text x="432" y="322" font-size="21">FK  Sno → Student.Sno</text>
    <text x="432" y="362" font-size="21">FK  Cno → Course.Cno</text>
    <text x="432" y="407" font-size="18" fill="#60758a">同一学生不能重复选同一门课程</text>
  </g>

  <rect x="154" y="540" width="892" height="78" rx="18" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text x="600" y="588" text-anchor="middle" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600">外码值必须找到被参照主码；允许 NULL 时，NULL 表示暂时没有引用</text>
</svg>
