<!doctype html>

<head>

  <link rel="stylesheet" href="../../theme/fonts.css">

  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"数据库完整性与约束","children":[{"content":"5.1 · 先区分权限与数据规则","children":[{"content":"授权回答教师能否执行 UPDATE；完整性回答 130 分能否写入","children":[]}]},{"content":"5.2 · 元组身份冲突","children":[{"content":"主码属性非空＋组合值唯一 → 拒绝重复或不可识别元组","children":[]}]},{"content":"5.3 · 两表引用失效","children":[{"content":"外码变化或主码变化 → 找对应引用 → 拒绝／级联／置空及其前提","children":[]}]},{"content":"5.4 · 业务取值不合规","children":[{"content":"<code>NOT NULL<\/code>／<code>UNIQUE<\/code>／<code>CHECK<\/code> → TRUE、FALSE、UNKNOWN → 接受或拒绝","children":[]}]},{"content":"5.5-5.6 · 修改或复用规则","children":[{"content":"命名约束 → 检查旧数据与依赖 → 产品语法；域／ASSERTION → 核查支持","children":[]}]}]};
