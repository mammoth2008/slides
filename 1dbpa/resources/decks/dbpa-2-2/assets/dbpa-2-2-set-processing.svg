<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">关系的成组处理</title>
  <desc id="desc">多行关系输入经过一次成组操作，产生多行关系结果</desc>
  <rect width="1280" height="720" fill="#f7f4ed"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" fill="#243746" text-anchor="middle">
    <text x="210" y="70" font-size="32" font-weight="700">关系输入</text>
    <text x="210" y="106" font-size="22" fill="#647782">多行元组</text>
    <rect x="55" y="142" width="310" height="390" rx="20" fill="#e4edf1" stroke="#273847" stroke-width="5"/>
    <g stroke="#273847" stroke-width="3"><path d="M55 222h310M55 302h310M55 382h310M55 462h310M165 142v390M265 142v390"/></g>
    <g fill="#d7e7eb"><rect x="70" y="158" width="80" height="46" rx="8"/><rect x="180" y="158" width="70" height="46" rx="8"/><rect x="280" y="158" width="70" height="46" rx="8"/></g>
    <g font-size="21" font-weight="700"><text x="110" y="188">Sno</text><text x="215" y="188">Cno</text><text x="315" y="188">Grade</text></g>
    <g font-size="22"><text x="110" y="270">001</text><text x="215" y="270">81001</text><text x="315" y="270">85</text><text x="110" y="350">002</text><text x="215" y="350">81002</text><text x="315" y="350">90</text><text x="110" y="430">003</text><text x="215" y="430">81002</text><text x="315" y="430">78</text><text x="110" y="510">…</text><text x="215" y="510">…</text><text x="315" y="510">…</text></g>
    <g fill="#a8542b" font-size="25" font-weight="700"><text x="640" y="218">一次处理一组元组</text><text x="640" y="498">不是逐条拼接中间状态</text></g>
    <path d="M400 337H870" stroke="#a8542b" stroke-width="7" stroke-linecap="round"/><path d="m844 310 42 27-42 27" fill="none" stroke="#a8542b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1050" y="70" font-size="32" font-weight="700">关系结果</text>
    <text x="1050" y="106" font-size="22" fill="#647782">仍然是多行元组</text>
    <rect x="895" y="142" width="330" height="390" rx="20" fill="#fffdf8" stroke="#5d9aa2" stroke-width="5"/>
    <g stroke="#273847" stroke-width="3"><path d="M895 222h330M895 302h330M895 382h330M895 462h330M1015 142v390M1120 142v390"/></g>
    <g fill="#dcefeb"><rect x="910" y="158" width="90" height="46" rx="8"/><rect x="1030" y="158" width="75" height="46" rx="8"/><rect x="1135" y="158" width="75" height="46" rx="8"/></g>
    <g font-size="21" font-weight="700"><text x="955" y="188">Sno</text><text x="1067" y="188">Cno</text><text x="1172" y="188">Grade</text></g>
    <g font-size="22"><text x="955" y="270">002</text><text x="1067" y="270">81002</text><text x="1172" y="270">90</text><text x="955" y="350">003</text><text x="1067" y="350">81002</text><text x="1172" y="350">78</text><text x="955" y="430">…</text><text x="1067" y="430">…</text><text x="1172" y="430">…</text></g>
    <text x="640" y="622" font-size="24" fill="#243746">输入、结果和中间结果都可以是关系</text>
  </g>
</svg>
