<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>触发器 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
  <link rel="stylesheet" href="../../theme/mindmap.css">
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"触发器","children":[{"content":"5.7.1 · 先把规则写完整","children":[{"content":"事件＋条件＋动作 → BEFORE／AFTER → ROW／STATEMENT → OLD／NEW 或变化集合","children":[]},{"content":"需要单行事实还是集合事实 → 再核查目标 DBMS 的条件与粒度语法","children":[]}]},{"content":"5.7.2 · 再画实际会执行什么","children":[{"content":"原始 SQL → 写 SC_U → 写 AuditLog → 检查顺序、失败、回滚、循环和执行次数","children":[]}]},{"content":"5.7.3 · 删除前后检查","children":[{"content":"找哪些业务依赖它、谁有权限删除 → 停用或删除 → 检查残留表、日志和调用方","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
