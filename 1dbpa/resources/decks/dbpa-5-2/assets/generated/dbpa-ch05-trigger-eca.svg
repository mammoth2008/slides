<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">触发器把事件、条件和动作连接成自动执行流程</title>
  <desc id="desc">目标表发生插入、更新或删除事件后，触发器判断条件；条件成立时执行动作体，记录变化、修正新值或联动其他表。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#71849a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="#fbfcfe"/>
  <text x="72" y="80" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700">触发器把“发生了什么”变成自动动作</text>
  <text x="74" y="122" fill="#60758a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">事件出现时，数据库服务器自动判断条件并执行动作体</text>

  <g filter="url(#shadow)">
    <rect x="74" y="216" width="280" height="210" rx="22" fill="#e8f3ff" stroke="#7890a5" stroke-width="2"/>
    <rect x="460" y="216" width="280" height="210" rx="22" fill="#fff1dc" stroke="#7890a5" stroke-width="2"/>
    <rect x="846" y="216" width="280" height="210" rx="22" fill="#eef8ed" stroke="#7890a5" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#60758a" stroke-width="4" marker-end="url(#arrow)">
    <path d="M354 321 H450"/>
    <path d="M740 321 H836"/>
  </g>

  <g fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="214" y="274" font-size="30" font-weight="700">事件 Event</text>
    <text x="214" y="320" font-size="21">INSERT / UPDATE / DELETE</text>
    <text x="214" y="362" font-size="19" fill="#60758a">目标表发生变化</text>

    <text x="600" y="274" font-size="30" font-weight="700">条件 Condition</text>
    <text x="600" y="320" font-size="21">WHEN 或动作体中的 IF</text>
    <text x="600" y="362" font-size="19" fill="#60758a">条件为真才继续</text>

    <text x="986" y="274" font-size="30" font-weight="700">动作 Action</text>
    <text x="986" y="320" font-size="21">记录、修正、联动</text>
    <text x="986" y="362" font-size="19" fill="#60758a">隐式执行并产生副作用</text>
  </g>

  <rect x="192" y="540" width="816" height="78" rx="18" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text x="600" y="588" text-anchor="middle" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600">先确定事件、时机和粒度，再决定动作是否值得隐藏在数据库里</text>
</svg>
