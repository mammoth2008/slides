<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">B+ 树的平衡路径与叶结点链</title>
  <desc id="desc">根结点和中间结点按键值选择子树，所有叶结点在同一层并通过兄弟指针形成有序链。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7890a5"/>
    </marker>
    <style>
      .bg { fill: #fbfcfe; }
      .root { fill: #f0eaff; stroke: #8d7bb8; stroke-width: 2; rx: 14; }
      .internal { fill: #e8f3ff; stroke: #7890a5; stroke-width: 2; rx: 14; }
      .leaf { fill: #eef8ed; stroke: #7890a5; stroke-width: 2; rx: 14; }
      .range { fill: #fff1dc; stroke: #d49a61; stroke-width: 3; rx: 14; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; text-anchor: middle; }
      .text { font: 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; text-anchor: middle; }
      .small { font: 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .arrow { stroke: #7890a5; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .chain { stroke: #d49a61; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="62">B+ 树让根到叶的路径保持平衡，叶层再提供顺序入口</text>

  <rect class="root" x="480" y="115" width="240" height="78"/>
  <text class="label" x="600" y="147">根结点</text>
  <text class="text" x="600" y="173">20180008 ｜ 20180012</text>

  <rect class="internal" x="220" y="275" width="230" height="78"/>
  <rect class="internal" x="485" y="275" width="230" height="78"/>
  <rect class="internal" x="750" y="275" width="230" height="78"/>
  <text class="label" x="335" y="307">中间结点</text>
  <text class="text" x="335" y="333">选择左侧子树</text>
  <text class="label" x="600" y="307">中间结点</text>
  <text class="text" x="600" y="333">选择中间子树</text>
  <text class="label" x="865" y="307">中间结点</text>
  <text class="text" x="865" y="333">选择右侧子树</text>

  <path class="arrow" d="M525 193 L370 270"/><path class="arrow" d="M600 193 V270"/><path class="arrow" d="M675 193 L850 270"/>

  <rect class="leaf" x="80" y="455" width="240" height="90"/>
  <rect class="range" x="345" y="455" width="240" height="90"/>
  <rect class="range" x="610" y="455" width="240" height="90"/>
  <rect class="leaf" x="875" y="455" width="240" height="90"/>
  <text class="label" x="200" y="490">叶结点 1</text>
  <text class="text" x="200" y="520">01 03 05 07</text>
  <text class="label" x="465" y="490">叶结点 2</text>
  <text class="text" x="465" y="520">08 10 11 12</text>
  <text class="label" x="730" y="490">叶结点 3</text>
  <text class="text" x="730" y="520">13 14 15 16</text>
  <text class="label" x="995" y="490">叶结点 4</text>
  <text class="text" x="995" y="520">17 19 21 24</text>
  <path class="arrow" d="M335 353 L210 450"/><path class="arrow" d="M335 353 L465 450"/>
  <path class="arrow" d="M600 353 L465 450"/><path class="arrow" d="M600 353 L730 450"/>
  <path class="arrow" d="M865 353 L730 450"/><path class="arrow" d="M865 353 L995 450"/>

  <path class="chain" d="M320 500 H340"/><path class="chain" d="M585 500 H605"/><path class="chain" d="M850 500 H870"/>
  <text class="small" x="80" y="620">查找 20180011：根 → 中间结点 → 叶结点 2</text>
  <text class="small" x="640" y="620">查找 Sno ≥ 20180011：进入叶结点 2，沿叶链继续扫描</text>
</svg>
