<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
<title id="t">两层B+树：一个父结点与四个有序叶结点</title>
<desc id="d">根R含05、09、13，四个孩子分别是L1键01至04，L2键05至08，L3键09至12，L4键13至16。每个孩子只有一个父指针来源。叶链向右连接，L4到空指针。每个叶项另带基本表记录指针。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#a82920"/></marker></defs>
<rect width="1200" height="480" fill="#fffefa"/>
<g stroke="#292929" stroke-width="2" fill="#f0eee8"><rect x="430" y="25" width="340" height="95"/><rect x="20" y="250" width="260" height="110"/><rect x="320" y="250" width="260" height="110"/><rect x="620" y="250" width="260" height="110" fill="#f6e7e3"/><rect x="920" y="250" width="260" height="110"/></g>
<g font-family="PingFang SC, sans-serif" font-size="27" text-anchor="middle" fill="#222"><text x="600" y="60">根 R</text><text x="600" y="98" font-size="32">05 ｜ 09 ｜ 13</text><text x="150" y="287">叶 L1</text><text x="450" y="287">叶 L2</text><text x="750" y="287">叶 L3</text><text x="1050" y="287">叶 L4</text><text x="150" y="333">01 02 03 04</text><text x="450" y="333">05 06 07 08</text><text x="750" y="333">09 10 11 12</text><text x="1050" y="333">13 14 15 16</text></g>
<g fill="none" stroke="#a82920" stroke-width="3" marker-end="url(#a)"><path d="M460 120 L150 245"/><path d="M550 120 L450 245"/><path d="M650 120 L750 245"/><path d="M740 120 L1050 245"/><path d="M280 310 H315"/><path d="M580 310 H615"/><path d="M880 310 H915"/></g>
<g font-family="PingFang SC, sans-serif" font-size="24" fill="#222" text-anchor="middle"><text x="200" y="183">k &lt; 05</text><text x="400" y="207">05 ≤ k &lt; 09</text><text x="800" y="207">09 ≤ k &lt; 13</text><text x="1030" y="183">k ≥ 13</text><text x="600" y="418">横向箭头是叶链；每个叶项另带记录指针，最后一叶的后继为空</text></g>
</svg>
