<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">数据更新的四个判断问题</title>
  <desc id="desc">每次插入、修改或删除都要确认作用表、受影响元组、变化内容或新值来源和完整性约束。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60758a"/></marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e2d3b; }
      .title { font-size: 30px; font-weight: 700; }
      .note { font-size: 18px; fill: #536979; }
      .box { stroke: #7890a5; stroke-width: 2; }
      .blue { fill: #e8f3ff; } .green { fill: #eef8ed; } .orange { fill: #fff1dc; } .purple { fill: #f0eaff; }
      .box-title { font-size: 24px; font-weight: 700; }
      .small { font-size: 17px; fill: #536979; }
      .map { font-size: 17px; font-weight: 650; fill: #536979; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#fbfcfe"/>
  <text class="label title" x="65" y="62">三类更新共用一条判断路径</text>
  <text class="label note" x="65" y="94">动词不同，先确认对象和影响范围，再让 DBMS 检查约束</text>

  <rect class="box blue" x="80" y="160" width="220" height="145" rx="20"/>
  <text class="label box-title" x="190" y="207" text-anchor="middle">作用于哪张表</text>
  <text class="label small" x="190" y="250" text-anchor="middle">Student、SC 或汇总表</text>
  <line x1="300" y1="232" x2="365" y2="232" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box green" x="365" y="160" width="220" height="145" rx="20"/>
  <text class="label box-title" x="475" y="207" text-anchor="middle">哪些元组受影响</text>
  <text class="label small" x="475" y="250" text-anchor="middle">主码、WHERE 或子查询</text>
  <line x1="585" y1="232" x2="650" y2="232" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box orange" x="650" y="160" width="220" height="145" rx="20"/>
  <text class="label box-title" x="760" y="207" text-anchor="middle">变化内容或新值</text>
  <text class="label small" x="760" y="250" text-anchor="middle">VALUES、SET 表达式或 SELECT</text>
  <line x1="870" y1="232" x2="935" y2="232" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box purple" x="935" y="160" width="190" height="145" rx="20"/>
  <text class="label box-title" x="1030" y="207" text-anchor="middle">约束能否保持</text>
  <text class="label small" x="1030" y="250" text-anchor="middle">主码、非空、外码</text>

  <rect class="box" x="170" y="410" width="860" height="150" rx="22" fill="#ffffff"/>
  <text class="label box-title" x="600" y="458" text-anchor="middle">更新操作</text>
  <text class="label small" x="600" y="503" text-anchor="middle">INSERT 增加元组　｜　UPDATE 改变列值　｜　DELETE 移除元组</text>
  <text class="label small" x="600" y="535" text-anchor="middle">DELETE 不产生新值；三类操作都要检查约束结果</text>
</svg>
