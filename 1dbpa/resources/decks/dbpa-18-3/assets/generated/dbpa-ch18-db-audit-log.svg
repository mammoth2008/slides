<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">关系数据库与链式操作日志的分层融合</title>
  <desc id="desc">关系数据库保存当前业务状态、表、索引和事务；链式日志保存操作摘要、时间和签名，形成可验证审计证据。链式日志不是业务表本身，按时间点回溯还需要完整事件、提交绑定、同步和恢复策略。</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #f7f9fc; stroke: #c8d3df; stroke-width: 2; rx: 16; }
      .app { fill: #eef2f8; stroke: #b7c7d8; stroke-width: 2; rx: 12; }
      .db { fill: #eaf3fb; stroke: #a7c5df; stroke-width: 2; rx: 12; }
      .log { fill: #eaf4ef; stroke: #a9cbb9; stroke-width: 2; rx: 12; }
      .audit { fill: #fff1dc; stroke: #e0bc8d; stroke-width: 2; rx: 12; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .text { font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .hash { font: 700 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #50647a; }
      .arrow { stroke: #71869a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .line { stroke: #9aabba; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#71869a"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="58">把高效查询与可信证据放在不同的数据层</text>
  <rect class="panel" x="40" y="95" width="1120" height="470"/>
  <rect class="app" x="75" y="260" width="180" height="105"/><text class="label" x="125" y="302">业务应用</text><text class="text" x="108" y="336">增删改查与审计</text>
  <rect class="db" x="365" y="160" width="255" height="170"/><text class="label" x="458" y="207">关系数据库</text><text class="text" x="425" y="247">业务表、索引、SQL</text><text class="small" x="420" y="283">当前状态与复杂查询</text>
  <rect class="log" x="365" y="400" width="255" height="120"/><text class="label" x="440" y="445">链式操作日志</text><text class="text" x="405" y="480">操作摘要、时间、签名证据</text>
  <path class="arrow" d="M255 295 H355"/><path class="arrow" d="M300 330 C315 405 330 455 355 455"/>
  <rect class="audit" x="755" y="160" width="285" height="170"/><text class="label" x="840" y="207">查询与更新</text><text class="text" x="815" y="247">SQL、索引、事务并发</text><text class="small" x="810" y="283">高效管理当前数据</text>
  <rect class="audit" x="755" y="400" width="285" height="120"/><text class="label" x="820" y="445">可验证审计证据</text><text class="text" x="798" y="480">校验谁在何时提交了什么</text>
  <path class="arrow" d="M620 245 H745"/><path class="arrow" d="M620 455 H745"/>
  <path class="line" d="M620 455 C660 440 680 325 745 245"/>
  <rect class="panel" x="75" y="610" width="965" height="58"/>
  <text class="label" x="105" y="648">融合边界</text>
  <text class="text" x="300" y="648">关系库负责业务状态，链式日志负责操作证据；事务绑定、同步和恢复策略仍需设计</text>
</svg>
