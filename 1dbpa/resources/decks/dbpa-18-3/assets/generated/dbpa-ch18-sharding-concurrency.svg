<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">数据库技术按瓶颈组合进入区块链</title>
  <desc id="desc">分片、并发执行、索引和 Bloom Filter 是可组合的示意方向：分片可能缓解局部处理压力，并发利用多核，索引和 Bloom Filter 减少扫描；跨片事务、一致验证、确定性执行和命中验证仍不可省略。</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #f7f9fc; stroke: #c8d3df; stroke-width: 2; rx: 16; }
      .source { fill: #eef2f8; stroke: #b7c7d8; stroke-width: 2; rx: 12; }
      .shard-a { fill: #eaf3fb; stroke: #a7c5df; stroke-width: 2; rx: 12; }
      .shard-b { fill: #eaf4ef; stroke: #a9cbb9; stroke-width: 2; rx: 12; }
      .shard-c { fill: #eeeafa; stroke: #b7a9d8; stroke-width: 2; rx: 12; }
      .tool { fill: #fff1dc; stroke: #e0bc8d; stroke-width: 2; rx: 12; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .text { font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .arrow { stroke: #71869a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .line { stroke: #b7c7d8; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#71869a"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="58">分片把一个全网处理问题拆成多个局部处理问题</text>
  <rect class="panel" x="40" y="95" width="1120" height="475"/>
  <rect class="source" x="75" y="255" width="185" height="105"/><text class="label" x="125" y="297">交易流</text><text class="text" x="104" y="331">不同账户与业务</text>
  <rect class="shard-a" x="370" y="145" width="220" height="115"/><text class="label" x="455" y="190">分片 A</text><text class="text" x="416" y="226">局部处理与验证（示意）</text>
  <rect class="shard-b" x="370" y="290" width="220" height="115"/><text class="label" x="455" y="335">分片 B</text><text class="text" x="416" y="371">局部处理与验证（示意）</text>
  <rect class="shard-c" x="370" y="435" width="220" height="115"/><text class="label" x="455" y="480">分片 C</text><text class="text" x="416" y="516">局部处理与验证（示意）</text>
  <path class="arrow" d="M260 307 H360"/>
  <path class="line" d="M305 307 C315 245 330 190 360 200"/><path class="line" d="M305 307 C315 370 330 505 360 490"/>
  <rect class="tool" x="690" y="170" width="230" height="100"/><text class="label" x="748" y="210">并发执行</text><text class="text" x="724" y="244">无冲突事务可并行</text>
  <rect class="tool" x="690" y="315" width="230" height="100"/><text class="label" x="744" y="355">索引</text><text class="text" x="720" y="389">快速定位交易区块</text>
  <rect class="tool" x="690" y="460" width="230" height="80"/><text class="label" x="750" y="495">Bloom Filter</text><text class="small" x="706" y="520">排除不可能命中；命中仍需验证</text>
  <path class="arrow" d="M590 202 H680"/><path class="arrow" d="M590 347 H680"/><path class="arrow" d="M590 492 H680"/>
  <rect class="panel" x="965" y="170" width="150" height="370"/>
  <text class="label" x="1000" y="215">代价</text>
  <text class="text" x="990" y="260">跨片事务</text><text class="text" x="990" y="294">仍需协调</text>
  <path class="line" d="M990 330 H1090"/>
  <text class="text" x="990" y="372">每片的</text><text class="text" x="990" y="406">安全与一致性</text><text class="text" x="990" y="440">不能被省略</text>
  <text class="small" x="75" y="625">数据库技术提供可组合的分片、并发与索引方向，但区块链仍要维持跨片协调、跨节点验证和确定性执行</text>
</svg>
