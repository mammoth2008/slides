<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">多值依赖造成教师与参考书的组合冗余</title>
  <desc id="desc">课程 C1 有两名教师和两本参考书时，Teaching 关系需要四个组合元组；把教师和参考书拆成两个关系后，各自只记录一次。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#71849a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="#fbfcfe"/>
  <text x="72" y="78" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700">独立集合被放进一张表，就会形成笛卡尔组合</text>
  <text x="74" y="120" fill="#60758a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">C1 的教师和参考书彼此独立：2 名教师 × 2 本书 = 4 行组合</text>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="64" y="184" width="420" height="286" rx="22" fill="#fff1dc" stroke="#7890a5" stroke-width="2"/>
    <rect x="744" y="176" width="198" height="150" rx="20" fill="#e8f3ff" stroke="#7890a5" stroke-width="2"/>
    <rect x="978" y="176" width="198" height="150" rx="20" fill="#eef8ed" stroke="#7890a5" stroke-width="2"/>
  </g>

  <path d="M484 327 H724" fill="none" stroke="#60758a" stroke-width="4" marker-end="url(#arrow)"/>

  <g fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="274" y="228" text-anchor="middle" font-size="28" font-weight="700">Teaching(Course, Teacher, Book)</text>
    <text x="98" y="278" font-size="20">C1　张老师　数据库系统</text>
    <text x="98" y="316" font-size="20">C1　张老师　操作系统</text>
    <text x="98" y="354" font-size="20">C1　李老师　数据库系统</text>
    <text x="98" y="392" font-size="20">C1　李老师　操作系统</text>
    <text x="98" y="438" font-size="18" fill="#60758a">增加一个教师或一本书，都要复制组合</text>

    <text x="843" y="216" text-anchor="middle" font-size="25" font-weight="700">CourseTeacher</text>
    <text x="770" y="262" font-size="19">C1　张老师</text>
    <text x="770" y="294" font-size="19">C1　李老师</text>

    <text x="1077" y="216" text-anchor="middle" font-size="25" font-weight="700">CourseBook</text>
    <text x="1004" y="262" font-size="19">C1　数据库系统</text>
    <text x="1004" y="294" font-size="19">C1　操作系统</text>
  </g>

  <rect x="228" y="548" width="744" height="76" rx="18" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text x="600" y="596" text-anchor="middle" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600">4NF 把两个独立集合拆开，避免无意义的组合冗余</text>
</svg>
