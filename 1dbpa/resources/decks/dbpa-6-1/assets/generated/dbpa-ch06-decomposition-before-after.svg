<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">从混合事实的大关系分解为三个关系</title>
  <desc id="desc">包含学生、学院、院长、课程和成绩的大关系被分解为学生所属学院、学生选课成绩、学院院长三个关系，每条事实只在一个地方维护。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#71849a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="#fbfcfe"/>
  <text x="72" y="78" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700">把混合事实分开，每条事实只维护一处</text>
  <text x="74" y="120" fill="#60758a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">规范化不是删数据，而是按函数依赖重新安排属性</text>

  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="60" y="190" width="344" height="250" rx="22" fill="#fff1dc" stroke="#7890a5" stroke-width="2"/>
    <rect x="650" y="168" width="230" height="126" rx="20" fill="#e8f3ff" stroke="#7890a5" stroke-width="2"/>
    <rect x="914" y="168" width="230" height="126" rx="20" fill="#eef8ed" stroke="#7890a5" stroke-width="2"/>
    <rect x="650" y="342" width="230" height="126" rx="20" fill="#f0eaff" stroke="#7890a5" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#60758a" stroke-width="4" marker-end="url(#arrow)">
    <path d="M404 274 C496 274 534 230 640 230"/>
    <path d="M404 316 C512 316 540 230 640 230"/>
    <path d="M404 358 C528 358 546 405 640 405"/>
    <path d="M404 400 C590 400 640 405 904 405"/>
  </g>

  <g fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="232" y="236" text-anchor="middle" font-size="28" font-weight="700">Student</text>
    <text x="88" y="282" font-size="20">Sno, School, Mname</text>
    <text x="88" y="320" font-size="20">Cno, Grade</text>
    <text x="88" y="370" font-size="18" fill="#60758a">学生、学院、选课事实混在一起</text>
    <text x="88" y="406" font-size="18" fill="#60758a">院长信息随成绩行重复</text>

    <text x="765" y="211" text-anchor="middle" font-size="25" font-weight="700">S</text>
    <text x="675" y="249" font-size="18">Sno, School</text>
    <text x="675" y="275" font-size="17" fill="#60758a">学生属于哪个学院</text>

    <text x="1029" y="211" text-anchor="middle" font-size="25" font-weight="700">SCHOOL</text>
    <text x="939" y="249" font-size="18">School, Mname</text>
    <text x="939" y="275" font-size="17" fill="#60758a">学院由谁负责</text>

    <text x="765" y="385" text-anchor="middle" font-size="25" font-weight="700">SC</text>
    <text x="675" y="423" font-size="18">Sno, Cno, Grade</text>
    <text x="675" y="449" font-size="17" fill="#60758a">学生选哪门课、得多少分</text>
  </g>

  <rect x="172" y="548" width="856" height="76" rx="18" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text x="600" y="596" text-anchor="middle" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600">院长更换只改 SCHOOL；成绩变化只改 SC</text>
</svg>
