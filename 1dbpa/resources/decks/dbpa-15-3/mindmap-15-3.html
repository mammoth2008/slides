<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时序与窗口查询 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
  <link rel="stylesheet" href="../../theme/mindmap.css">
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"时序与窗口查询","children":[{"content":"序列与写入","children":[{"content":"车辆、指标、单位、事件时间","children":[]},{"content":"Point 单点、Record 多指标、Tablet 批量","children":[]},{"content":"接口原子性与重复处理","children":[]}]},{"content":"窗口与均值","children":[{"content":"左闭右开，边界 72 归 W1","children":[]},{"content":"W0 与 W1 均值均为 60","children":[]},{"content":"样本均值 60；保持假设下时间均值 61","children":[]}]},{"content":"对齐与汇聚","children":[{"content":"速度与胎压并排，缺失保留","children":[]},{"content":"前值填充须标推定与有效间隔","children":[]},{"content":"点等权约 53.33；车等权 45","children":[]}]},{"content":"迟到与修订","children":[{"content":"W0 总和 126→180，点数 2→3","children":[]},{"content":"均值 63→60，重复消息不增点数","children":[]},{"content":"10:01:30 起进入补算队列","children":[]}]},{"content":"文件与统计","children":[{"content":"数据组、数据块、数据页","children":[]},{"content":"定位、跳页、摘要与原始点","children":[]},{"content":"过滤与可见版本决定摘要适用性","children":[]}]},{"content":"压缩与保留","children":[{"content":"无损压缩可恢复原始点","children":[]},{"content":"降采样保留汇总，丢失细节","children":[]},{"content":"原始 7 天，分钟结果 30 天","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
