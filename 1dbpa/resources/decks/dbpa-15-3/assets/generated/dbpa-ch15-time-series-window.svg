<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">时序数据与时间窗口</title>
  <desc id="desc">车辆速度和胎压按时间形成两条序列，查询把连续时间划分为窗口并计算每个窗口的统计值。</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #f7f9fc; stroke: #c8d3df; stroke-width: 2; rx: 16; }
      .window-a { fill: #eef8ed; stroke: #b9d6b5; stroke-width: 2; rx: 8; }
      .window-b { fill: #fff1dc; stroke: #e0bc8d; stroke-width: 2; rx: 8; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .axis { stroke: #7890a5; stroke-width: 2; }
      .speed { stroke: #8d7bb8; stroke-width: 4; fill: none; }
      .pressure { stroke: #d49a61; stroke-width: 4; fill: none; }
      .point-speed { fill: #8d7bb8; }
      .point-pressure { fill: #d49a61; }
      .dash { stroke: #a8b8c6; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="62">同一车辆的多条序列沿时间增长，查询再按窗口汇总</text>
  <rect class="panel" x="45" y="105" width="1110" height="475"/>
  <rect class="window-a" x="115" y="155" width="270" height="320"/>
  <rect class="window-b" x="385" y="155" width="270" height="320"/>
  <rect class="window-a" x="655" y="155" width="270" height="320"/>
  <rect class="window-b" x="925" y="155" width="145" height="320"/>
  <line class="axis" x1="95" y1="475" x2="1080" y2="475"/>
  <line class="axis" x1="95" y1="145" x2="95" y2="475"/>
  <line class="dash" x1="95" y1="300" x2="1080" y2="300"/>
  <polyline class="speed" points="115,405 185,355 255,370 325,260 395,300 465,235 535,250 605,205 675,275 745,215 815,230 885,180 955,235 1025,190"/>
  <polyline class="pressure" points="115,245 185,235 255,250 325,220 395,235 465,225 535,240 605,215 675,230 745,220 815,235 885,210 955,225 1025,215"/>
  <circle class="point-speed" cx="255" cy="370" r="5"/><circle class="point-speed" cx="535" cy="250" r="5"/><circle class="point-speed" cx="815" cy="230" r="5"/><circle class="point-pressure" cx="255" cy="250" r="5"/><circle class="point-pressure" cx="535" cy="240" r="5"/><circle class="point-pressure" cx="815" cy="235" r="5"/>
  <text class="label" x="150" y="140">速度序列</text>
  <text class="text" x="245" y="510">窗口 1：平均值</text>
  <text class="text" x="515" y="510">窗口 2：平均值</text>
  <text class="text" x="785" y="510">窗口 3：平均值</text>
  <text class="text" x="997" y="505" text-anchor="middle">边界窗口</text>
  <text class="text" x="997" y="525" text-anchor="middle">按查询策略决定输出</text>
  <text class="label" x="108" y="205">胎压</text>
  <text class="text" x="95" y="535">时间戳 →</text>
  <text class="text" x="1110" y="200">按时间范围</text>
  <text class="text" x="1110" y="225">过滤原始点</text>
  <text class="text" x="1110" y="250">再做聚合</text>
  <rect class="panel" x="45" y="610" width="1110" height="58"/>
  <text class="label" x="175" y="647">输入</text>
  <text class="text" x="375" y="647">序列 ID + 时间戳 + 值</text>
  <text class="label" x="650" y="647">输出</text>
  <text class="text" x="955" y="647">每个时间窗口的统计结果</text>
</svg>
