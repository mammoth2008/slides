<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">销售数据立方体</title>
  <desc id="desc">时间、地区和商品构成立方体的三个维度，每个组合位置保存一个销售额度量。</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .cube-a { fill: #eaf3fb; stroke: #8fb3d1; stroke-width: 3; }
      .cube-b { fill: #eef8ed; stroke: #a8c79f; stroke-width: 3; }
      .cube-c { fill: #fff1dc; stroke: #d6ad78; stroke-width: 3; }
      .cell { fill: #eeeafa; stroke: #9e8bc8; stroke-width: 2; }
      .title { font: 700 29px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .text { font: 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .axis { stroke: #71869a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke: #9aabba; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#71869a"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="62">一个立方体位置 = 一组维度坐标 + 一个度量值</text>

  <polygon class="cube-a" points="280,215 560,215 760,335 480,335"/>
  <polygon class="cube-b" points="280,215 480,335 480,610 280,490"/>
  <polygon class="cube-c" points="480,335 760,335 760,610 480,610"/>
  <polygon class="cell" points="560,400 650,400 650,490 560,490"/>
  <line class="dash" x1="560" y1="400" x2="480" y2="352"/>
  <line class="dash" x1="650" y1="400" x2="570" y2="352"/>
  <line class="dash" x1="650" y1="490" x2="570" y2="442"/>
  <text class="label" x="595" y="451">销售额</text>
  <text class="text" x="366" y="192">商品种类</text>
  <text class="text" x="295" y="550">时间</text>
  <text class="text" x="775" y="470">地区</text>
  <path class="axis" d="M480 610 V675"/>
  <path class="axis" d="M760 610 L850 663"/>
  <path class="axis" d="M280 490 L190 545"/>
  <text class="text" x="425" y="700">时间、地区、商品是维度：决定坐标</text>

  <rect x="885" y="150" width="245" height="370" rx="16" fill="#f7f9fc" stroke="#c8d3df" stroke-width="2"/>
  <text class="label" x="930" y="200">读一个单元格</text>
  <text class="text" x="915" y="252">时间 = 2026 年 7 月</text>
  <text class="text" x="915" y="295">地区 = 华东</text>
  <text class="text" x="915" y="338">商品 = 空调</text>
  <path class="dash" d="M915 365 H1100"/>
  <text class="label" x="958" y="410">销售额 = 90 万</text>
  <text class="text" x="915" y="462">前面三个值是维度坐标</text>
  <text class="text" x="915" y="493">最后一个值是度量</text>
</svg>
