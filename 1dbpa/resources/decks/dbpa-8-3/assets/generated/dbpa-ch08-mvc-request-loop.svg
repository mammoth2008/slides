<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MVC 数据库请求回路</title>
  <desc id="desc">用户请求进入 Controller，经 Model 和 DAO/JDBC 访问数据库，再经 Model 和 View 返回结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7890a5"/>
    </marker>
    <style>
      .bg { fill: #fbfcfe; }
      .box { stroke: #c8d3df; stroke-width: 2; rx: 18; }
      .user { fill: #fff1dc; }
      .mvc { fill: #e8f3ff; }
      .data { fill: #eef8ed; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; text-anchor: middle; }
      .detail { font: 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; text-anchor: middle; }
      .arrow { stroke: #7890a5; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .return { stroke: #7890a5; stroke-width: 4; fill: none; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .caption { font: 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="62">一个请求如何穿过 MVC</text>

  <rect class="box user" x="45" y="260" width="160" height="120"/>
  <rect class="box mvc" x="260" y="170" width="190" height="120"/>
  <rect class="box mvc" x="505" y="170" width="190" height="120"/>
  <rect class="box data" x="750" y="170" width="190" height="120"/>
  <rect class="box data" x="995" y="170" width="160" height="120"/>
  <rect class="box mvc" x="505" y="470" width="190" height="120"/>
  <rect class="box mvc" x="260" y="470" width="190" height="120"/>

  <text class="label" x="125" y="315">用户</text>
  <text class="detail" x="125" y="346">浏览器请求</text>
  <text class="label" x="355" y="225">Controller</text>
  <text class="detail" x="355" y="257">解析请求参数</text>
  <text class="label" x="600" y="225">Model</text>
  <text class="detail" x="600" y="257">执行业务规则</text>
  <text class="label" x="845" y="225">DAO / JDBC</text>
  <text class="detail" x="845" y="257">封装数据访问</text>
  <text class="label" x="1075" y="225">DBMS</text>
  <text class="detail" x="1075" y="257">读写数据</text>
  <text class="label" x="600" y="525">Model</text>
  <text class="detail" x="600" y="557">整理业务结果</text>
  <text class="label" x="355" y="525">View</text>
  <text class="detail" x="355" y="557">呈现给用户</text>

  <path class="arrow" d="M205 320 C225 320 235 230 255 230"/>
  <path class="arrow" d="M450 230 H500"/>
  <path class="arrow" d="M695 230 H745"/>
  <path class="arrow" d="M940 230 H990"/>
  <path class="return" d="M1075 295 V405 H600 V465"/>
  <path class="return" d="M505 530 H455"/>
  <path class="return" d="M260 530 C225 530 220 370 205 350"/>

  <text class="caption" x="55" y="665">Model 保留业务规则；View 可以替换为网页、接口或其他呈现方式</text>
</svg>
