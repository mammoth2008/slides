<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">连接池借用与归还</title>
  <desc id="desc">应用请求从连接池借用可用连接，完成数据库操作后归还；连接池维护物理连接。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7890a5"/>
    </marker>
    <style>
      .bg { fill: #fbfcfe; }
      .box { stroke: #c8d3df; stroke-width: 2; rx: 18; }
      .app { fill: #fff1dc; }
      .pool { fill: #e8f3ff; }
      .conn { fill: #eef8ed; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; text-anchor: middle; }
      .detail { font: 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; text-anchor: middle; }
      .small { font: 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .arrow { stroke: #7890a5; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .return { stroke: #7890a5; stroke-width: 4; fill: none; stroke-dasharray: 9 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="62">连接池管理的是物理连接，应用请求只借用和归还</text>

  <rect class="box app" x="55" y="230" width="220" height="180"/>
  <rect class="box pool" x="400" y="150" width="360" height="340"/>
  <rect class="box conn" x="875" y="230" width="270" height="180"/>

  <text class="label" x="165" y="295">应用请求</text>
  <text class="detail" x="165" y="330">借用连接</text>
  <text class="detail" x="165" y="358">执行 SQL</text>
  <text class="detail" x="165" y="386">结束后归还</text>

  <text class="label" x="580" y="215">连接池</text>
  <text class="detail" x="580" y="250">维护可复用的物理连接</text>
  <rect class="box conn" x="455" y="305" width="90" height="78"/>
  <rect class="box conn" x="575" y="305" width="90" height="78"/>
  <rect class="box conn" x="695" y="305" width="90" height="78"/>
  <text class="detail" x="500" y="350">连接 1</text>
  <text class="detail" x="620" y="350">连接 2</text>
  <text class="detail" x="740" y="350">连接 3</text>
  <text class="detail" x="580" y="445">健康检查、上限和回收由池管理</text>

  <text class="label" x="1010" y="295">数据库</text>
  <text class="detail" x="1010" y="330">接收 SQL</text>
  <text class="detail" x="1010" y="358">保持会话</text>
  <text class="detail" x="1010" y="386">处理结果</text>

  <path class="arrow" d="M275 285 C320 285 345 250 395 250"/>
  <path class="return" d="M395 395 C345 395 320 360 275 360"/>
  <path class="arrow" d="M760 300 C805 300 825 285 870 285"/>
  <path class="return" d="M870 365 C825 365 805 350 760 350"/>
  <text class="small" x="55" y="610">Connection.close() 在连接池场景通常表示“归还”，不一定关闭底层物理连接</text>
</svg>
