<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">视图是数据窗口</title>
  <desc id="desc">基本表保存数据，视图保存查询定义，用户查询视图时得到当前结果；不同角色可以使用不同窗口。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60758a"/></marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e2d3b; }
      .title { font-size: 30px; font-weight: 700; }
      .note { font-size: 18px; fill: #536979; }
      .box { stroke: #7890a5; stroke-width: 2; }
      .blue { fill: #e8f3ff; } .green { fill: #eef8ed; } .orange { fill: #fff1dc; } .purple { fill: #f0eaff; } .white { fill: #ffffff; }
      .box-title { font-size: 24px; font-weight: 700; }
      .small-title { font-size: 19px; font-weight: 650; }
      .small { font-size: 17px; fill: #536979; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#fbfcfe"/>
  <text class="label title" x="65" y="62">视图像一扇按角色定制的数据窗口</text>
  <text class="label note" x="65" y="95">基本表保存事实，视图保存“看哪些列、哪些行”的定义</text>

  <rect class="box blue" x="70" y="170" width="300" height="205" rx="22"/>
  <text class="label box-title" x="220" y="220" text-anchor="middle">基本表</text>
  <text class="label small-title" x="220" y="265" text-anchor="middle">Student、SC、Course</text>
  <text class="label small" x="220" y="308" text-anchor="middle">保存实际数据</text>
  <text class="label small" x="220" y="340" text-anchor="middle">主码、成绩、课程等事实</text>

  <line x1="370" y1="272" x2="470" y2="272" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box green" x="470" y="135" width="285" height="275" rx="22"/>
  <text class="label box-title" x="612" y="190" text-anchor="middle">视图定义</text>
  <text class="label small-title" x="612" y="238" text-anchor="middle">CREATE VIEW ... AS SELECT</text>
  <rect class="box white" x="515" y="270" width="195" height="82" rx="15"/>
  <text class="label small" x="612" y="305" text-anchor="middle">固定筛选、连接、</text>
  <text class="label small" x="612" y="333" text-anchor="middle">表达式或分组</text>
  <text class="label small" x="612" y="388" text-anchor="middle">数据字典保存定义</text>

  <line x1="755" y1="272" x2="855" y2="272" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box orange" x="855" y="145" width="285" height="115" rx="20"/>
  <text class="label box-title" x="997" y="193" text-anchor="middle">专业学生窗口</text>
  <text class="label small" x="997" y="230" text-anchor="middle">按专业筛选学生行列</text>
  <rect class="box purple" x="855" y="285" width="285" height="115" rx="20"/>
  <text class="label box-title" x="997" y="333" text-anchor="middle">教师窗口（示意）</text>
  <text class="label small" x="997" y="370" text-anchor="middle">另一个视图可封装课程与成绩</text>

  <rect class="box white" x="155" y="485" width="890" height="105" rx="22"/>
  <text class="label box-title" x="600" y="530" text-anchor="middle">下一次查询时重新得到当前结果</text>
  <text class="label small" x="600" y="565" text-anchor="middle">基本表变化 → 同一视图查询看到的结果随之变化；视图不是静态复制表</text>
</svg>
