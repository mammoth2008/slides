<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">区块链系统的分层架构</title>
  <desc id="desc">区块链系统的九层功能责任示意：基础设施、基础组件、账本、共识、智能合约、接口、系统管理、运维和应用。它是概念架构，不代表所有平台的固定部署拓扑或线性调用顺序。</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #f7f9fc; stroke: #c8d3df; stroke-width: 2; rx: 16; }
      .layer-a { fill: #eef2f8; stroke: #b7c7d8; stroke-width: 2; rx: 10; }
      .layer-b { fill: #eaf3fb; stroke: #a7c5df; stroke-width: 2; rx: 10; }
      .layer-c { fill: #eaf4ef; stroke: #a9cbb9; stroke-width: 2; rx: 10; }
      .layer-d { fill: #eeeafa; stroke: #b7a9d8; stroke-width: 2; rx: 10; }
      .layer-e { fill: #fff1dc; stroke: #e0bc8d; stroke-width: 2; rx: 10; }
      .title { font: 700 29px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .text { font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .arrow { stroke: #71869a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#71869a"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="58">分层不是把区块链拆成九个孤立模块，而是分配责任边界</text>
  <rect class="panel" x="40" y="95" width="1120" height="530"/>
  <text class="small" x="78" y="135">九层用于分配功能责任；账本和共识是可信状态的核心，不表示所有平台必须严格分层</text>

  <rect class="layer-a" x="95" y="160" width="990" height="42"/><text class="label" x="125" y="188">基础设施层</text><text class="text" x="350" y="188">网络、存储、计算资源</text>
  <rect class="layer-b" x="95" y="212" width="990" height="42"/><text class="label" x="125" y="240">基础组件层</text><text class="text" x="350" y="240">节点发现、消息传输、密码库、数据存储</text>
  <rect class="layer-c" x="95" y="264" width="990" height="42"/><text class="label" x="125" y="292">账本层</text><text class="text" x="350" y="292">交易收集、区块验证、追加、查询与归档</text>
  <rect class="layer-d" x="95" y="316" width="990" height="42"/><text class="label" x="125" y="344">共识层</text><text class="text" x="350" y="344">让节点对顺序和状态达成协议</text>
  <rect class="layer-e" x="95" y="368" width="990" height="42"/><text class="label" x="125" y="396">智能合约层</text><text class="text" x="350" y="396">事件、条件、动作与业务规则</text>
  <rect class="layer-b" x="95" y="420" width="990" height="42"/><text class="label" x="125" y="448">接口层</text><text class="text" x="350" y="448">RPC、SDK 与应用调用</text>
  <rect class="layer-a" x="95" y="472" width="990" height="42"/><text class="label" x="125" y="500">系统管理层</text><text class="text" x="350" y="500">身份、权限、节点和配置</text>
  <rect class="layer-c" x="95" y="524" width="990" height="42"/><text class="label" x="125" y="552">操作运维层</text><text class="text" x="350" y="552">日志、监控、升级、故障处理</text>
  <rect class="layer-d" x="95" y="576" width="990" height="42"/><text class="label" x="125" y="604">应用层</text><text class="text" x="350" y="604">金融、供应链、审计、治理等业务</text>
  <path class="arrow" d="M1055 182 V598"/>
  <text class="small" x="1090" y="390" transform="rotate(90 1090 390)">抽象依赖与责任边界（示意）</text>
</svg>
