<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">审计把一次操作变成可追溯事件</title>
  <desc id="desc">访问事件经过审计规则写入受保护的审计日志，再由审计员分析并采取响应；审计是事后控制，不能替代事中授权检查。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60758a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#71849a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="#fbfcfe"/>
  <text x="72" y="82" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700">审计把一次操作变成可追溯事件</text>
  <text x="74" y="124" fill="#60758a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">记录发生了什么，保留谁、何时、对什么对象、成功还是失败</text>

  <g filter="url(#shadow)">
    <rect x="64" y="202" width="238" height="246" rx="22" fill="#e8f3ff" stroke="#7890a5" stroke-width="2"/>
    <rect x="336" y="202" width="238" height="246" rx="22" fill="#eef8ed" stroke="#7890a5" stroke-width="2"/>
    <rect x="608" y="202" width="238" height="246" rx="22" fill="#fff1dc" stroke="#7890a5" stroke-width="2"/>
    <rect x="880" y="202" width="256" height="246" rx="22" fill="#f0eaff" stroke="#7890a5" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#60758a" stroke-width="4" marker-end="url(#arrow)">
    <path d="M302 325 H326"/>
    <path d="M574 325 H598"/>
    <path d="M846 325 H870"/>
  </g>

  <g fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="183" y="254" font-size="28" font-weight="700">访问事件</text>
    <text x="183" y="302" font-size="21">用户、时间、对象</text>
    <text x="183" y="338" font-size="21">操作、结果</text>
    <text x="183" y="390" font-size="18" fill="#60758a">成功与失败都可能有价值</text>

    <text x="455" y="254" font-size="28" font-weight="700">审计规则</text>
    <text x="455" y="302" font-size="21">选哪些对象和事件</text>
    <text x="455" y="338" font-size="21">按什么粒度记录</text>
    <text x="455" y="390" font-size="18" fill="#60758a">开关状态要能被核验</text>

    <text x="727" y="254" font-size="28" font-weight="700">审计日志</text>
    <text x="727" y="302" font-size="21">追加记录与转储</text>
    <text x="727" y="338" font-size="21">保护完整性与保密性</text>
    <text x="727" y="390" font-size="18" fill="#60758a">日志也需要访问控制</text>

    <text x="1008" y="254" font-size="28" font-weight="700">分析与响应</text>
    <text x="1008" y="302" font-size="21">重现事件链</text>
    <text x="1008" y="338" font-size="21">报警、调查、问责</text>
    <text x="1008" y="390" font-size="18" fill="#60758a">审计是事后控制</text>
  </g>

  <rect x="164" y="548" width="872" height="76" rx="18" fill="#ffffff" stroke="#c8d3df" stroke-width="2"/>
  <text x="600" y="595" text-anchor="middle" fill="#25364a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="600">审计不能替代事中授权检查：它回答“做过什么”，而不是“现在能不能做”</text>
</svg>
