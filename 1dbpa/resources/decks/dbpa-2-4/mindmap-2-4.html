<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关系代数 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"关系代数","children":[{"content":"2.4.1 传统集合运算","children":[{"content":"运算三要素：对象、运算符与结果","children":[]},{"content":"相容关系：并、差和交的输入条件","children":[]},{"content":"并、差、交：<code>∪ − ∩<\/code> 合并、排除与比较共有元组","children":[]},{"content":"笛卡儿积：<code>×<\/code> 组合所有元组与结果规模","children":[]},{"content":"分类轴：集合/专门与基本/可导出彼此独立、可以交叉","children":[]},{"content":"可导出性：<code>∪ − × σ Π<\/code> 是基本运算；<code>∩ ⋈ ÷<\/code> 是可导出运算","children":[]}]},{"content":"2.4.2 专门关系运算","children":[{"content":"选择 <code>σ<\/code>：按条件保留行","children":[]},{"content":"投影 <code>Π<\/code>：按属性保留列并去除重复","children":[]},{"content":"连接 <code>⋈<\/code>：匹配元组并组合关系","children":[]},{"content":"连接变体：θ 连接、等值连接与自然连接","children":[]},{"content":"除 <code>÷<\/code>：用象集覆盖表达对所有条件","children":[]},{"content":"可导出性：选择、投影是基本运算；连接、除是可导出运算","children":[]},{"content":"综合查询：<code>R₁→R₂→R₃→R₄<\/code> 沿中间关系逐步构造与验证","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
