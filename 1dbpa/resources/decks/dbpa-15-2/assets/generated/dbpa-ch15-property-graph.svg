<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">学生选课属性图</title>
  <desc id="desc">学生王林与课程英语通过一条选课边连接，选课边带有成绩和日期属性，节点带有标签和属性。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L9,3 z" fill="#7890a5"/>
    </marker>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #f7f9fc; stroke: #c8d3df; stroke-width: 2; rx: 16; }
      .student { fill: #f0eaff; stroke: #8d7bb8; stroke-width: 2; rx: 14; }
      .course { fill: #eef8ed; stroke: #7890a5; stroke-width: 2; rx: 14; }
      .edge { fill: #fff1dc; stroke: #d49a61; stroke-width: 2; rx: 11; }
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #25364a; text-anchor: middle; }
      .text { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; text-anchor: middle; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #60758a; }
      .arrow { stroke: #7890a5; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .edge-line { stroke: #d49a61; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="55" y="62">关系本身也可以带属性：王林选了英语，成绩是 90</text>
  <rect class="panel" x="45" y="105" width="1110" height="475"/>
  <rect class="student" x="100" y="250" width="245" height="155"/>
  <text class="label" x="222" y="295">Student</text>
  <text class="text" x="222" y="330">Sname = 王林</text>
  <text class="text" x="222" y="360">Sno = 2020001</text>
  <text class="text" x="222" y="390">标签 + 顶点属性</text>
  <rect class="course" x="820" y="250" width="245" height="155"/>
  <text class="label" x="942" y="295">Course</text>
  <text class="text" x="942" y="330">Cname = 英语</text>
  <text class="text" x="942" y="360">Cno = 001</text>
  <text class="text" x="942" y="390">标签 + 顶点属性</text>
  <rect class="edge" x="465" y="235" width="245" height="185"/>
  <text class="label" x="587" y="280">SC 选课关系</text>
  <text class="text" x="587" y="320">Score = 90</text>
  <text class="text" x="587" y="350">关系也可以有属性</text>
  <text class="text" x="587" y="380">Date = 2020-09-01</text>
  <path class="edge-line" d="M345 328 H455"/>
  <path class="edge-line" d="M710 328 H810"/>
  <text class="small" x="385" y="305">顶点</text>
  <text class="small" x="753" y="305">顶点</text>
  <rect class="panel" x="45" y="610" width="1110" height="58"/>
  <text class="label" x="185" y="647">图元素</text>
  <text class="text" x="405" y="647">顶点、边、标签、属性</text>
  <text class="label" x="710" y="647">查询动作</text>
  <text class="text" x="980" y="647">匹配模式，再沿边导航</text>
</svg>
