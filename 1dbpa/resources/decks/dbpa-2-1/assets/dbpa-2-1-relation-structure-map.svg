<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">二维表的结构映射</title>
  <desc id="desc">示例二维表中的列、行、单元格和整张表分别对应属性、元组、分量和关系</desc>
  <rect width="1280" height="720" fill="#f7f4ed"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" fill="#243746">
    <text x="640" y="62" font-size="30" font-weight="700" text-anchor="middle">一张二维表，从四个层次理解</text>

    <!-- The table frame represents the complete relation. -->
    <rect x="320" y="150" width="640" height="344" rx="18" fill="#fffdf8" stroke="#273847" stroke-width="5"/>
    <rect x="325" y="155" width="203" height="334" rx="12" fill="#dcefeb"/>
    <rect x="325" y="155" width="630" height="72" rx="12" fill="#e4edf1"/>
    <rect x="325" y="155" width="203" height="334" rx="12" fill="#dcefeb"/>
    <rect x="325" y="155" width="203" height="72" rx="12" fill="#c9e2df"/>
    <rect x="528" y="299" width="203" height="86" fill="#f3dfc9"/>

    <g stroke="#273847" stroke-width="3">
      <path d="M320 227h640M320 299h640M320 385h640M320 472h640"/>
      <path d="M528 150v344M736 150v344"/>
    </g>

    <g font-size="25" font-weight="700" text-anchor="middle">
      <text x="424" y="201">学号</text>
      <text x="632" y="201">姓名</text>
      <text x="848" y="201">专业</text>
    </g>
    <g font-size="24" text-anchor="middle">
      <text x="424" y="273">001</text><text x="632" y="273">李勇</text><text x="848" y="273">信安</text>
      <text x="424" y="359">002</text><text x="632" y="359">刘晨</text><text x="848" y="359">计科</text>
      <text x="424" y="445">003</text><text x="632" y="445">王敏</text><text x="848" y="445">计科</text>
    </g>

    <!-- Column, row, and cell callouts. -->
    <g fill="#a8542b" stroke="#a8542b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M238 246H306"/>
      <path d="m290 230 20 16-20 16" fill="none"/>
      <path d="M974 342h68"/>
      <path d="m1026 326 20 16-20 16" fill="none"/>
      <path d="M632 548V504"/>
      <path d="m616 520 16-20 16 20" fill="none"/>
      <path d="M960 150V112H824"/>
      <path d="m842 96-20 16 20 16" fill="none"/>
    </g>

    <g fill="#a8542b" font-size="27" font-weight="700">
      <text x="62" y="232">列 → 属性 → 域</text>
      <text x="1060" y="334">行 → 元组</text>
      <text x="548" y="604">单元格 → 分量</text>
      <text x="640" y="104" text-anchor="middle">整张表 → 关系</text>
    </g>

    <g fill="#647782" font-size="21">
      <text x="64" y="270">这一列的值来自同一个域</text>
      <text x="1060" y="370">一行是一个完整元组</text>
      <text x="548" y="638">一个位置上的一个值</text>
    </g>
  </g>
</svg>
