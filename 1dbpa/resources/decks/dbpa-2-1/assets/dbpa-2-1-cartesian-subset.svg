<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">笛卡儿积到有意义关系</title>
  <desc id="desc">左侧是导师、专业和研究生域的十二个可能组合，右侧保留三个符合业务语义的元组</desc>
  <rect width="1280" height="720" fill="#f7f4ed"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" fill="#243746">
    <text x="48" y="54" font-size="30" font-weight="700">笛卡儿积 D₁ × D₂ × D₃</text>
    <text x="48" y="88" font-size="21" fill="#647782">12 个可能组合（展示部分）</text>
    <rect x="42" y="112" width="522" height="508" rx="18" fill="#eef2f3" stroke="#8fa5ae" stroke-width="3"/>
    <g fill="#dbe6ea" stroke="#8fa5ae" stroke-width="2">
      <rect x="62" y="138" width="482" height="54" rx="8"/>
    </g>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <text x="142" y="173">导师</text><text x="302" y="173">专业</text><text x="462" y="173">研究生</text>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="142" y="232">张清玫</text><text x="302" y="232">计算机科学与技术</text><text x="462" y="232">李勇</text>
      <text x="142" y="284">张清玫</text><text x="302" y="284">计算机科学与技术</text><text x="462" y="284">刘晨</text>
      <text x="142" y="336">张清玫</text><text x="302" y="336">信息管理与信息系统</text><text x="462" y="336">王敏</text>
      <text x="142" y="388">刘逸</text><text x="302" y="388">计算机科学与技术</text><text x="462" y="388">王敏</text>
      <text x="142" y="440">刘逸</text><text x="302" y="440">信息管理与信息系统</text><text x="462" y="440">李勇</text>
      <text x="142" y="492">…</text><text x="302" y="492">其余可能组合省略</text><text x="462" y="492">…</text>
    </g>
    <g stroke="#b8c5ca" stroke-width="2">
      <path d="M62 202H544M62 254H544M62 306H544M62 358H544M62 410H544M62 462H544M62 514H544"/>
      <path d="M222 138V514M382 138V514"/>
    </g>
    <g fill="#a8542b" font-size="20" font-weight="700" text-anchor="middle">
      <text x="648" y="282">按业务语义</text>
      <text x="648" y="316">保留成立的组合</text>
    </g>
    <path d="M576 360H714" stroke="#a8542b" stroke-width="6" stroke-linecap="round"/>
    <path d="m700 342 28 18-28 18" fill="none" stroke="#a8542b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="760" y="54" font-size="30" font-weight="700">关系 SMP ⊆ D₁ × D₂ × D₃</text>
    <text x="760" y="88" font-size="21" fill="#647782">3 个有业务意义的元组</text>
    <rect x="754" y="112" width="484" height="318" rx="18" fill="#fffdf8" stroke="#5d9aa2" stroke-width="4"/>
    <rect x="774" y="138" width="444" height="54" rx="8" fill="#dcefeb"/>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <text x="848" y="173">导师</text><text x="996" y="173">专业</text><text x="1144" y="173">研究生</text>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="848" y="232">张清玫</text><text x="996" y="232">计算机科学与技术</text><text x="1144" y="232">李勇</text>
      <text x="848" y="284">张清玫</text><text x="996" y="284">计算机科学与技术</text><text x="1144" y="284">刘晨</text>
      <text x="848" y="336">刘逸</text><text x="996" y="336">信息管理与信息系统</text><text x="1144" y="336">王敏</text>
    </g>
    <g stroke="#9eb9b6" stroke-width="2">
      <path d="M774 202H1218M774 254H1218M774 306H1218M774 358H1218"/>
      <path d="M922 138V358M1070 138V358"/>
    </g>
    <text x="754" y="492" font-size="23" fill="#243746">关系是可能组合中的有意义有限子集</text>
    <text x="754" y="532" font-size="21" fill="#647782">形式化地写作：R ⊆ D₁ × D₂ × D₃</text>
  </g>
</svg>
