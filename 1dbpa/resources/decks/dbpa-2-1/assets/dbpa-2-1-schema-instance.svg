<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">同一关系模式对应两个时刻的关系实例</title>
  <desc id="desc">上方稳定的五列关系模式对应下方两个内容不同但列结构相同的学生实例</desc>
  <rect width="900" height="1200" rx="28" fill="#f7f4ed"/>
  <g font-family="PingFang SC, Hiragino Sans GB, sans-serif" fill="#243746" text-anchor="middle">
    <text x="450" y="48" font-size="27" font-weight="700">Student 关系模式（型）</text>
    <rect x="55" y="70" width="790" height="172" rx="18" fill="#e4edf1" stroke="#273847" stroke-width="5"/>
    <g stroke="#273847" stroke-width="3"><path d="M55 130h790M55 190h790M213 70v172M371 70v172M529 70v172M687 70v172"/></g>
    <g fill="#5d9aa2"><rect x="69" y="145" width="130" height="34" rx="8"/><rect x="227" y="145" width="130" height="34" rx="8"/><rect x="385" y="145" width="130" height="34" rx="8"/><rect x="543" y="145" width="130" height="34" rx="8"/><rect x="701" y="145" width="130" height="34" rx="8"/></g>
    <g font-size="16" font-weight="700"><text x="134" y="168">Sno</text><text x="292" y="168">Sname</text><text x="450" y="168">Ssex</text><text x="608" y="168">Sbirthdate</text><text x="766" y="168">Smajor</text></g>
    <path d="M450 242v42" stroke="#a8542b" stroke-width="6" stroke-linecap="round"/>
    <path d="m432 270 18 18 18-18" fill="none" stroke="#a8542b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="450" y="322" font-size="21" fill="#a8542b" font-weight="700">同一模式可对应不同时刻的实例</text>
    <text x="450" y="370" font-size="25" font-weight="700">Student 实例 t₁（值）</text>
    <rect x="55" y="392" width="790" height="240" rx="18" fill="#fffdf8" stroke="#273847" stroke-width="5"/>
    <g stroke="#273847" stroke-width="3"><path d="M55 452h790M55 512h790M55 572h790"/><path d="M213 392v240M371 392v240M529 392v240M687 392v240"/></g>
    <g fill="#dcefeb"><rect x="69" y="407" width="130" height="34" rx="8"/><rect x="227" y="407" width="130" height="34" rx="8"/><rect x="385" y="407" width="130" height="34" rx="8"/><rect x="543" y="407" width="130" height="34" rx="8"/><rect x="701" y="407" width="130" height="34" rx="8"/></g>
    <g font-size="16" font-weight="700"><text x="134" y="430">Sno</text><text x="292" y="430">Sname</text><text x="450" y="430">Ssex</text><text x="608" y="430">Sbirthdate</text><text x="766" y="430">Smajor</text></g>
    <g font-size="16"><text x="134" y="488">001</text><text x="292" y="488">李勇</text><text x="450" y="488">男</text><text x="608" y="488">2000-3-8</text><text x="766" y="488">信安</text><text x="134" y="548">002</text><text x="292" y="548">刘晨</text><text x="450" y="548">女</text><text x="608" y="548">1999-9-1</text><text x="766" y="548">计科</text></g>
    <path d="M450 632v42" stroke="#a8542b" stroke-width="6" stroke-linecap="round"/><path d="m432 660 18 18 18-18" fill="none" stroke="#a8542b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="450" y="724" font-size="25" font-weight="700">Student 实例 t₂（值）</text>
    <rect x="55" y="746" width="790" height="330" rx="18" fill="#fffdf8" stroke="#273847" stroke-width="5"/>
    <g stroke="#273847" stroke-width="3"><path d="M55 806h790M55 866h790M55 926h790M55 986h790"/><path d="M213 746v330M371 746v330M529 746v330M687 746v330"/></g>
    <g fill="#dcefeb"><rect x="69" y="761" width="130" height="34" rx="8"/><rect x="227" y="761" width="130" height="34" rx="8"/><rect x="385" y="761" width="130" height="34" rx="8"/><rect x="543" y="761" width="130" height="34" rx="8"/><rect x="701" y="761" width="130" height="34" rx="8"/></g>
