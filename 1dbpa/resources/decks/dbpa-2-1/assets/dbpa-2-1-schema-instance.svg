    <g font-size="16"><text x="134" y="842">001</text><text x="292" y="842">李勇</text><text x="450" y="842">男</text><text x="608" y="842">2000-3-8</text><text x="766" y="842">信安</text><text x="134" y="902">002</text><text x="292" y="902">刘晨</text><text x="450" y="902">女</text><text x="608" y="902">1999-9-1</text><text x="766" y="902">计科</text><text x="134" y="962">003</text><text x="292" y="962">王敏</text><text x="450" y="962">女</text><text x="608" y="962">2001-8-1</text><text x="766" y="962">计科</text></g>
    <text x="450" y="1135" font-size="20" fill="#a8542b" font-weight="700">记录改变 → 实例改变；列结构仍由模式决定</text>
