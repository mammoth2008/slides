<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">数据库对象命名层次</title>
  <desc id="desc">一个数据库管理系统实例可以包含多个数据库，一个数据库可以包含多个模式，一个模式可以包含表、视图和索引。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#60758a"/>
    </marker>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e2d3b; }
      .title { font-size: 30px; font-weight: 700; }
      .note { font-size: 18px; fill: #536979; }
      .box { stroke: #7890a5; stroke-width: 2; }
      .inner { fill: #ffffff; stroke: #8ca1b3; stroke-width: 1.5; }
      .box-title { font-size: 24px; font-weight: 700; }
      .inner-title { font-size: 21px; font-weight: 650; }
      .inner-note { font-size: 16px; fill: #536979; }
      .map { font-size: 17px; font-weight: 650; fill: #536979; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#fbfcfe"/>
  <text class="label title" x="70" y="60">对象命名层次让同名对象可以分开管理</text>
  <text class="label note" x="70" y="92">课程先掌握逻辑层次；具体产品的数据库层级和搜索路径仍需查手册</text>

  <rect class="box" x="70" y="135" width="1060" height="115" rx="22" fill="#e8f3ff"/>
  <text class="label box-title" x="110" y="185">RDBMS 实例</text>
  <text class="label note" x="110" y="216">运行中的数据库服务</text>
  <rect class="inner" x="440" y="153" width="250" height="78" rx="14"/>
  <text class="label inner-title" x="565" y="187" text-anchor="middle">数据库 A</text>
  <text class="label inner-note" x="565" y="213" text-anchor="middle">可包含多个模式</text>
  <rect class="inner" x="720" y="153" width="250" height="78" rx="14"/>
  <text class="label inner-title" x="845" y="187" text-anchor="middle">数据库 B</text>
  <text class="label inner-note" x="845" y="213" text-anchor="middle">彼此有独立命名空间</text>

  <line x1="565" y1="250" x2="565" y2="310" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label map" x="590" y="287">数据库包含模式</text>

  <rect class="box" x="70" y="310" width="1060" height="150" rx="22" fill="#eef8ed"/>
  <text class="label box-title" x="110" y="360">模式 S-C-SC</text>
  <text class="label note" x="110" y="391">数据库对象的命名空间</text>
  <rect class="inner" x="440" y="332" width="190" height="92" rx="14"/>
  <text class="label inner-title" x="535" y="369" text-anchor="middle">Student</text>
  <text class="label inner-note" x="535" y="397" text-anchor="middle">基本表</text>
  <rect class="inner" x="650" y="332" width="190" height="92" rx="14"/>
  <text class="label inner-title" x="745" y="369" text-anchor="middle">成绩视图</text>
  <text class="label inner-note" x="745" y="397" text-anchor="middle">视图</text>
  <rect class="inner" x="860" y="332" width="190" height="92" rx="14"/>
  <text class="label inner-title" x="955" y="369" text-anchor="middle">Idx_StuSname</text>
  <text class="label inner-note" x="955" y="397" text-anchor="middle">索引</text>

  <line x1="565" y1="460" x2="565" y2="520" stroke="#60758a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label map" x="590" y="497">模式包含对象</text>

  <rect class="box" x="70" y="520" width="1060" height="125" rx="22" fill="#fff1dc"/>
  <text class="label box-title" x="110" y="572">常用限定名</text>
  <text class="label note" x="110" y="604">模式名.对象名</text>
  <rect class="inner" x="440" y="543" width="250" height="70" rx="14"/>
  <text class="label inner-title" x="565" y="586" text-anchor="middle">"S-C-SC".Student</text>
  <rect class="inner" x="720" y="543" width="250" height="70" rx="14"/>
  <text class="label inner-title" x="845" y="586" text-anchor="middle">"S-C-SC".成绩视图</text>
</svg>
