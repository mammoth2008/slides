<!doctype html>

<head>

  <title>数据定义 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }

  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"数据定义","children":[{"content":"3.2.1 模式的定义与删除","children":[{"content":"命名空间：模式与对象归属","children":[]},{"content":"创建责任：模式名、授权者与执行权限","children":[]},{"content":"删除结果：<code>RESTRICT<\/code> 拒绝；<code>CASCADE<\/code> 可能连带删除定义","children":[]}]},{"content":"3.2.2 基本表定义","children":[{"content":"<code>CREATE TABLE<\/code>：列、类型与约束","children":[]},{"content":"学生选课：<code>Student<\/code>、<code>Course<\/code> 与 <code>SC<\/code>","children":[]},{"content":"约束层次：列级、表级、复合主码与外码","children":[]},{"content":"数据类型：值域、精度与运算需求","children":[]},{"content":"结构变化：目标状态与数据迁移","children":[]},{"content":"依赖处理：哪些操作被拒绝，哪些定义会被级联删除","children":[]}]},{"content":"3.2.3 索引","children":[{"content":"候选路径：查询频率与选择性","children":[]},{"content":"维护代价：空间与更新成本","children":[]},{"content":"产品差异：<code>CREATE INDEX<\/code> 等语法查目标 DBMS 手册","children":[]},{"content":"使用决策：统计信息与执行路径","children":[]}]},{"content":"3.2.4 数据字典","children":[{"content":"系统目录：对象、约束、权限、依赖与统计","children":[]},{"content":"运行依据：检查、处理与优化","children":[]}]}]};
