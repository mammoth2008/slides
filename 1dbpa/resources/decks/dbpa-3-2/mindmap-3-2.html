<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据定义 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"数据定义","children":[{"content":"3.2.1 模式的定义与删除","children":[{"content":"命名空间：模式包含表、视图与索引","children":[]},{"content":"创建模式：CREATE SCHEMA 与授权者","children":[]},{"content":"删除模式：RESTRICT 与 CASCADE","children":[]}]},{"content":"3.2.2 基本表定义","children":[{"content":"CREATE TABLE：列、类型与约束","children":[]},{"content":"学生选课：Student、Course 与 SC","children":[]},{"content":"约束层次：列级约束、表级约束、复合主码与外码","children":[]},{"content":"数据类型：域、范围与后续运算需求","children":[]},{"content":"结构变化：ALTER TABLE 与 DROP TABLE","children":[]},{"content":"依赖处理：RESTRICT 拒绝有依赖的删除，CASCADE 可能删除依赖对象","children":[]}]},{"content":"3.2.3 索引","children":[{"content":"存取路径：加速查询定位","children":[]},{"content":"维护代价：空间和更新成本","children":[]},{"content":"标准边界：索引语句是常见 RDBMS 扩展","children":[]},{"content":"系统决策：DBMS 自动选择索引或完整扫描","children":[]}]},{"content":"3.2.4 数据字典","children":[{"content":"内部系统目录：对象、约束、权限、依赖与统计","children":[]},{"content":"运行依据：查询处理与优化依赖元数据","children":[]}]}]};

</html>
