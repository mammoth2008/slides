<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程 | HUST</title>
  <meta name="description" content="哈尔滨理工大学经济与管理学院">
  <meta name="author" content="xinjiang@hrbust.edu.cn">
  <link rel="icon" href="hustlogo72.png">
  <style>
    :root {
      --page: #f3f6f7;
      --surface: #ffffff;
      --ink: #15232d;
      --ink-soft: #536670;
      --line: #cbd5da;
      --dbpa: #185b91;
      --cciot: #0d6475;
      --ita: #b95d3b;
      --serif: "Source Han Serif CN", "Source Han Serif SC", "Songti SC", STSong, SimSun, serif;
      --sans: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: 10;
      inset: 0 0 auto;
      height: 6px;
      background: linear-gradient(
        to right,
        var(--dbpa) 0 33.333%,
        var(--cciot) 33.333% 66.666%,
        var(--ita) 66.666% 100%
      );
    }

    a { color: inherit; }

    .page {
      display: grid;
      width: min(1180px, calc(100% - 64px));
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      grid-template-rows: auto 1fr auto;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 34px 0 28px;
      border-bottom: 1px solid var(--line);
    }

    .institution {
      display: flex;
      align-items: center;
    }

    .institution img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .term {
      color: var(--ink-soft);
      font: 600 14px/1 var(--mono);
      letter-spacing: .06em;
    }

    main {
      display: grid;
      align-content: center;
      gap: 42px;
      padding: 60px 0 68px;
    }

    .intro {
      display: block;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--ink-soft);
      font: 600 14px/1 var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font: 700 clamp(58px, 7vw, 92px)/.98 var(--serif);
      letter-spacing: -.04em;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .course-card {
      --accent: var(--dbpa);
      position: relative;
      display: flex;
      min-height: 330px;
      overflow: hidden;
      flex-direction: column;
      padding: 28px 30px 26px;
      border: 1px solid var(--line);
      border-top: 7px solid var(--accent);
      background: var(--surface);
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .course-card[data-course="cciot"] { --accent: var(--cciot); }
    .course-card[data-course="ita"] { --accent: var(--ita); }

    .course-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 20px 44px rgba(21, 35, 45, .12);
    }

    .course-card:focus-visible {
      outline: 4px solid color-mix(in srgb, var(--accent) 35%, white);
      outline-offset: 4px;
    }

    .course-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--accent);
      font: 700 14px/1 var(--mono);
      letter-spacing: .1em;
    }

    .course-card h2 {
      margin: 54px 0 12px;
      font: 700 34px/1.2 var(--serif);
      letter-spacing: -.02em;
    }

    .course-english {
      max-width: 27em;
      margin: 0;
      color: var(--ink-soft);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .course-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 30px;
      border-top: 1px solid var(--line);
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }

    .course-action span:last-child {
      color: var(--accent);
      font-size: 24px;
      line-height: 1;
      transition: transform 180ms ease;
    }

    .course-card:hover .course-action span:last-child { transform: translateX(5px); }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 0 30px;
      border-top: 1px solid var(--line);
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.6;
    }

    .registration {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px 18px;
    }

    .registration a {
      text-decoration-color: transparent;
      text-underline-offset: 3px;
    }

    .registration a:hover { text-decoration-color: currentColor; }

    @media (max-width: 900px) {
      .course-grid { grid-template-columns: 1fr; }
      .course-card { min-height: 260px; }
      .course-card h2 { margin-top: 36px; }
    }

    @media (max-width: 600px) {
      .page { width: min(100% - 36px, 1180px); }
      .site-header { align-items: flex-start; gap: 20px; padding-top: 28px; }
      .term { padding-top: 4px; text-align: right; }
      main { padding: 48px 0 54px; }
      h1 { font-size: 54px; }
      .course-card { padding-inline: 24px; }
      footer { align-items: flex-start; flex-direction: column; }
      .registration { justify-content: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="institution">
        <img src="hustlogo72.png">
      </div>
      <div class="term">2026—2027 / 01</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Course</p>
          <h1 id="page-title">课程</h1>
        </div>
      </section>

      <nav class="course-grid" aria-label="本学期课程">
        <a class="course-card" data-course="dbpa" href="1dbpa/dbpa-0.html">
          <div class="course-meta"><span>01</span><span>DBPA</span></div>
          <h2>数据库原理与<br>应用</h2>
          <p class="course-english">Database Principles and Applications</p>
          <div class="course-action"><span>进入课程</span><span aria-hidden="true">→</span></div>
        </a>

        <a class="course-card" data-course="cciot" href="2cciot/cciot-0.html">
          <div class="course-meta"><span>02</span><span>CCIOT</span></div>
          <h2>云计算与<br>物联网</h2>
          <p class="course-english">Cloud Computing and Internet of Things</p>
          <div class="course-action"><span>进入课程</span><span aria-hidden="true">→</span></div>
        </a>

        <a class="course-card" data-course="ita" href="3ita/ita-1-1.html">
          <div class="course-meta"><span>03</span><span>ITA</span></div>
          <h2>智能技术及<br>应用</h2>
          <p class="course-english">Intelligent Technology and Applications</p>
          <div class="course-action"><span>进入课程</span><span aria-hidden="true">→</span></div>
        </a>
      </nav>
    </main>

    <footer>
      <span>课程资料·课堂教学使用</span>
      <div class="registration">
        <a href="https://beian.mps.gov.cn/" target="_blank" rel="noopener">黑公网安备23010302001726号</a>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">黑ICP备2024033110号-1</a>
      </div>
    </footer>
  </div>
</body>
</html>
