<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="云计算与物联网课程全景：从现实对象到云端服务的闭环。">
  <title>CCIOT 课程全景 | 云计算与物联网</title>
  <link rel="stylesheet" href="resources/theme/fonts.css">
  <style>
    :root {
      color-scheme: light;
      --page: #e5eef1;
      --surface: #ffffff;
      --surface-soft: #edf5f6;
      --ink: #102a35;
      --ink-soft: #45616c;
      --primary: #0d6475;
      --primary-deep: #084b59;
      --primary-soft: #dff0f2;
      --accent: #c26432;
      --accent-soft: #faebdf;
      --line: #94adb5;
      --line-soft: #c5d6da;
      --shadow: rgba(16, 42, 53, .18);
      --sans: "Course Source Han Sans", "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--page);
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, rgba(13, 100, 117, .065) 0 2px, transparent 2.5px) 0 0 / 38px 38px,
        linear-gradient(145deg, rgba(255, 255, 255, .58), transparent 42%),
        var(--page);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button,
    a { font: inherit; }

    button { color: inherit; }

    a {
      color: inherit;
      text-underline-offset: 4px;
    }

    .page {
      width: min(1600px, calc(100% - 44px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 0 22px;
    }

    .course-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 0 2px 14px;
      border-bottom: 2px solid var(--line);
    }

    .course-identity {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .course-code {
      color: var(--accent);
      font: 800 18px/1 var(--mono);
      letter-spacing: .12em;
    }

    .course-name {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .course-meta {
      color: var(--ink-soft);
      font-size: 16px;
      font-weight: 700;
    }

    main {
      display: grid;
      gap: 18px;
      padding-top: 18px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.12fr) minmax(460px, .88fr);
      gap: 42px;
      align-items: center;
    }

    .hero h1 {
      max-width: 950px;
      margin: 0;
      font-size: clamp(44px, 4vw, 66px);
      font-weight: 850;
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .hero h1 span { color: var(--primary); }

    .capability-summary {
      padding: 18px 20px;
      border-left: 8px solid var(--accent);
      background: rgba(255, 255, 255, .84);
    }

    .capability-summary ul {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .capability-summary li {
      position: relative;
      padding-left: 21px;
      font-size: clamp(17px, 1.25vw, 21px);
      font-weight: 750;
      line-height: 1.38;
    }

    .capability-summary li::before {
      position: absolute;
      top: .5em;
      left: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      content: "";
      background: var(--primary);
    }

    .panorama {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(460px, .8fr);
      min-height: 650px;
      border: 2px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      box-shadow: 0 24px 54px -40px var(--shadow);
      overflow: hidden;
    }

    .map-panel {
      position: relative;
      min-width: 0;
      padding: 30px 32px;
      border-right: 2px solid var(--line);
      background: var(--surface-soft);
      overflow: hidden;
    }

    .map-panel::before,
    .map-panel::after {
      position: absolute;
      top: 0;
      height: 8px;
      content: "";
    }

    .map-panel::before {
      left: 0;
      width: 78%;
      background: var(--primary);
    }

    .map-panel::after {
      right: 0;
      width: 22%;
      background: var(--accent);
    }

    .loop-map {
      position: relative;
      min-height: 588px;
      background:
        linear-gradient(180deg, rgba(237, 245, 246, .08), rgba(255, 255, 255, .18)),
        url("resources/decks/cciot-0/assets/cciot-system-landscape-v2.webp") center / 100% 100% no-repeat;
    }

    .loop-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: minmax(170px, 1fr) 116px minmax(170px, 1fr);
      grid-template-areas:
        "one two three"
        ". . ."
        "six five four";
      gap: 22px 28px;
      min-height: 588px;
    }

    .stage-button {
      position: relative;
      display: grid;
      grid-template-rows: auto auto 1fr;
      align-content: start;
      width: 100%;
      min-width: 0;
      padding: 20px 20px 18px;
      border: 2px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, .93);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 14px 26px -24px var(--shadow);
      transition: transform 160ms ease, border-color 160ms ease, background-color 160ms ease, color 160ms ease;
    }

    .stage-button:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
    }

    .stage-button:focus-visible {
      outline: 4px solid color-mix(in srgb, var(--accent) 36%, white);
      outline-offset: 4px;
    }

    .stage-button[aria-pressed="true"] {
      border-color: var(--primary-deep);
      color: #fff;
      background: var(--primary-deep);
      box-shadow: 0 22px 36px -25px rgba(8, 75, 89, .85);
    }

    .stage-1 { grid-area: one; }
    .stage-2 { grid-area: two; }
    .stage-3 { grid-area: three; }
    .stage-4 { grid-area: four; }
    .stage-5 { grid-area: five; }
    .stage-6 { grid-area: six; }

    .stage-number {
      margin-bottom: 12px;
      color: var(--accent);
      font: 850 22px/1 var(--mono);
      letter-spacing: .08em;
    }

    .stage-button[aria-pressed="true"] .stage-number { color: #f7c3a6; }

    .stage-title {
      font-size: clamp(19px, 1.35vw, 24px);
      font-weight: 850;
      line-height: 1.22;
    }

    .stage-summary {
      align-self: end;
      margin-top: 13px;
      color: var(--ink-soft);
      font-size: clamp(15px, 1.02vw, 18px);
      font-weight: 650;
      line-height: 1.4;
    }

    .stage-button[aria-pressed="true"] .stage-summary { color: #dcecef; }

    .detail-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 34px 36px 30px;
      background: var(--surface);
    }

    .detail-panel::before {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 8px;
      content: "";
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .detail-marker {
      margin: 0 0 12px;
      color: var(--accent);
      font: 800 16px/1.2 var(--mono);
      letter-spacing: .08em;
    }

    .detail-panel h2 {
      margin: 0;
      font-size: clamp(34px, 2.7vw, 46px);
      font-weight: 850;
      line-height: 1.1;
      letter-spacing: -.035em;
    }

    .question {
      margin: 22px 0 0;
      padding: 17px 19px;
      border-left: 7px solid var(--primary);
      background: var(--primary-soft);
      font-size: clamp(20px, 1.5vw, 24px);
      font-weight: 800;
      line-height: 1.42;
    }

    .learning {
      margin: 18px 0 0;
      color: var(--ink-soft);
      font-size: clamp(17px, 1.2vw, 20px);
      font-weight: 650;
      line-height: 1.55;
    }

    .outcome-block {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 2px solid var(--line-soft);
    }

    .section-label {
      margin: 0 0 9px;
      color: var(--primary);
      font-size: 17px;
      font-weight: 850;
      letter-spacing: .08em;
    }

    .outcome {
      margin: 0;
      font-size: clamp(20px, 1.45vw, 24px);
      font-weight: 800;
      line-height: 1.48;
    }

    .lesson-block {
      margin-top: auto;
      padding-top: 28px;
    }

    .lesson-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .lesson-link {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 24px;
      gap: 12px;
      align-items: center;
      min-height: 54px;
      padding: 11px 13px;
      border: 2px solid var(--line-soft);
      border-radius: 6px;
      background: var(--surface-soft);
      text-decoration: none;
      font-size: clamp(16px, 1.08vw, 19px);
      font-weight: 800;
      line-height: 1.3;
      transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
    }

    .lesson-link:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      transform: translateX(3px);
    }

    .lesson-link:focus-visible {
      outline: 4px solid color-mix(in srgb, var(--accent) 34%, white);
      outline-offset: 3px;
    }

    .lesson-link svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
    }

    footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 14px;
      color: var(--ink-soft);
      font: 750 13px/1.3 var(--mono);
      letter-spacing: .08em;
    }

    @media (max-width: 1320px) {
      .page { width: min(100% - 30px, 1460px); }
      .hero { grid-template-columns: 1fr; gap: 20px; }
      .capability-summary ul { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .capability-summary li { font-size: 17px; }
      .panorama { grid-template-columns: minmax(0, 1.08fr) minmax(430px, .92fr); }
      .map-panel { padding: 28px 24px; }
      .loop-grid { gap: 20px; }
      .stage-button { padding: 18px 16px 16px; }
      .lesson-list { grid-template-columns: 1fr; }
    }

    @media (max-width: 1040px) {
      .capability-summary ul { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .panorama { grid-template-columns: 1fr; }
      .map-panel { border-right: 0; border-bottom: 2px solid var(--line); }
      .detail-panel { min-height: 590px; }
      .lesson-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .page { width: min(100% - 22px, 680px); padding-top: 12px; }
      .course-header { align-items: flex-start; gap: 12px; }
      .course-identity { display: grid; gap: 5px; }
      .course-name { font-size: 22px; }
      .course-meta { padding-top: 2px; font-size: 14px; text-align: right; }
      main { gap: 14px; padding-top: 14px; }
      .hero h1 { font-size: clamp(37px, 11vw, 52px); }
      .capability-summary { padding: 16px; }
      .capability-summary ul { grid-template-columns: 1fr; }
      .map-panel { padding: 26px 16px; }
      .loop-map { min-height: auto; }
      .loop-grid {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: none;
        grid-template-areas: "one" "two" "three" "four" "five" "six";
        gap: 10px;
        min-height: 0;
      }
      .stage-button {
        grid-template-columns: 48px minmax(0, 1fr);
        grid-template-rows: auto auto;
        min-height: 0;
        padding: 15px;
      }
      .stage-number { grid-row: 1 / span 2; margin: 2px 0 0; }
      .stage-summary { align-self: auto; margin-top: 5px; }
      .detail-panel { min-height: 0; padding: 30px 20px 24px; }
      .detail-panel h2 { font-size: 34px; }
      .lesson-block { margin-top: 20px; }
      .lesson-list { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="course-header">
      <div class="course-identity">
        <span class="course-code">CCIOT</span>
        <span class="course-name">云计算与物联网</span>
      </div>
      <div class="course-meta">17 个小节</div>
    </header>

    <main>
      <section class="hero" aria-labelledby="course-proposition">
        <h1 id="course-proposition">从<span>现实对象</span>到<span>云端服务</span>的闭环</h1>
        <div class="capability-summary" aria-label="完成课程后能够做到">
          <ul>
            <li>理解设备、感知、网络、边缘、云端与服务的系统分工</li>
            <li>追踪数据从现实对象到判断、控制和反馈的完整路径</li>
            <li>权衡资源、时延、安全、隐私与可靠性要求</li>
            <li>为真实场景提出端—边—网—云协同方案</li>
          </ul>
        </div>
      </section>

      <section class="panorama" aria-label="CCIOT 六阶段课程地图">
        <nav class="map-panel" aria-label="选择课程阶段">
          <div class="loop-map">
            <div class="loop-grid">
              <button class="stage-button stage-1" type="button" data-stage="1" aria-pressed="true" aria-controls="stage-detail">
                <span class="stage-number">01</span>
                <span class="stage-title">云资源成为服务</span>
                <span class="stage-summary">把计算资源变成按需服务</span>
              </button>

              <button class="stage-button stage-2" type="button" data-stage="2" aria-pressed="false" aria-controls="stage-detail">
                <span class="stage-number">02</span>
                <span class="stage-title">资源池化与调度</span>
                <span class="stage-summary">把物理资源抽象为可调度能力</span>
              </button>

              <button class="stage-button stage-3" type="button" data-stage="3" aria-pressed="false" aria-controls="stage-detail">
                <span class="stage-number">03</span>
                <span class="stage-title">云部署与应用服务</span>
                <span class="stage-summary">把云资源组合成稳定服务</span>
              </button>

              <button class="stage-button stage-4" type="button" data-stage="4" aria-pressed="false" aria-controls="stage-detail">
                <span class="stage-number">04</span>
                <span class="stage-title">现实对象可被感知</span>
                <span class="stage-summary">让对象可感知可识别可定位</span>
              </button>

              <button class="stage-button stage-5" type="button" data-stage="5" aria-pressed="false" aria-controls="stage-detail">
                <span class="stage-number">05</span>
                <span class="stage-title">网络、边缘与云协同</span>
                <span class="stage-summary">在端边网云之间分配任务</span>
              </button>

              <button class="stage-button stage-6" type="button" data-stage="6" aria-pressed="false" aria-controls="stage-detail">
                <span class="stage-number">06</span>
                <span class="stage-title">智能、安全与反馈</span>
                <span class="stage-summary">让数据形成服务并安全反馈</span>
              </button>
            </div>
          </div>
        </nav>

        <article class="detail-panel" id="stage-detail" aria-live="polite">
          <p class="detail-marker" id="detail-marker">阶段 1 / 6</p>
          <h2 id="detail-title">云资源成为服务</h2>
          <p class="question" id="detail-question">计算资源怎样成为可以按需获得的服务？</p>
          <p class="learning" id="detail-learning">云的基本特征、部署模型和服务模型。</p>

          <div class="outcome-block">
            <p class="section-label">在本阶段中</p>
            <p class="outcome" id="detail-outcome">判断一个系统是否体现云计算特征，并说明资源控制权和服务层次</p>
          </div>

          <div class="lesson-block">
            <p class="section-label">进入小节</p>
            <div class="lesson-list" id="lesson-list">
              <a class="lesson-link" href="../../../_build/slides/cciot-1-1/cciot-1-1.html">
                <span>1.1 云计算概述</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M13 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"></path></svg>
              </a>
            </div>
          </div>
        </article>
      </section>
    </main>

    <footer>CCIOT COURSE MAP · 17 SECTIONS</footer>
  </div>

  <script>
    const stages = {
      1: {
        marker: "阶段 1 / 6",
        title: "云资源成为服务",
        question: "计算资源怎样成为可以按需获得的服务？",
        learning: "云的基本特征、部署模型和服务模型。",
        outcome: "判断一个系统是否体现云计算特征，并说明资源控制权和服务层次",
        lessons: [
          { label: "1.1 云计算概述", href: "cciot-1-1.html" }
        ]
      },
      2: {
        marker: "阶段 2 / 6",
        title: "资源池化与调度",
        question: "云平台怎样隔离、迁移和弹性调度资源？",
        learning: "虚拟化、容器、资源池、弹性与可靠性。",
        outcome: "解释虚拟化、容器和资源池的关系，并分析利用率与隔离边界",
        lessons: [
          { label: "2.1 虚拟化技术", href: "cciot-2-1.html" }
        ]
      },
      3: {
        marker: "阶段 3 / 6",
        title: "云部署与应用服务",
        question: "资源怎样部署、存储和组合成应用服务？",
        learning: "公有云、私有云、容器云、云存储、云应用与高可用。",
        outcome: "依据控制、成本、弹性和可靠性需求选择云部署与应用方案",
        lessons: [
          { label: "3.1 体验公有云", href: "cciot-3-1.html" },
          { label: "4.1 体验私有云", href: "cciot-4-1.html" },
          { label: "5.1 体验容器云", href: "cciot-5-1.html" },
          { label: "6.1 体验云存储", href: "cciot-6-1.html" },
          { label: "7.1 体验云应用", href: "cciot-7-1.html" }
        ]
      },
      4: {
        marker: "阶段 4 / 6",
        title: "现实对象可被感知",
        question: "现实对象怎样产生可以进入系统的数据？",
        learning: "物联网体系、感知、标识、定位与授时。",
        outcome: "为真实对象选择感知、标识和定位方式，并说明数据来源",
        lessons: [
          { label: "8.1 物联网概述", href: "cciot-8-1.html" },
          { label: "9.1 物联网参考模型与技术体系", href: "cciot-9-1.html" },
          { label: "10.1 感知技术", href: "cciot-10-1.html" },
          { label: "11.1 标识技术", href: "cciot-11-1.html" },
          { label: "12.1 定位与授时", href: "cciot-12-1.html" }
        ]
      },
      5: {
        marker: "阶段 5 / 6",
        title: "网络、边缘与云协同",
        question: "哪些任务留在近端，哪些任务交给网络和云？",
        learning: "设备接入、网络传输、层级计算与人机协同。",
        outcome: "画出端—边—网—云的数据与控制路径，并说明各层职责",
        lessons: [
          { label: "13.1 物联网网络", href: "cciot-13-1.html" },
          { label: "14.1 计算技术", href: "cciot-14-1.html" }
        ]
      },
      6: {
        marker: "阶段 6 / 6",
        title: "智能、安全与反馈",
        question: "数据怎样形成判断，并安全地返回现实世界？",
        learning: "数据智能、安全、隐私、应用服务与反馈控制。",
        outcome: "分析物联网应用的价值路径、风险边界和反馈机制",
        lessons: [
          { label: "15.1 数据与智能", href: "cciot-15-1.html" },
          { label: "16.1 安全与隐私保护", href: "cciot-16-1.html" },
          { label: "17.1 物联网应用", href: "cciot-17-1.html" }
        ]
      }
    };

    const stageButtons = [...document.querySelectorAll(".stage-button")];
    const marker = document.querySelector("#detail-marker");
    const title = document.querySelector("#detail-title");
    const question = document.querySelector("#detail-question");
    const learning = document.querySelector("#detail-learning");
    const outcome = document.querySelector("#detail-outcome");
    const lessonList = document.querySelector("#lesson-list");

    function localLessonHref(publishHref) {
      if (window.location.protocol === "file:") {
        const deckDirectory = publishHref.replace(/\.html$/, "");
        return "../../../_build/slides/" + deckDirectory + "/" + publishHref;
      }
      return publishHref;
    }

    function arrowIcon() {
      return `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h12M13 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"></path>
        </svg>`;
    }

    function renderStage(stageNumber, updateHash = true) {
      const stage = stages[stageNumber];
      if (!stage) return;

      stageButtons.forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.stage === String(stageNumber) ? "true" : "false");
      });

      marker.textContent = stage.marker;
      title.textContent = stage.title;
      question.textContent = stage.question;
      learning.textContent = stage.learning;
      outcome.textContent = stage.outcome;
      lessonList.replaceChildren();

      stage.lessons.forEach((lesson) => {
        const link = document.createElement("a");
        link.className = "lesson-link";
        link.href = localLessonHref(lesson.href);
        link.innerHTML = `<span>${lesson.label}</span>${arrowIcon()}`;
        lessonList.append(link);
      });

      if (updateHash) {
        history.replaceState(null, "", `#stage-${stageNumber}`);
      }
    }

    stageButtons.forEach((button) => {
      button.addEventListener("click", () => renderStage(Number(button.dataset.stage)));
    });

    const initialStage = Number(window.location.hash.match(/^#stage-(\d)$/)?.[1] || 1);
    renderStage(stages[initialStage] ? initialStage : 1, false);
  </script>
</body>
</html>
