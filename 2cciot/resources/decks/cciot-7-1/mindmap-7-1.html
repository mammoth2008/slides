<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web 网站上云 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"Web 网站上云","children":[{"content":"作品与交付","children":[{"content":"问题、本人贡献、过程、成果与证据","children":[]},{"content":"请同学打开作品、图片和成果链接","children":[]}]},{"content":"建立网站","children":[{"content":"模板：页面、样式与素材","children":[]},{"content":"AI：真实输入、核验输出、试运行","children":[]}]},{"content":"网站架构","children":[{"content":"静态：返回已有页面和文件","children":[]},{"content":"动态：处理请求与保存变化状态","children":[]},{"content":"数据库：按功能需求选择","children":[]}]},{"content":"部署与验证","children":[{"content":"本地预览、入口、文件与地址","children":[]},{"content":"他人检查内容、图片和成果链接","children":[]},{"content":"排错：域名、目录、路径、权限与混合内容","children":[]}]},{"content":"访问数据","children":[{"content":"收集、清洗、统计与核对","children":[]},{"content":"请求数与访问人数不同","children":[]},{"content":"规模扩展：体量、速度、多样性与价值密度","children":[]}]},{"content":"更新与维护","children":[{"content":"保留版本、发布、验证与恢复","children":[]},{"content":"高可用、负载均衡与弹性伸缩","children":[]},{"content":"保留正式网站，回收临时资源","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
