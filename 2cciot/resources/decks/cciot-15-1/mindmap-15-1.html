<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据与智能 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"数据与智能","children":[{"content":"数据与大数据","children":[{"content":"形式：数值、文本、图像、音频、视频与日志","children":[]},{"content":"语境：对象、时间、地点、单位与来源","children":[]},{"content":"常用 5V 框架：体量、速度、多样性、真实性与价值","children":[]}]},{"content":"数据采集与存储","children":[{"content":"采集：传感器、直接／间接证据与成本","children":[]},{"content":"质量：缺失、异常、重复、单位与版本","children":[]},{"content":"存储：关系、键值、列、文档与图结构","children":[]}]},{"content":"数据挖掘与分析","children":[{"content":"流程：选择、清洗、集成、变换、模式与评估","children":[]},{"content":"方法：分类、回归、聚类、关联、序列与异常","children":[]},{"content":"类型：描述性、预测性与指导性分析","children":[]}]},{"content":"人工智能与机器学习","children":[{"content":"边界：人工智能关注智能行为；挖掘发现模式；机器学习从数据学习模型","children":[]},{"content":"训练：特征、标签、目标、评估与分布变化","children":[]},{"content":"证据：置信、误报、漏报、复核与版本","children":[]}]},{"content":"神经网络与深度学习","children":[{"content":"组成：输入层、隐藏层、输出层、权重与激活","children":[]},{"content":"训练：前向、损失、反向、测试与泛化","children":[]},{"content":"生命周期：部署、监控、更新与回滚","children":[]}]},{"content":"数据智能案例与治理","children":[{"content":"数字观冰：多源感知、预测与运维","children":[]},{"content":"信号灯：群体轨迹、规律与建议","children":[]},{"content":"闭环：行动、隐私、人工判断、审计与责任","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
