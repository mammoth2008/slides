<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>体验私有云 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"体验私有云","children":[{"content":"私有云边界","children":[{"content":"服务对象：组织、部门或受限用户群","children":[]},{"content":"控制范围：数据、网络、平台与容量策略","children":[]},{"content":"部署判断：专用服务、资源控制与组织运维","children":[]}]},{"content":"控制与责任","children":[{"content":"控制收益：位置、网络、硬件与策略","children":[]},{"content":"新增责任：安全、容量、升级与恢复","children":[]},{"content":"条件结论：私有云不自动等于安全或便宜","children":[]}]},{"content":"平台角色","children":[{"content":"虚拟化层：呈现虚拟资源","children":[]},{"content":"云管理平台：编排计算、网络、存储与镜像","children":[]},{"content":"入口与对象：Dashboard、API、配额与实例","children":[]}]},{"content":"双节点协同","children":[{"content":"控制节点：请求、调度与平台状态","children":[]},{"content":"计算节点：承载云主机","children":[]},{"content":"网络分工：管理通信与外部访问","children":[]}]},{"content":"创建云主机","children":[{"content":"对象依赖：网络、子网、实例类型与镜像","children":[]},{"content":"创建证据：状态、控制台与服务","children":[]},{"content":"容量边界：节点资源与配额","children":[]}]},{"content":"课堂演示","children":[{"content":"预装环境：跳过安装步骤，集中观察资源证据","children":[]},{"content":"最小链：启动、配置、创建、登录","children":[]},{"content":"平台证据：控制入口、实例状态、系统登录与应用可用性","children":[]}]},{"content":"生命周期","children":[{"content":"状态变化：重启、暂停、关闭与删除","children":[]},{"content":"回收判断：实例、卷、网络与快照","children":[]},{"content":"云性结论：统一资源服务与组织控制","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
