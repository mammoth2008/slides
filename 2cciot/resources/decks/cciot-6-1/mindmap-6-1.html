<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>体验云存储 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"体验云存储","children":[{"content":"云存储服务","children":[{"content":"在线数据：存放、读取、扩展与保护","children":[]},{"content":"条件能力：冗余、网络、身份与权限","children":[]},{"content":"服务责任：平台托管与用户治理","children":[]}]},{"content":"存储分类","children":[{"content":"控制边界：个人、私有、公有与混合","children":[]},{"content":"访问形式：文件、块与对象","children":[]},{"content":"两轴交叉：同一服务具有多种属性","children":[]}]},{"content":"文件块对象","children":[{"content":"文件：目录与共享接口","children":[]},{"content":"块：主机可挂载磁盘","children":[]},{"content":"对象：数据、元数据与 API","children":[]}]},{"content":"对象存储对象模型","children":[{"content":"桶：对象容器和策略边界","children":[]},{"content":"对象：内容、名称和元数据","children":[]},{"content":"访问：身份、权限、网络和状态","children":[]}]},{"content":"生命周期演示","children":[{"content":"准备：样例、权限、临时桶","children":[]},{"content":"操作：上传、读取、更新、版本与删除","children":[]},{"content":"证据：列表、元数据、下载和回收状态","children":[]}]},{"content":"治理与回收","children":[{"content":"版本：删除标记、恢复与彻底删除","children":[]},{"content":"保护：权限、加密、备份与恢复","children":[]},{"content":"长期边界：容量、网络、成本与迁移","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
