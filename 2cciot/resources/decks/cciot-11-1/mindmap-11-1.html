<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>标识技术 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"标识技术","children":[{"content":"标识基础","children":[{"content":"对象：目标对象与识别者","children":[]},{"content":"要素：标：设计与分配；识：读取与解析","children":[]},{"content":"属性：语境、唯一、安全、隐私与规范","children":[]}]},{"content":"合作式与非合作式识别","children":[{"content":"合作式：对象按约定呈现或返回编码","children":[]},{"content":"非合作式：识别者从特征推断标识","children":[]},{"content":"证据：协议、模型、阈值与人工复核","children":[]}]},{"content":"条码技术","children":[{"content":"一维：条、空、数据符与定界","children":[]},{"content":"二维：模块、定位与纠错","children":[]},{"content":"识别链：光学获取、解码与应用映射","children":[]}]},{"content":"RFID 技术","children":[{"content":"组成：阅读器、天线与标签","children":[]},{"content":"交互：射频能量、查询与返回","children":[]},{"content":"边界：冲突、环境、权限与标签生命周期","children":[]}]},{"content":"特征识别","children":[{"content":"流程：采集、特征、匹配、置信度与复核","children":[]},{"content":"技术：OCR、生物特征与机器学习","children":[]},{"content":"风险：误识、偏差、隐私和申诉","children":[]}]},{"content":"多标识工程","children":[{"content":"主体：用户、设备、平台与运维","children":[]},{"content":"关系：绑定、转移、停用与审计","children":[]},{"content":"案例：共享车辆与智能餐盘","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
