<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>虚拟化技术 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"虚拟化技术","children":[{"content":"为什么需要虚拟化","children":[{"content":"固定分配：空闲资源难以复用","children":[]},{"content":"资源抽象：物理能力变成逻辑资源","children":[]},{"content":"判断证据：虚拟硬件与客户系统","children":[]}]},{"content":"虚拟机如何运行","children":[{"content":"分层关系：硬件、宿主、虚拟化层与客户系统","children":[]},{"content":"虚拟机与容器：独立客户系统与共享内核","children":[]},{"content":"两种位置：Type 1 与 Type 2","children":[]},{"content":"隔离边界：相对独立与共同故障","children":[]}]},{"content":"工具角色","children":[{"content":"桌面虚拟化：Workstation","children":[]},{"content":"内核与设备：KVM 配合 QEMU","children":[]},{"content":"环境分工：完整虚拟机与 WSL2","children":[]}]},{"content":"虚拟网络","children":[{"content":"桥接：进入物理局域网","children":[]},{"content":"NAT：通过宿主机访问外部网络","children":[]},{"content":"仅主机：限制在宿主机私有网络","children":[]}]},{"content":"虚拟机演示","children":[{"content":"资源视图：架构、内存、磁盘与网卡","children":[]},{"content":"远程管理：从 NAT 联网到 SSH","children":[]},{"content":"故障判断：地址、路径、服务、端口与认证","children":[]}]},{"content":"状态管理","children":[{"content":"快照：回到同一环境的较早状态","children":[]},{"content":"克隆：创建另一台独立虚拟机","children":[]},{"content":"备份：抵御原环境或介质丢失","children":[]}]},{"content":"WSL2","children":[{"content":"托管虚拟机：运行真实 Linux 内核","children":[]},{"content":"最小使用链：检查、安装、进入与使用","children":[]},{"content":"环境选择：机制观察与日常工作","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
