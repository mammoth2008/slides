<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>体验容器云 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"体验容器云","children":[{"content":"容器运行边界","children":[{"content":"应用交付：从完整云主机到运行环境","children":[]},{"content":"共享内核：进程、资源与隔离条件","children":[]},{"content":"条件优势：启动、利用率、一致性与可移植性","children":[]}]},{"content":"镜像与运行时","children":[{"content":"镜像：应用、依赖与启动信息","children":[]},{"content":"运行时：创建、启动、停止与删除","children":[]},{"content":"仓库链：标记、推送、拉取与权限","children":[]}]},{"content":"Kubernetes 集群","children":[{"content":"控制平面：接收声明、协调调度与期望状态","children":[]},{"content":"工作节点：CPU、内存、网络与存储","children":[]},{"content":"Pod 与工作负载：运行单元与副本声明","children":[]}]},{"content":"Service 与访问","children":[{"content":"选择器：找到符合条件的 Pod","children":[]},{"content":"端口路径：Service、容器端口与网络边界","children":[]},{"content":"四类证据：控制、运行、网络与应用响应","children":[]}]},{"content":"体验部署链","children":[{"content":"预检：镜像、仓库、集群与节点","children":[]},{"content":"部署：工作负载、Pod、Service 与访问","children":[]},{"content":"回收：本次创建的对象与临时网络资源","children":[]}]},{"content":"生命周期与责任","children":[{"content":"内容与运行：镜像、Pod 和工作负载","children":[]},{"content":"数据与入口：卷、备份、Service 和端口","children":[]},{"content":"治理闭环：安全、容量、观察和回收","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
