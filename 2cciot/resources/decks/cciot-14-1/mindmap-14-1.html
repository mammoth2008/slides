<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>计算技术 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"计算技术","children":[{"content":"计算任务与主体","children":[{"content":"任务：输入、规则、输出","children":[]},{"content":"约束：实时、吞吐、资源、可靠、隐私与责任","children":[]},{"content":"主体：端、边、云、人和群体","children":[]}]},{"content":"端计算","children":[{"content":"优势：低延迟、少通信、离线与本地隐私","children":[]},{"content":"方案：定制化与通用化","children":[]},{"content":"边界：算力、存储、电池、更新与物理安全","children":[]}]},{"content":"边缘计算与卸载","children":[{"content":"位置：靠近数据源的计算节点或网关","children":[]},{"content":"方式：本地执行、全卸载、部分卸载","children":[]},{"content":"代价：通信、能耗、延迟、隐私与故障","children":[]}]},{"content":"云计算与服务","children":[{"content":"资源：计算、存储、数据库、网络与应用","children":[]},{"content":"模式：IaaS、PaaS、SaaS","children":[]},{"content":"边界：远程、伸缩、服务责任与数据主权","children":[]}]},{"content":"人机协同计算","children":[{"content":"人计算：人的判断作为计算资源","children":[]},{"content":"众包计算：把可分解任务分给大量参与者","children":[]},{"content":"社会计算：群体互动、知识与集体决策","children":[]},{"content":"协同：增强、自动化、放大与接管","children":[]}]},{"content":"计算案例与治理","children":[{"content":"自动驾驶：端、边、云的任务分工","children":[]},{"content":"智慧医疗：机器辅助与医生最终判断","children":[]},{"content":"闭环：版本、隐私、审计、降级和恢复","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
