<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">物联网物理对象与信息服务回路</title>
  <desc id="desc">左侧现实对象经过感知和网络连接进入云端服务，结果沿回路返回执行器，表达物质世界与信息世界的连接</desc>
  <defs>
