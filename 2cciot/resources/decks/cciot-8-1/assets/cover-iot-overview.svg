      <stop offset="0" stop-color="#f6fbfc"/>
      <stop offset="0.58" stop-color="#e7f3f4"/>
      <stop offset="1" stop-color="#d5e8e9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#d9ebec" stop-opacity="0.86"/>
    </linearGradient>
    <pattern id="mesh" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#2d7076" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="11" stdDeviation="13" flood-color="#164b52" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="960" fill="url(#bg)"/>
  <rect width="1280" height="960" fill="url(#mesh)"/>

