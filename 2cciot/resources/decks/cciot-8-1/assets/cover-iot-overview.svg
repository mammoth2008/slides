    <rect x="735" y="372" width="206" height="132" rx="18" fill="url(#panel)" stroke="#286b72" stroke-width="4"/>
    <rect x="984" y="225" width="156" height="114" rx="18" fill="url(#panel)" stroke="#286b72" stroke-width="4"/>
