<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物联网概述 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"物联网概述","children":[{"content":"技术与产业背景","children":[{"content":"技术条件：芯片、计算与通信","children":[]},{"content":"应用需求：数字化、效率、资源与服务","children":[]},{"content":"汇合判断：能连接不等于有价值","children":[]}]},{"content":"形成与发展线索","children":[{"content":"网络：互联网、移动通信与机器互联","children":[]},{"content":"标识：条码、RFID 与对象身份","children":[]},{"content":"感知与系统：传感器、执行器与物理信息系统","children":[]}]},{"content":"物联网概念","children":[{"content":"物理实体：设备、车辆、建筑和环境","children":[]},{"content":"信息属性：标识、协议、数据与计算","children":[]},{"content":"反馈闭环：观测、决策、执行与服务","children":[]}]},{"content":"五项基本特征","children":[{"content":"物源：物是行为发起端、对象与作用端","children":[]},{"content":"泛在：成规模接入与协同","children":[]},{"content":"智能：数据与计算支持决策","children":[]},{"content":"高阶：多个系统协同","children":[]},{"content":"服务：回应现实目标","children":[]}]},{"content":"价值与边界","children":[{"content":"行业价值：农业、工业、交通、城市与健康","children":[]},{"content":"绿色价值：更精细的测量与控制","children":[]},{"content":"风险边界：安全、隐私、标准、维护与责任","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
