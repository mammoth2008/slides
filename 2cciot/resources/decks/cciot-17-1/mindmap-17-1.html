<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物联网应用 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"物联网应用","children":[{"content":"应用价值与闭环","children":[{"content":"闭环：对象、感知、网络、计算、决策、执行与反馈","children":[]},{"content":"价值：效率、安全、体验／健康、资源与可持续","children":[]},{"content":"证据：目标、基线、指标、用户、异常与责任","children":[]}]},{"content":"智能电网","children":[{"content":"环节：发电、输电、变电、配电与用电","children":[]},{"content":"能力：感知、仪表、通信、平台、调度与需求响应","children":[]},{"content":"双流：能量流与信息／控制流协同","children":[]},{"content":"边界：安全隔离、人工确认、故障保护与恢复","children":[]}]},{"content":"智能交通","children":[{"content":"对象：人、车、路与环境","children":[]},{"content":"角色：设备、网络、平台与应用（可组合）","children":[]},{"content":"协同：V2X 支撑部分协同；完整出行连接多段服务与责任","children":[]}]},{"content":"智能家居","children":[{"content":"角色：设备、网络、网关、平台、终端与服务","children":[]},{"content":"能力：场景、个性化、意图理解与能源管理","children":[]},{"content":"边界：本地或云端按任务选择，最小化、确认、撤销与接管","children":[]}]},{"content":"未来愿景与以人为本","children":[{"content":"方向：自主、立体、绿色与以人为本；并列方向，不是自动递进顺序","children":[]},{"content":"原则：可拒绝、可替代、可解释、可申诉与数字包容","children":[]},{"content":"责任：公平、韧性、环境、维护与公共利益","children":[]}]},{"content":"端到端方案设计与复盘","children":[{"content":"需求：用户、对象、问题、基线与价值","children":[]},{"content":"体系：设备、标识、定位、网络、计算、数据、安全、应用与执行","children":[]},{"content":"复盘：指标、证据、接管、恢复、反馈与版本","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
