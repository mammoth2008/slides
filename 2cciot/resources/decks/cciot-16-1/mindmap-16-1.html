<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安全与隐私保护 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"安全与隐私保护","children":[{"content":"安全与隐私边界","children":[{"content":"安全：设备、网络、数据与服务的可信运行","children":[]},{"content":"隐私：个人信息的收集、使用、公开与控制","children":[]},{"content":"边界：物理世界、信息世界、人的行动与后果","children":[]}]},{"content":"威胁面与 CIA","children":[{"content":"设备：物理、固件、弱口令与供应链","children":[]},{"content":"信息：窃听、伪造、重放、拒绝服务与云配置","children":[]},{"content":"应用：业务逻辑、异常数据、控制链操纵与组合失效","children":[]},{"content":"属性：机密性、完整性与可用性","children":[]}]},{"content":"纵深安全控制","children":[{"content":"设备：封装、可信启动、签名、更新与密钥","children":[]},{"content":"信息：加密、信息隐藏／水印、认证、访问、隔离与审计","children":[]},{"content":"应用：逻辑、异常、接管、响应与恢复","children":[]},{"content":"运维：最小权限、监控、更新、回滚与响应","children":[]}]},{"content":"隐私生命周期","children":[{"content":"采集：目的、权限、物理阻断与最小化","children":[]},{"content":"传输／存储：加密、访问、保留与备份","children":[]},{"content":"分析／处理：用途、分域、受控计算与模型输入","children":[]},{"content":"发布／共享：精度、可关联性、撤回与删除","children":[]}]},{"content":"隐私计算与共享","children":[{"content":"变换：匿名、去标识化、失真、模糊与合成","children":[]},{"content":"计算：同态加密、安全多方计算与联邦学习","children":[]},{"content":"边界：模型、输出、身份、密钥与重识别","children":[]}]},{"content":"安全隐私案例与治理","children":[{"content":"医疗：设备、网络、患者和远程维护","children":[]},{"content":"LBS：便利、轨迹、行为和位置隐私","children":[]},{"content":"闭环：控制、证据、响应、申诉与责任","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
