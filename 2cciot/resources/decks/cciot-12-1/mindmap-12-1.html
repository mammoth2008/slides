<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>定位与授时 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"定位与授时","children":[{"content":"三要素与任务","children":[{"content":"要素：对象／事件、空间与时间","children":[]},{"content":"方向：正问题与反问题","children":[]},{"content":"需求：绝对／相对、精度与同步范围","children":[]}]},{"content":"几何定位","children":[{"content":"参照：锚节点与已知位置","children":[]},{"content":"测量：TOA、往返时间、TDoA 与 AoA","children":[]},{"content":"求解：方程、优化、误差与锚点几何","children":[]}]},{"content":"特征定位与航位推算","children":[{"content":"指纹：离线建图与在线匹配","children":[]},{"content":"模型：最近邻、KNN 与环境变化","children":[]},{"content":"航位：起点、距离、方向与累计漂移","children":[]}]},{"content":"授时与时钟同步","children":[{"content":"漂移：晶振、温度、休眠与延迟","children":[]},{"content":"方法：单向、参考广播与双向四时间戳","children":[]},{"content":"目标：事件排序、时长测量与协同控制","children":[]}]},{"content":"定位系统选择","children":[{"content":"室外：卫星导航与蜂窝定位","children":[]},{"content":"室内：几何、指纹、航位与组合","children":[]},{"content":"授时：NTP 层级与可信来源","children":[]}]},{"content":"时空案例与治理","children":[{"content":"案例：数字牧场、室内 AGV 与定位鞋","children":[]},{"content":"闭环：对象标识、证据、回传、行动与复核","children":[]},{"content":"边界：轨迹、权限、保留和隐私","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
