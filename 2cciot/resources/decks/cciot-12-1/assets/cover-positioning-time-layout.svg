<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">物联网定位与授时示意图</title>
  <desc id="desc">锚节点通过距离关系定位目标，同时通过共享时钟建立时间基准</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="0.55" stop-color="#e6f2f3"/>
      <stop offset="1" stop-color="#d1e6e8"/>
    </linearGradient>
    <pattern id="mesh" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#2c6f77" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="11" stdDeviation="13" flood-color="#164b52" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1280" height="960" fill="url(#bg)"/>
  <rect width="1280" height="960" fill="url(#mesh)"/>

  <g transform="translate(635 235) scale(0.5)">
  <g fill="none" stroke="#2c7077" stroke-opacity="0.22" stroke-width="3">
    <circle cx="626" cy="470" r="176"/>
    <circle cx="626" cy="470" r="292"/>
    <circle cx="626" cy="470" r="408"/>
  </g>
  <g fill="none" stroke="#d87843" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 14">
    <path d="M236 244L626 470L1044 282"/>
    <path d="M236 244L626 470L1030 726"/>
    <path d="M236 244L626 470L268 726"/>
  </g>

  <g filter="url(#shadow)" stroke="#286b72" stroke-width="4">
    <circle cx="236" cy="244" r="36" fill="#ffffff"/>
    <circle cx="1044" cy="282" r="36" fill="#ffffff"/>
    <circle cx="1030" cy="726" r="36" fill="#ffffff"/>
    <circle cx="268" cy="726" r="36" fill="#ffffff"/>
    <circle cx="626" cy="470" r="54" fill="#f7fbfb"/>
  </g>
  <g fill="#d87843" stroke="#ffffff" stroke-width="5">
    <circle cx="236" cy="244" r="13"/>
    <circle cx="1044" cy="282" r="13"/>
    <circle cx="1030" cy="726" r="13"/>
    <circle cx="268" cy="726" r="13"/>
    <circle cx="626" cy="470" r="18"/>
  </g>

  <g transform="translate(86 92)" fill="#ffffff" fill-opacity="0.92" stroke="#2b6e74" stroke-width="4">
    <circle cx="68" cy="68" r="55"/>
    <path d="M68 68V32M68 68L97 85" fill="none" stroke="#d87843" stroke-width="7" stroke-linecap="round"/>
    <circle cx="68" cy="68" r="7" fill="#d87843" stroke="none"/>
  </g>
  <g transform="translate(1088 104)" fill="none" stroke="#2b6e74" stroke-width="4" stroke-linecap="round">
    <path d="M0 46h68M0 72h68M0 98h68"/>
    <circle cx="90" cy="46" r="9" fill="#d87843" stroke="none"/>
    <circle cx="90" cy="72" r="9" fill="#d87843" stroke="none"/>
    <circle cx="90" cy="98" r="9" fill="#d87843" stroke="none"/>
  </g>
  </g>
</svg>
