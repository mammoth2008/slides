<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">弹性容量随负载变化</title>
  <desc id="desc">低负载时使用两个实例，高峰时扩展到五个实例，负载回落后再收缩到两个实例</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf5f6"/>
    </linearGradient>
    <g id="server">
      <rect width="64" height="54" rx="8" fill="#ffffff" stroke="#0d6475" stroke-width="4"/>
      <rect x="10" y="12" width="34" height="5" rx="2.5" fill="#94adb5"/>
      <rect x="10" y="25" width="34" height="5" rx="2.5" fill="#94adb5"/>
      <circle cx="52" cy="15" r="4" fill="#c26432"/>
      <circle cx="52" cy="28" r="4" fill="#0d6475"/>
      <rect x="10" y="40" width="44" height="4" rx="2" fill="#dff0f2"/>
    </g>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#c26432"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="596" height="796" rx="28" fill="#f7fbfc" stroke="#94adb5" stroke-width="4"/>
  <text x="300" y="58" text-anchor="middle" fill="#102a35" font-family="Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">负载变化，容量随之调整</text>

  <g transform="translate(42 92)">
    <rect width="516" height="178" rx="22" fill="url(#panel)" stroke="#c5d6da" stroke-width="3"/>
    <text x="28" y="46" fill="#0d6475" font-family="Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">低负载</text>
    <text x="28" y="83" fill="#45616c" font-family="Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="23">维持 2 个实例</text>
    <g transform="translate(28 112)">
      <rect width="92" height="12" rx="6" fill="#dff0f2"/>
      <rect width="32" height="12" rx="6" fill="#0d6475"/>
    </g>
    <use href="#server" x="330" y="60"/>
    <use href="#server" x="408" y="60"/>
  </g>

  <path d="M300 282 L300 316" stroke="#c26432" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(42 326)">
    <rect width="516" height="210" rx="22" fill="#faebdf" stroke="#c26432" stroke-width="3"/>
    <text x="28" y="46" fill="#c26432" font-family="Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">业务高峰</text>
    <text x="28" y="83" fill="#45616c" font-family="Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="23">扩展到 5 个实例</text>
    <g transform="translate(28 112)">
      <rect width="92" height="12" rx="6" fill="#f1cfba"/>
      <rect width="84" height="12" rx="6" fill="#c26432"/>
    </g>
    <use href="#server" x="196" y="58"/>
    <use href="#server" x="274" y="58"/>
    <use href="#server" x="352" y="58"/>
    <use href="#server" x="235" y="126"/>
    <use href="#server" x="313" y="126"/>
  </g>

  <path d="M300 548 L300 582" stroke="#c26432" stroke-width="6" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(42 592)">
    <rect width="516" height="166" rx="22" fill="url(#panel)" stroke="#c5d6da" stroke-width="3"/>
    <text x="28" y="46" fill="#0d6475" font-family="Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">负载回落</text>
    <text x="28" y="83" fill="#45616c" font-family="Source Han Sans SC, Microsoft YaHei, sans-serif" font-size="23">收缩到 2 个实例</text>
    <g transform="translate(28 112)">
      <rect width="92" height="12" rx="6" fill="#dff0f2"/>
      <rect width="28" height="12" rx="6" fill="#0d6475"/>
    </g>
    <use href="#server" x="330" y="54"/>
    <use href="#server" x="408" y="54"/>
  </g>
</svg>
