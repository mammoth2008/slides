<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云计算概述 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"云计算概述","children":[{"content":"为什么需要云","children":[{"content":"需求有峰谷：固定容量平时闲置、高峰不足","children":[]},{"content":"供给方式：从购买转向按需获取","children":[]}]},{"content":"识别云计算","children":[{"content":"定义共识：资源通过网络按需供给","children":[]},{"content":"判断线索：联网不足以证明云计算","children":[]},{"content":"五项基本特征","children":[{"content":"按需自助与广泛访问","children":[]},{"content":"资源池化、快速弹性与计量服务","children":[]}]}]},{"content":"资源池与弹性","children":[{"content":"资源池：聚合、抽象、调度与回收","children":[]},{"content":"弹性：资源随负载持续扩缩","children":[]}]},{"content":"部署模型","children":[{"content":"分类依据：服务对象与控制边界","children":[]},{"content":"公有云、私有云、社区云与混合云","children":[]}]},{"content":"服务模型","children":[{"content":"分类依据：交付层次与管理责任","children":[]},{"content":"IaaS：用户管理操作系统与应用","children":[]},{"content":"PaaS：用户管理应用与数据","children":[]},{"content":"SaaS：用户管理业务配置与内容","children":[]}]},{"content":"云与物联网","children":[{"content":"终端：本地感知与执行","children":[]},{"content":"边缘：区域实时处理","children":[]},{"content":"云端：全局数据与服务","children":[]},{"content":"放置依据：时延、数据范围与现场自治","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":500,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
