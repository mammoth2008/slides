<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>体验公有云 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }

    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }

    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"体验公有云","children":[{"content":"公有云服务","children":[{"content":"判断证据：面向外部用户的标准服务与共享资源池","children":[]},{"content":"获取方式：按需申请、计量与回收","children":[]},{"content":"分类关系：部署模型与服务模型","children":[]},{"content":"虚拟化基础：逻辑资源与物理设施","children":[]}]},{"content":"谁管理什么","children":[{"content":"提供商：建设和运行基础设施","children":[]},{"content":"租户：配置、系统、应用、数据与费用","children":[]},{"content":"使用条件：选规格、设监控、维护系统并清理残留资源","children":[]}]},{"content":"位置选择","children":[{"content":"区域：地理服务范围","children":[]},{"content":"可用区：基础设施故障边界","children":[]},{"content":"高可用：计算、数据与访问共同冗余","children":[]}]},{"content":"云中网络","children":[{"content":"空间关系：VPC 通常覆盖一个区域，可跨多个可用区；子网通常位于一个可用区","children":[]},{"content":"实例通信：私有 IP；外部访问：公网入口","children":[]},{"content":"访问条件：安全组、系统服务与凭证共同决定能否连接","children":[]}]},{"content":"实例配置","children":[{"content":"计算与系统：规格和镜像","children":[]},{"content":"数据与网络：云硬盘和访问范围","children":[]},{"content":"选择依据：负载、时长与失败后果","children":[]}]},{"content":"创建、验证与回收","children":[{"content":"创建：位置、网络、实例、访问与费用","children":[]},{"content":"验证：运行、登录与应用三层证据","children":[]},{"content":"管理：监控、调整、保护与回收","children":[]}]},{"content":"云特征回扣","children":[{"content":"按需自助与广泛网络访问","children":[]},{"content":"资源池化、快速弹性与可计量","children":[]},{"content":"永不过时：可调整不等于无需管理","children":[]}]}]};
