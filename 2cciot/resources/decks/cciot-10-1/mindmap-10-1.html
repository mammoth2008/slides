<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>感知技术 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"感知技术","children":[{"content":"感知基础","children":[{"content":"感：传感器检测和测量","children":[]},{"content":"知：解析、解释和理解","children":[]},{"content":"流程：信号、数据、判断与执行","children":[]}]},{"content":"传感器与数字化","children":[{"content":"组成：敏感元件、转换元件与调理","children":[]},{"content":"信号：模拟、噪声、衰减与数字再生","children":[]},{"content":"数字化：ADC 采样与量化；数字域：校准、标识与异常诊断","children":[]}]},{"content":"泛在互连与智能融合","children":[{"content":"节点：感知、计算、通信与能量","children":[]},{"content":"融合：节点内、节点间与多模态","children":[]},{"content":"绿色：低功耗、休眠、无源化、能量采集与本地处理","children":[]}]},{"content":"传感器组成与类型","children":[{"content":"温度、气敏、超声、图像与光纤","children":[]},{"content":"选择：参量、量程、响应、环境与维护","children":[]},{"content":"边界：能测到不等于长期稳定","children":[]}]},{"content":"无线传感器网络","children":[{"content":"结构：节点、邻居、多跳与汇聚","children":[]},{"content":"覆盖：点、栅栏、区域与空洞","children":[]},{"content":"寿命：路由、融合、休眠与能量","children":[]}]},{"content":"案例与工程权衡","children":[{"content":"场景：围界、生态、矿井、农业与用电","children":[]},{"content":"证据：精度、误报、延迟、寿命与反馈","children":[]},{"content":"方法：对象、设备、网络、判断与服务","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
