<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物联网网络 · Mind Map</title>
  <link rel="stylesheet" href="../../theme/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body, #mindmap { width: 100%; height: 100%; background: #fff; }
    html { font-synthesis: none; }
    svg text, .markmap-foreign { font-family: "Course Source Han Sans", "Source Han Sans SC", sans-serif; color: #15232d; fill: #15232d; font-size: 24px; }
    .markmap-foreign { line-height: 1.2; }
    #mindmap .markmap-foreign strong { color: #a8542b; font-weight: inherit !important; }
    .markmap-node > circle { fill: #a8542b; }
    .markmap-link { stroke: rgba(21, 35, 45, .22); }
  </style>
</head>
<body>
  <svg id="mindmap"></svg>
  <script src="../../../../resources/impress/vendor/markmap/d3.min.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/browser-index.js"></script>
  <script src="../../../../resources/impress/vendor/markmap/index.js"></script>
  <script>
    const tree = {"content":"物联网网络","children":[{"content":"网络抽象","children":[{"content":"结构：节点、链路、路径与路由","children":[]},{"content":"角色：终端、转发设备、网关、源与宿","children":[]},{"content":"责任：采集、转发、处理、反馈与维护","children":[]}]},{"content":"网络分类与范围","children":[{"content":"媒介：有线与无线","children":[]},{"content":"建设与管理：公用网与专用网","children":[]},{"content":"覆盖：PAN、LAN、WAN；它们是覆盖尺度，不是必经层级","children":[]}]},{"content":"个域网","children":[{"content":"蓝牙：发现、配对与短距离低功耗","children":[]},{"content":"ZigBee：协调器、路由器与终端节点","children":[]},{"content":"拓扑：直连、星形、网状与簇状","children":[]}]},{"content":"局域网","children":[{"content":"Wi-Fi：BSS、ESS、AP 与漫游","children":[]},{"content":"工业网络：总线、工业以太网与 TSN 思路","children":[]},{"content":"指标：吞吐、时延、确定性、冗余与抗干扰","children":[]}]},{"content":"广域网","children":[{"content":"移动通信：小区、切换、漫游与业务方向","children":[]},{"content":"LPWAN：低功耗、长距离与低速率","children":[]},{"content":"选择：NB-IoT 的运营商网络与 LoRaWAN 的自建或第三方网络","children":[]}]},{"content":"多网络案例","children":[{"content":"远程抄表：低频数据与广域接入","children":[]},{"content":"共享单车：蓝牙、手机、移动通信与云","children":[]},{"content":"智能家居：Wi-Fi、个域网、以太网与网关","children":[]}]}]};
    const options = {"color":"#a8542b","maxWidth":600,"spacingHorizontal":88,"spacingVertical":12,"initialExpandLevel":2,"duration":0,"autoFit":false,"fitRatio":0.9,"maxInitialScale":1};
    const api = window.markmap;
    window.mm = api.Markmap.create("svg#mindmap", {...options, color: () => options.color}, tree);
  </script>
</body>
</html>
