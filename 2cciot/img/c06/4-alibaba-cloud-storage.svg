<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aliGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6a00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#722ed1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#531dab;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nasGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#13c2c2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#08979c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="archiveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#52c41a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#389e0d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">阿里云存储服务</text>

  <!-- Alibaba Cloud -->
  <ellipse cx="300" cy="70" rx="90" ry="30" fill="#ff6a00" opacity="0.2"/>
  <text x="300" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ff6a00">阿里云</text>

  <!-- OSS Service -->
  <g id="oss">
    <rect x="50" y="130" width="180" height="120" rx="10" fill="url(#ossGrad)" stroke="#096dd9" stroke-width="2"/>
    <text x="140" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">对象存储 OSS</text>
    <text x="140" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Object Storage</text>
    <text x="60" y="205" font-family="Arial, sans-serif" font-size="11" fill="white">• 海量存储</text>
    <text x="60" y="220" font-family="Arial, sans-serif" font-size="11" fill="white">• 安全可靠</text>
    <text x="60" y="235" font-family="Arial, sans-serif" font-size="11" fill="white">• 低成本</text>
  </g>

  <!-- 云盘 Service -->
  <g id="disk">
    <rect x="250" y="130" width="180" height="120" rx="10" fill="url(#diskGrad)" stroke="#531dab" stroke-width="2"/>
    <text x="340" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">云盘</text>
    <text x="340" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">块存储</text>
    <text x="260" y="205" font-family="Arial, sans-serif" font-size="11" fill="white">• 高性能</text>
    <text x="260" y="220" font-family="Arial, sans-serif" font-size="11" fill="white">• 弹性扩展</text>
    <text x="260" y="235" font-family="Arial, sans-serif" font-size="11" fill="white">• 快照备份</text>
  </g>

  <!-- NAS Service -->
  <g id="nas">
    <rect x="50" y="270" width="180" height="120" rx="10" fill="url(#nasGrad)" stroke="#08979c" stroke-width="2"/>
    <text x="140" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">文件存储 NAS</text>
    <text x="140" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Network Attached</text>
    <text x="60" y="345" font-family="Arial, sans-serif" font-size="11" fill="white">• 共享访问</text>
    <text x="60" y="360" font-family="Arial, sans-serif" font-size="11" fill="white">• 高吞吐</text>
    <text x="60" y="375" font-family="Arial, sans-serif" font-size="11" fill="white">• 企业级</text>
  </g>

  <!-- 归档存储 Service -->
  <g id="archive">
    <rect x="250" y="270" width="180" height="120" rx="10" fill="url(#archiveGrad)" stroke="#389e0d" stroke-width="2"/>
    <text x="340" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">归档存储</text>
    <text x="340" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">冷数据存储</text>
    <text x="260" y="345" font-family="Arial, sans-serif" font-size="11" fill="white">• 极低成本</text>
    <text x="260" y="360" font-family="Arial, sans-serif" font-size="11" fill="white">• 长期保存</text>
    <text x="260" y="375" font-family="Arial, sans-serif" font-size="11" fill="white">• 安全合规</text>
  </g>

  <!-- 混合云存储阵列 -->
  <g id="hybrid">
    <rect x="450" y="200" width="130" height="120" rx="10" fill="#fadb14" stroke="#d4b106" stroke-width="2"/>
    <text x="515" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#595959">混合云存储</text>
    <text x="515" y="243" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#595959">阵列</text>
    <text x="460" y="265" font-family="Arial, sans-serif" font-size="10" fill="#595959">• 企业级</text>
    <text x="460" y="280" font-family="Arial, sans-serif" font-size="10" fill="#595959">• 本地部署</text>
    <text x="460" y="295" font-family="Arial, sans-serif" font-size="10" fill="#595959">• 云端扩展</text>
  </g>

  <!-- Connection lines from Alibaba Cloud -->
  <line x1="300" y1="100" x2="140" y2="130" stroke="#ff6a00" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="100" x2="340" y2="130" stroke="#ff6a00" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="100" x2="140" y2="270" stroke="#ff6a00" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="100" x2="340" y2="270" stroke="#ff6a00" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="100" x2="515" y2="200" stroke="#ff6a00" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Features -->
  <text x="50" y="420" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">特点:</text>
  <text x="100" y="420" font-family="Arial, sans-serif" font-size="11" fill="#555">OSS: 图片/视频存储、CDN源站</text>
  <text x="350" y="420" font-family="Arial, sans-serif" font-size="11" fill="#555">云盘: ECS系统盘、数据库</text>
  <text x="50" y="440" font-family="Arial, sans-serif" font-size="11" fill="#555">NAS: 文件共享、Web服务</text>
  <text x="250" y="440" font-family="Arial, sans-serif" font-size="11" fill="#555">归档: 合规存储、数据备份</text>
</svg>