<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="caseGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="caseGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#30cfd0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#330867;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="caseGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="caseGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">存储云应用场景</text>

  <!-- Backup & Disaster Recovery -->
  <g id="backup">
    <rect x="20" y="60" width="300" height="150" rx="10" fill="url(#caseGrad1)" stroke="#e63946" stroke-width="2"/>
    <text x="170" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">数据备份与灾难恢复</text>

    <!-- Backup icons -->
    <rect x="40" y="110" width="40" height="40" fill="white" opacity="0.8" rx="5"/>
    <text x="60" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">本地</text>

    <text x="90" y="135" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white">→</text>

    <rect x="110" y="110" width="40" height="40" fill="white" opacity="0.8" rx="5"/>
    <text x="130" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">云端</text>

    <text x="170" y="165" font-family="Arial, sans-serif" font-size="12" fill="white">• 自动备份策略</text>
    <text x="170" y="180" font-family="Arial, sans-serif" font-size="12" fill="white">• 多地域复制</text>
    <text x="170" y="195" font-family="Arial, sans-serif" font-size="12" fill="white">• 快速恢复</text>
  </g>

  <!-- Big Data Analytics -->
  <g id="bigdata">
    <rect x="380" y="60" width="300" height="150" rx="10" fill="url(#caseGrad2)" stroke="#2a9d8f" stroke-width="2"/>
    <text x="530" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">大数据分析存储</text>

    <!-- Big data representation -->
    <rect x="420" y="110" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="450" y="110" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="480" y="110" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="510" y="110" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="540" y="110" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="570" y="110" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="600" y="110" width="25" height="15" fill="white" opacity="0.8"/>

    <rect x="420" y="130" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="450" y="130" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="480" y="130" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="510" y="130" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="540" y="130" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="570" y="130" width="25" height="15" fill="white" opacity="0.8"/>
    <rect x="600" y="130" width="25" height="15" fill="white" opacity="0.8"/>

    <text x="530" y="165" font-family="Arial, sans-serif" font-size="12" fill="white">• 数据湖架构</text>
    <text x="530" y="180" font-family="Arial, sans-serif" font-size="12" fill="white">• 海量数据处理</text>
    <text x="530" y="195" font-family="Arial, sans-serif" font-size="12" fill="white">• 机器学习训练</text>
  </g>

  <!-- CDN -->
  <g id="cdn">
    <rect x="20" y="230" width="300" height="150" rx="10" fill="url(#caseGrad3)" stroke="#06ffa5" stroke-width="2"/>
    <text x="170" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">内容分发网络 (CDN)</text>

    <!-- CDN nodes -->
    <circle cx="80" cy="310" r="15" fill="white" opacity="0.8"/>
    <text x="80" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">节点</text>

    <circle cx="130" cy="310" r="15" fill="white" opacity="0.8"/>
    <text x="130" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">节点</text>

    <circle cx="180" cy="310" r="15" fill="white" opacity="0.8"/>
    <text x="180" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">节点</text>

    <circle cx="230" cy="310" r="15" fill="white" opacity="0.8"/>
    <text x="230" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">节点</text>

    <circle cx="280" cy="310" r="15" fill="white" opacity="0.8"/>
    <text x="280" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">节点</text>

    <text x="170" y="345" font-family="Arial, sans-serif" font-size="12" fill="#333">• 就近访问</text>
    <text x="170" y="360" font-family="Arial, sans-serif" font-size="12" fill="#333">• 降低延迟</text>
    <text x="170" y="375" font-family="Arial, sans-serif" font-size="12" fill="#333">• 提高用户体验</text>
  </g>

  <!-- Enterprise Collaboration -->
  <g id="enterprise">
    <rect x="380" y="230" width="300" height="150" rx="10" fill="url(#caseGrad4)" stroke="#f72585" stroke-width="2"/>
    <text x="530" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">企业协作与文件共享</text>

    <!-- Collaboration icons -->
    <circle cx="450" cy="310" r="20" fill="white" opacity="0.8"/>
    <text x="450" y="315" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">用户</text>

    <circle cx="530" cy="310" r="20" fill="white" opacity="0.8"/>
    <text x="530" y="315" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">用户</text>

    <circle cx="610" cy="310" r="20" fill="white" opacity="0.8"/>
    <text x="610" y="315" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">用户</text>

    <!-- Connection lines -->
    <line x1="470" y1="310" x2="510" y2="310" stroke="white" stroke-width="2"/>
    <line x1="550" y1="310" x2="590" y2="310" stroke="white" stroke-width="2"/>

    <text x="530" y="345" font-family="Arial, sans-serif" font-size="12" fill="white">• 实时协作</text>
    <text x="530" y="360" font-family="Arial, sans-serif" font-size="12" fill="white">• 版本控制</text>
    <text x="530" y="375" font-family="Arial, sans-serif" font-size="12" fill="white">• 权限管理</text>
  </g>

  <!-- Personal Cloud Storage -->
  <g id="personal">
    <rect x="200" y="400" width="300" height="40" rx="8" fill="#4cc9f0" stroke="#4361ee" stroke-width="2"/>
    <text x="350" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">个人云盘 • 照片视频存储 • 文档同步 • 移动备份</text>
  </g>
</svg>