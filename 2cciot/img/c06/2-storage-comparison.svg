<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c92a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4dabf7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1971c2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="objectGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#69db7c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f9e44;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">存储类型对比</text>

  <!-- Block Storage Section -->
  <g id="block-storage">
    <rect x="20" y="60" width="200" height="380" rx="10" fill="url(#blockGrad)" stroke="#a61e1e" stroke-width="2"/>
    <text x="120" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">块存储</text>

    <!-- Block icon -->
    <rect x="70" y="110" width="100" height="60" fill="white" opacity="0.9" rx="5"/>
    <rect x="80" y="120" width="30" height="15" fill="#a61e1e"/>
    <rect x="120" y="120" width="30" height="15" fill="#a61e1e"/>
    <rect x="80" y="145" width="30" height="15" fill="#a61e1e"/>
    <rect x="120" y="145" width="30" height="15" fill="#a61e1e"/>

    <!-- Features -->
    <text x="120" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">特性:</text>
    <text x="30" y="225" font-family="Arial, sans-serif" font-size="12" fill="white">• 低延迟</text>
    <text x="30" y="245" font-family="Arial, sans-serif" font-size="12" fill="white">• 高性能</text>
    <text x="30" y="265" font-family="Arial, sans-serif" font-size="12" fill="white">• 固定大小块</text>
    <text x="30" y="285" font-family="Arial, sans-serif" font-size="12" fill="white">• 原始接口</text>

    <text x="120" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">用例:</text>
    <text x="30" y="345" font-family="Arial, sans-serif" font-size="12" fill="white">• 数据库</text>
    <text x="30" y="365" font-family="Arial, sans-serif" font-size="12" fill="white">• 虚拟机磁盘</text>
    <text x="30" y="385" font-family="Arial, sans-serif" font-size="12" fill="white">• 高性能计算</text>
    <text x="30" y="405" font-family="Arial, sans-serif" font-size="12" fill="white">• 事务系统</text>

    <text x="120" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">协议: iSCSI, FC</text>
  </g>

  <!-- File Storage Section -->
  <g id="file-storage">
    <rect x="250" y="60" width="200" height="380" rx="10" fill="url(#fileGrad)" stroke="#1864ab" stroke-width="2"/>
    <text x="350" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">文件存储</text>

    <!-- File icon -->
    <rect x="320" y="110" width="60" height="70" fill="white" opacity="0.9" rx="3"/>
    <polygon points="320,110 350,130 380,110" fill="white" opacity="0.7"/>
    <rect x="330" y="145" width="40" height="3" fill="#1864ab"/>
    <rect x="330" y="155" width="40" height="3" fill="#1864ab"/>
    <rect x="330" y="165" width="30" height="3" fill="#1864ab"/>

    <!-- Features -->
    <text x="350" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">特性:</text>
    <text x="260" y="225" font-family="Arial, sans-serif" font-size="12" fill="white">• 文件系统接口</text>
    <text x="260" y="245" font-family="Arial, sans-serif" font-size="12" fill="white">• 层次结构</text>
    <text x="260" y="265" font-family="Arial, sans-serif" font-size="12" fill="white">• 易于使用</text>
    <text x="260" y="285" font-family="Arial, sans-serif" font-size="12" fill="white">• 共享访问</text>

    <text x="350" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">用例:</text>
    <text x="260" y="345" font-family="Arial, sans-serif" font-size="12" fill="white">• 文件共享</text>
    <text x="260" y="365" font-family="Arial, sans-serif" font-size="12" fill="white">• Web内容存储</text>
    <text x="260" y="385" font-family="Arial, sans-serif" font-size="12" fill="white">• 开发环境</text>
    <text x="260" y="405" font-family="Arial, sans-serif" font-size="12" fill="white">• 用户主目录</text>

    <text x="350" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">协议: NFS, SMB/CIFS</text>
  </g>

  <!-- Object Storage Section -->
  <g id="object-storage">
    <rect x="480" y="60" width="200" height="380" rx="10" fill="url(#objectGrad)" stroke="#2b8a3e" stroke-width="2"/>
    <text x="580" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">对象存储</text>

    <!-- Object icon -->
    <ellipse cx="580" cy="140" rx="40" ry="25" fill="white" opacity="0.9"/>
    <text x="580" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b8a3e">Object</text>

    <!-- Features -->
    <text x="580" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">特性:</text>
    <text x="490" y="225" font-family="Arial, sans-serif" font-size="12" fill="white">• 无限扩展</text>
    <text x="490" y="245" font-family="Arial, sans-serif" font-size="12" fill="white">• 低成本</text>
    <text x="490" y="265" font-family="Arial, sans-serif" font-size="12" fill="white">• HTTP访问</text>
    <text x="490" y="285" font-family="Arial, sans-serif" font-size="12" fill="white">• 平面结构</text>

    <text x="580" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">用例:</text>
    <text x="490" y="345" font-family="Arial, sans-serif" font-size="12" fill="white">• 大数据存储</text>
    <text x="490" y="365" font-family="Arial, sans-serif" font-size="12" fill="white">• 备份归档</text>
    <text x="490" y="385" font-family="Arial, sans-serif" font-size="12" fill="white">• 媒体内容</text>
    <text x="490" y="405" font-family="Arial, sans-serif" font-size="12" fill="white">• CDN源站</text>

    <text x="580" y="430" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">协议: HTTP/HTTPS, REST</text>
  </g>
</svg>