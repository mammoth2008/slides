<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec7211;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="s3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#569a31;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4d8f2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ebsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8c4fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7441d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="efsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7f27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6200;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glacierGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00bfa5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009d86;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">AWS 存储服务</text>

  <!-- AWS Cloud -->
  <ellipse cx="300" cy="70" rx="80" ry="30" fill="#ff9900" opacity="0.2"/>
  <text x="300" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ff9900">AWS Cloud</text>

  <!-- S3 Service -->
  <g id="s3">
    <rect x="50" y="130" width="180" height="120" rx="10" fill="url(#s3Grad)" stroke="#4d8f2a" stroke-width="2"/>
    <text x="140" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Amazon S3</text>
    <text x="140" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">对象存储</text>
    <text x="60" y="205" font-family="Arial, sans-serif" font-size="11" fill="white">• 无限扩展</text>
    <text x="60" y="220" font-family="Arial, sans-serif" font-size="11" fill="white">• 高持久性</text>
    <text x="60" y="235" font-family="Arial, sans-serif" font-size="11" fill="white">• 低成本</text>
  </g>

  <!-- EBS Service -->
  <g id="ebs">
    <rect x="250" y="130" width="180" height="120" rx="10" fill="url(#ebsGrad)" stroke="#7441d8" stroke-width="2"/>
    <text x="340" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Amazon EBS</text>
    <text x="340" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">块存储</text>
    <text x="260" y="205" font-family="Arial, sans-serif" font-size="11" fill="white">• 低延迟</text>
    <text x="260" y="220" font-family="Arial, sans-serif" font-size="11" fill="white">• 高性能</text>
    <text x="260" y="235" font-family="Arial, sans-serif" font-size="11" fill="white">• 快照备份</text>
  </g>

  <!-- EFS Service -->
  <g id="efs">
    <rect x="50" y="270" width="180" height="120" rx="10" fill="url(#efsGrad)" stroke="#ff6200" stroke-width="2"/>
    <text x="140" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Amazon EFS</text>
    <text x="140" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">文件存储</text>
    <text x="60" y="345" font-family="Arial, sans-serif" font-size="11" fill="white">• 可扩展</text>
    <text x="60" y="360" font-family="Arial, sans-serif" font-size="11" fill="white">• 共享访问</text>
    <text x="60" y="375" font-family="Arial, sans-serif" font-size="11" fill="white">• NFS协议</text>
  </g>

  <!-- Glacier Service -->
  <g id="glacier">
    <rect x="250" y="270" width="180" height="120" rx="10" fill="url(#glacierGrad)" stroke="#009d86" stroke-width="2"/>
    <text x="340" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Amazon Glacier</text>
    <text x="340" y="320" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">归档存储</text>
    <text x="260" y="345" font-family="Arial, sans-serif" font-size="11" fill="white">• 极低成本</text>
    <text x="260" y="360" font-family="Arial, sans-serif" font-size="11" fill="white">• 长期保存</text>
    <text x="260" y="375" font-family="Arial, sans-serif" font-size="11" fill="white">• 数据检索</text>
  </g>

  <!-- Storage Gateway -->
  <g id="gateway">
    <rect x="450" y="200" width="130" height="120" rx="10" fill="#5c4ee5" stroke="#4238b3" stroke-width="2"/>
    <text x="515" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Storage</text>
    <text x="515" y="248" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Gateway</text>
    <text x="460" y="270" font-family="Arial, sans-serif" font-size="10" fill="white">• 混合云</text>
    <text x="460" y="285" font-family="Arial, sans-serif" font-size="10" fill="white">• 本地集成</text>
    <text x="460" y="300" font-family="Arial, sans-serif" font-size="10" fill="white">• 安全连接</text>
  </g>

  <!-- Connection lines from AWS Cloud -->
  <line x1="300" y1="100" x2="140" y2="130" stroke="#ff9900" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="100" x2="340" y2="130" stroke="#ff9900" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="100" x2="140" y2="270" stroke="#ff9900" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="100" x2="340" y2="270" stroke="#ff9900" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="100" x2="515" y2="200" stroke="#ff9900" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Use Cases -->
  <text x="50" y="420" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">使用场景:</text>
  <text x="120" y="420" font-family="Arial, sans-serif" font-size="11" fill="#555">S3: 静态网站、数据湖</text>
  <text x="280" y="420" font-family="Arial, sans-serif" font-size="11" fill="#555">EBS: 数据库、应用服务器</text>
  <text x="450" y="420" font-family="Arial, sans-serif" font-size="11" fill="#555">EFS: 共享文件系统</text>
  <text x="50" y="440" font-family="Arial, sans-serif" font-size="11" fill="#555">Glacier: 备份归档</text>
  <text x="200" y="440" font-family="Arial, sans-serif" font-size="11" fill="#555">Gateway: 混合云存储</text>
</svg>