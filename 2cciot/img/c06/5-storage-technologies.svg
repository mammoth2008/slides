<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="techGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">存储云关键技术</text>

  <!-- Data Sharding & Replication -->
  <g id="sharding">
    <rect x="20" y="60" width="300" height="180" rx="10" fill="url(#techGrad1)" stroke="#5a67d8" stroke-width="2"/>
    <text x="170" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">数据分片和副本机制</text>

    <!-- Data blocks representation -->
    <rect x="40" y="110" width="40" height="30" fill="white" opacity="0.8" rx="3"/>
    <text x="60" y="130" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">D1</text>

    <rect x="90" y="110" width="40" height="30" fill="white" opacity="0.8" rx="3"/>
    <text x="110" y="130" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">D2</text>

    <rect x="140" y="110" width="40" height="30" fill="white" opacity="0.8" rx="3"/>
    <text x="160" y="130" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">D3</text>

    <rect x="190" y="110" width="40" height="30" fill="white" opacity="0.8" rx="3"/>
    <text x="210" y="130" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">D4</text>

    <!-- Replication indicators -->
    <text x="40" y="165" font-family="Arial, sans-serif" font-size="12" fill="white">• 提高可用性</text>
    <text x="40" y="185" font-family="Arial, sans-serif" font-size="12" fill="white">• 负载均衡</text>
    <text x="40" y="205" font-family="Arial, sans-serif" font-size="12" fill="white">• 故障容错</text>
    <text x="40" y="225" font-family="Arial, sans-serif" font-size="12" fill="white">• 数据一致性</text>
  </g>

  <!-- Consistent Hashing -->
  <g id="hashing">
    <rect x="380" y="60" width="300" height="180" rx="10" fill="url(#techGrad2)" stroke="#e53e3e" stroke-width="2"/>
    <text x="530" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">一致性哈希算法</text>

    <!-- Hash ring representation -->
    <circle cx="530" cy="150" r="40" fill="none" stroke="white" stroke-width="3"/>
    <text x="530" y="155" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Hash Ring</text>

    <!-- Nodes around ring -->
    <circle cx="530" cy="100" r="8" fill="white"/>
    <circle cx="575" cy="130" r="8" fill="white"/>
    <circle cx="575" cy="170" r="8" fill="white"/>
    <circle cx="530" cy="200" r="8" fill="white"/>
    <circle cx="485" cy="170" r="8" fill="white"/>
    <circle cx="485" cy="130" r="8" fill="white"/>

    <text x="400" y="165" font-family="Arial, sans-serif" font-size="12" fill="white">• 负载均衡</text>
    <text x="400" y="185" font-family="Arial, sans-serif" font-size="12" fill="white">• 动态扩容</text>
    <text x="400" y="205" font-family="Arial, sans-serif" font-size="12" fill="white">• 减少数据迁移</text>
    <text x="400" y="225" font-family="Arial, sans-serif" font-size="12" fill="white">• 高效定位</text>
  </g>

  <!-- Erasure Coding -->
  <g id="erasure">
    <rect x="20" y="260" width="300" height="180" rx="10" fill="url(#techGrad3)" stroke="#0987a0" stroke-width="2"/>
    <text x="170" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">纠删码技术</text>

    <!-- Erasure coding representation -->
    <rect x="40" y="310" width="25" height="20" fill="white" opacity="0.8" rx="2"/>
    <text x="52" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">D</text>

    <text x="80" y="325" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">→</text>

    <rect x="100" y="310" width="25" height="20" fill="white" opacity="0.8" rx="2"/>
    <text x="112" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">P1</text>

    <rect x="135" y="310" width="25" height="20" fill="white" opacity="0.8" rx="2"/>
    <text x="147" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">P2</text>

    <rect x="170" y="310" width="25" height="20" fill="white" opacity="0.8" rx="2"/>
    <text x="182" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">P3</text>

    <rect x="205" y="310" width="25" height="20" fill="white" opacity="0.8" rx="2"/>
    <text x="217" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">P4</text>

    <text x="40" y="365" font-family="Arial, sans-serif" font-size="12" fill="white">• 高可靠性</text>
    <text x="40" y="385" font-family="Arial, sans-serif" font-size="12" fill="white">• 低存储开销</text>
    <text x="40" y="405" font-family="Arial, sans-serif" font-size="12" fill="white">• 容错能力强</text>
    <text x="40" y="425" font-family="Arial, sans-serif" font-size="12" fill="white">• 适用于冷数据</text>
  </g>

  <!-- Distributed File System -->
  <g id="distributed">
    <rect x="380" y="260" width="300" height="180" rx="10" fill="url(#techGrad4)" stroke="#0fb900" stroke-width="2"/>
    <text x="530" y="290" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">分布式文件系统</text>

    <!-- Distributed nodes representation -->
    <rect x="420" y="310" width="50" height="35" fill="white" opacity="0.8" rx="5"/>
    <text x="445" y="332" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Node1</text>

    <rect x="480" y="310" width="50" height="35" fill="white" opacity="0.8" rx="5"/>
    <text x="505" y="332" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Node2</text>

    <rect x="540" y="310" width="50" height="35" fill="white" opacity="0.8" rx="5"/>
    <text x="565" y="332" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Node3</text>

    <!-- Connection lines -->
    <line x1="470" y1="327" x2="480" y2="327" stroke="white" stroke-width="2"/>
    <line x1="530" y1="327" x2="540" y2="327" stroke="white" stroke-width="2"/>

    <text x="400" y="365" font-family="Arial, sans-serif" font-size="12" fill="white">• 横向扩展</text>
    <text x="400" y="385" font-family="Arial, sans-serif" font-size="12" fill="white">• 高并发</text>
    <text x="400" y="405" font-family="Arial, sans-serif" font-size="12" fill="white">• 容错性</text>
    <text x="400" y="425" font-family="Arial, sans-serif" font-size="12" fill="white">• 地理分布</text>
  </g>
</svg>