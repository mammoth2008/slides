<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3d9f2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="storageGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cloud background -->
  <path d="M 150 80 Q 120 80, 120 110 Q 90 110, 90 140 Q 90 170, 120 170 L 480 170 Q 510 170, 510 140 Q 540 140, 540 110 Q 540 80, 510 80 Q 510 50, 480 50 Q 450 20, 400 20 Q 350 20, 320 50 L 200 50 Q 170 50, 150 80"
        fill="url(#cloudGradient)" stroke="#2c5aa0" stroke-width="2"/>

  <!-- Cloud Storage text -->
  <text x="300" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c5aa0">存储云</text>

  <!-- Storage types boxes -->
  <!-- Block Storage -->
  <rect x="50" y="220" width="150" height="120" rx="10" fill="url(#storageGradient)" stroke="#2c5aa0" stroke-width="2"/>
  <text x="125" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">块存储</text>
  <text x="125" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">低延迟</text>
  <text x="125" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">高性能</text>
  <text x="125" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">数据库/虚拟机</text>

  <!-- File Storage -->
  <rect x="225" y="220" width="150" height="120" rx="10" fill="url(#storageGradient)" stroke="#2c5aa0" stroke-width="2"/>
  <text x="300" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">文件存储</text>
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">文件系统</text>
  <text x="300" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">易于使用</text>
  <text x="300" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">文件共享</text>

  <!-- Object Storage -->
  <rect x="400" y="220" width="150" height="120" rx="10" fill="url(#storageGradient)" stroke="#2c5aa0" stroke-width="2"/>
  <text x="475" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">对象存储</text>
  <text x="475" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">无限扩展</text>
  <text x="475" y="285" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">低成本</text>
  <text x="475" y="300" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">大数据/备份</text>

  <!-- Connection lines -->
  <line x1="300" y1="170" x2="125" y2="220" stroke="#2c5aa0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="170" x2="300" y2="220" stroke="#2c5aa0" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="170" x2="475" y2="220" stroke="#2c5aa0" stroke-width="2" stroke-dasharray="5,5"/>
</svg>